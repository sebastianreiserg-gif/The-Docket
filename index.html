<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Docket</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F2733" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE3;
    --paper-raised:#FAF7F0;
    --ink:#1F2733;
    --ink-soft:#5C6773;
    --rule:#CBBFA6;
    --oxblood:#7C2D2D;
    --oxblood-dark:#5E2121;
    --brass:#A98544;
    --green-ok:#3E5C3E;
    --shadow: 0 1px 2px rgba(31,39,51,0.08), 0 4px 14px rgba(31,39,51,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      linear-gradient(var(--paper), var(--paper));
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:0.035;
    background-image:radial-gradient(circle at 1px 1px, #1F2733 1px, transparent 0);
    background-size:22px 22px;
    z-index:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Libre Caslon Display', 'Source Serif 4', serif;}

  #app{position:relative;z-index:1;display:flex;min-height:100vh;}

  /* Sidebar — case-file tabs */
  .sidebar{
    width:230px;flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--rule);
    display:flex;flex-direction:column;
    padding:22px 0 16px;
  }
  .brand{
    padding:0 20px 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:10px;
  }
  .brand .display{font-size:22px;letter-spacing:0.3px;line-height:1.15;}
  .brand .mono{font-size:10px;color:var(--ink-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}

  .course-tab{
    position:relative;
    padding:13px 20px 13px 24px;
    cursor:pointer;
    border-bottom:1px solid rgba(203,191,166,0.5);
    transition:background 0.15s ease;
  }
  .course-tab:hover{background:rgba(122,45,45,0.05);}
  .course-tab.active{background:var(--paper);}
  .course-tab.active::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--oxblood);
  }
  .course-tab .name{font-size:15px;font-weight:600;display:block;}
  .course-tab .count{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  .add-course{
    padding:11px 20px 11px 24px;
    font-size:13px;color:var(--ink-soft);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .add-course:hover{color:var(--oxblood);}

  .sidebar-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--rule);}
  .settings-btn{
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink-soft);cursor:pointer;padding:8px 0;
  }
  .settings-btn:hover{color:var(--ink);}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    padding:24px 32px 16px;
    border-bottom:1px solid var(--rule);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;row-gap:14px;
  }
  .topbar h1{margin:0;font-size:28px;font-weight:400;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:4px;text-transform:uppercase;letter-spacing:1px;}

  .ref-strip{
    padding:16px 32px 18px;
    border-bottom:1px solid var(--rule);
    background:var(--paper-raised);
    display:flex;flex-direction:column;gap:10px;
  }
  .ref-strip-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--ink-soft);white-space:nowrap;
  }
  .ref-tabs{
    display:flex;width:100%;
    border:1px solid var(--rule);
    background:var(--paper);
    box-shadow:var(--shadow);
  }
  .ref-tab{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:9px;
    padding:14px 12px;
    border:none;border-right:1px solid var(--rule);
    background:transparent;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.3px;
    color:var(--ink-soft);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .ref-tab:last-child{ border-right:none; }
  .ref-tab:hover{background:rgba(122,45,45,0.06);color:var(--oxblood);}
  .ref-tab-icon{color:var(--brass);font-size:14px;transition:color 0.15s ease;}
  .ref-tab:hover .ref-tab-icon{color:var(--oxblood);}

  .searchwrap{position:relative;flex:1 1 160px;min-width:140px;max-width:260px;}
  .searchwrap input{
    width:100%;padding:9px 12px 9px 30px;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    color:var(--ink);
  }
  .searchwrap input:focus{outline:2px solid var(--oxblood);outline-offset:-1px;}
  .searchwrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:13px;}

  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    padding:10px 16px;border:1px solid var(--oxblood);
    background:var(--oxblood);color:var(--paper-raised);
    cursor:pointer;letter-spacing:0.3px;
  }
  .btn:hover{background:var(--oxblood-dark);}
  .btn.ghost{background:transparent;color:var(--oxblood);}
  .btn.ghost:hover{background:rgba(122,45,45,0.08);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .content{flex:1;overflow-y:auto;padding:24px 32px 60px;}

  .empty{
    margin-top:60px;text-align:center;color:var(--ink-soft);
  }
  .empty .display{font-size:20px;color:var(--ink);margin-bottom:6px;}

  .docket-list{display:flex;flex-direction:column;gap:10px;}
  .entry{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-left:3px solid var(--brass);
    padding:14px 18px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;
    box-shadow:var(--shadow);
  }
  .entry:hover{border-left-color:var(--oxblood);}
  .entry .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.5px;}
  .entry .title{font-size:16px;margin:2px 0 4px;}
  .entry .meta{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .entry .status{font-size:10.5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.8px;padding:3px 8px;border:1px solid var(--rule);white-space:nowrap;}
  .status.ready{color:var(--green-ok);border-color:var(--green-ok);}
  .status.working{color:var(--brass);border-color:var(--brass);}
  .status.error{color:var(--oxblood);border-color:var(--oxblood);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(31,39,51,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal.wide{max-width:760px;}
  .modal.legal-pad-modal{max-width:800px;}

  /* Legal pad — Case Briefs notebook */
  .legal-pad{
    background-color:#FBF3AE;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 32px, rgba(90,110,170,0.45) 32px, rgba(90,110,170,0.45) 33px, transparent 33px, transparent 44px);
    background-position: 0 3px;
    position:relative;
    padding:20px 24px 28px 60px;
    border:1px solid #DECF6E;
    box-shadow: inset 0 0 24px rgba(0,0,0,0.05);
  }
  .legal-pad::before{
    content:"";
    position:absolute; top:0; bottom:0; left:42px;
    width:2px; background:rgba(190,60,60,0.55);
  }
  .legal-pad-section{ margin-bottom:44px; }
  /* Topic title and case name are both serif-family and both need a downward nudge
     to land where they should — sharing one rule keeps them consistent with each other. */
  input.legal-pad-section-title, input.legal-pad-case-name{
    height:44px !important;
    box-sizing:border-box !important;
    line-height:26px !important;
    padding-top:18px !important;
    padding-bottom:0 !important;
    margin:0 !important;
  }
  .legal-pad-field-label{
    height:44px !important;
    box-sizing:border-box !important;
    line-height:26px !important;
    padding-top:18px !important;
    padding-bottom:0 !important;
    margin:0 !important;
  }
  input.legal-pad-section-title{
    font-family:'Libre Caslon Display', serif !important;
    font-size:30px !important;
    color:#7C2D2D !important;
    text-decoration:underline;
    text-decoration-color:rgba(124,45,45,0.4);
    background:transparent !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    width:100%;
  }
  .legal-pad-block{
    margin:0 0 44px;
    padding-bottom:0;
  }
  .legal-pad-section-body > .legal-pad-block:last-of-type{
    margin-bottom:0;
  }
  input.legal-pad-case-name{
    font-family:'Source Serif 4', serif !important;
    font-weight:700;
    font-style:italic;
    font-size:26px !important;
    color:#1F2733 !important;
    background:transparent !important;
    border:none !important;
    border-bottom:1px solid rgba(31,39,51,0.25) !important;
    border-radius:0 !important;
    box-shadow:none !important;
    width:100%;
  }
  .legal-pad-field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:18px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#8A6D1E;
  }
  textarea.legal-pad-field{
    font-family:'Source Serif 4', serif !important;
    font-size:26px !important;
    line-height:44px !important;
    min-height:44px;
    color:#1F2733 !important;
    background:transparent !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    width:100%;
    resize:none;
    overflow:hidden;
    field-sizing:content;
    padding:0 !important;
    margin:0;
  }
  input.legal-pad-field:focus, input.legal-pad-case-name:focus, input.legal-pad-section-title:focus, textarea.legal-pad-field:focus{
    outline:none; background:rgba(255,255,255,0.28) !important;
  }
  .legal-pad-block[data-locked="1"] input, .legal-pad-block[data-locked="1"] textarea, .legal-pad-section[data-locked="1"] input.legal-pad-section-title{
    pointer-events:none;
  }
  .legal-pad-datechip{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:17px;
    color:#5C4A0E; background:rgba(138,109,30,0.12);
    border:1px solid rgba(138,109,30,0.35);
    padding:4px 10px; margin:3px 6px 3px 0;
  }
  .legal-pad-datechip button{
    background:none; border:none; color:#7C2D2D; cursor:pointer; font-size:18px; padding:0; line-height:1;
  }
  .legal-pad-adddate-btn{
    font-family:'IBM Plex Mono', monospace !important;
    font-size:16px !important;
    background:rgba(255,255,255,0.5) !important;
    border:1px solid rgba(138,109,30,0.35) !important;
    color:#5C4A0E !important;
    padding:4px 12px !important;
    cursor:pointer;
    height:32px;
    box-sizing:border-box;
  }
  input[type=date].legal-pad-adddate-hidden{
    position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; border:none; padding:0;
  }
  .modal-head{
    padding:20px 24px;border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h2{margin:0;font-size:20px;font-weight:400;}
  .modal-close{cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
  .modal-close:hover{color:var(--oxblood);}
  .modal-body{padding:22px 24px;}

  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);margin:16px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=password], select, textarea{
    width:100%;padding:10px 12px;
    background:var(--paper);border:1px solid var(--rule);
    font-family:'Source Serif 4',serif;font-size:14.5px;color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--oxblood);outline-offset:-1px;}
  .filepick{
    border:1.5px dashed var(--rule);padding:22px;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);
    cursor:pointer;
  }
  .filepick:hover{border-color:var(--oxblood);color:var(--ink);}
  .filepick.has-file{border-style:solid;color:var(--ink);}

  .mode-row{display:flex;gap:10px;margin-top:6px;}
  .mode-opt{
    flex:1;padding:10px 12px;border:1px solid var(--rule);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;
  }
  .mode-opt.sel{border-color:var(--oxblood);background:rgba(122,45,45,0.06);color:var(--oxblood);}

  .progress{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .dot{width:6px;height:6px;background:var(--brass);border-radius:50%;animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}

  .modal-foot{padding:16px 24px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;}

  /* Detail view */
  .detail-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--brass);border-bottom:1px solid var(--rule);padding-bottom:6px;margin:22px 0 12px;}
  .section-label:first-of-type{margin-top:0;}
  .summary-body{font-size:15.5px;line-height:1.7;white-space:pre-wrap;}
  .transcript-body{font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--ink-soft);max-height:340px;overflow-y:auto;background:var(--paper);padding:14px;border:1px solid var(--rule);}

  .help{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .err-box{background:rgba(122,45,45,0.08);border:1px solid var(--oxblood);color:var(--oxblood-dark);padding:10px 12px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-top:12px;}

  @media (max-width:720px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px 0;}
    .brand{display:none;}
    .sidebar-foot{margin-top:0;border-top:none;border-left:1px solid var(--rule);padding:0 16px;}
    .course-tab{white-space:nowrap;border-bottom:none;}
    .topbar{flex-direction:column;align-items:stretch;}
    .ref-strip{gap:10px;padding:14px 16px;}
    .ref-tabs{flex-direction:column;width:100%;}
    .ref-tab{border-right:none;border-bottom:1px solid var(--rule);justify-content:flex-start;padding:13px 14px;}
    .ref-tabs .ref-tab:last-child{border-bottom:none;}
    .searchwrap input{width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ STATE ============ */
const DEFAULT_COURSES = [
  { id: 'torts', name: 'Torts' },
  { id: 'prof-id', name: 'Professional Identity' },
  { id: 'lrw', name: 'Legal Research & Writing' },
];

function mergeTermArrays(oldArr, newArr){
  // Regenerating shouldn't lose terms just because this run's extraction judgment call
  // landed slightly differently — merge by term name instead of overwriting outright.
  const map = {};
  (oldArr||[]).forEach(t => { if(t && t.term) map[t.term.trim().toLowerCase()] = t; });
  (newArr||[]).forEach(t => { if(t && t.term) map[t.term.trim().toLowerCase()] = t; }); // fresher data wins on overlap
  return Object.values(map);
}
function mergeCaseArrays(oldArr, newArr){
  const map = {};
  (oldArr||[]).forEach(c => { if(c && c.name) map[c.name.trim().toLowerCase()] = c; });
  (newArr||[]).forEach(c => { if(c && c.name) map[c.name.trim().toLowerCase()] = c; });
  return Object.values(map);
}

function normalizeLectures(lectures){
  return (lectures||[]).map(l => {
    // Migrate old string-based todos (pre-checklist format) into structured items.
    if(typeof l.todos === 'string'){
      const lines = l.todos.split('\n').map(s => s.replace(/^[-•*\s]+/, '').trim()).filter(Boolean);
      const useful = lines.filter(s => !/^no action items/i.test(s));
      l.todos = useful.map((text, i) => ({ id: 't_migrated_' + l.id + '_' + i, text, dueDate: null, done: false }));
    }
    if(!Array.isArray(l.todos)) l.todos = [];
    l.todos = l.todos.map((t, i) => ({
      id: t.id || ('t_migrated_' + l.id + '_' + i),
      text: t.text || '',
      dueDate: t.dueDate || null,
      done: !!t.done
    }));

    if(!Array.isArray(l.caseLaw)) l.caseLaw = [];
    l.caseLaw = l.caseLaw.map(c => ({ ...c, citation: c && c.citation ? c.citation : null }));

    if(!Array.isArray(l.keyTerms)) l.keyTerms = [];
    // The Black's Law (1910) formal-definition feature was removed entirely — strip any
    // leftover fields from older data so nothing dead lingers, no button required.
    l.keyTerms = l.keyTerms.map(t => {
      const { formalDefinition, formalDefinitionSource, ...rest } = t || {};
      return rest;
    });
    if(typeof l.keyPoints !== 'string') l.keyPoints = l.keyPoints ? String(l.keyPoints) : '';
    if(typeof l.policyNotes !== 'string') l.policyNotes = l.policyNotes ? String(l.policyNotes) : '';

    return l;
  });
}

function loadState(){
  let courses, lectures, settings, deletedLectureIds, termProgress, caseBriefs, courseDocs, customTerms, deletedTerms, caseBriefNotebooks, issueSpottingProgress;
  try { courses = JSON.parse(localStorage.getItem('docket:courses')) || DEFAULT_COURSES; } catch(e){ courses = DEFAULT_COURSES; }
  courses = courses.map(c => ({ ...c, archived: !!c.archived }));
  try { lectures = JSON.parse(localStorage.getItem('docket:lectures')) || []; } catch(e){ lectures = []; }
  try { settings = JSON.parse(localStorage.getItem('docket:settings')) || {}; } catch(e){ settings = {}; }
  try { deletedLectureIds = JSON.parse(localStorage.getItem('docket:deleted')) || []; } catch(e){ deletedLectureIds = []; }
  try { termProgress = JSON.parse(localStorage.getItem('docket:termProgress')) || {}; } catch(e){ termProgress = {}; }
  try { caseBriefs = JSON.parse(localStorage.getItem('docket:caseBriefs')) || {}; } catch(e){ caseBriefs = {}; }
  try { courseDocs = JSON.parse(localStorage.getItem('docket:courseDocs')) || {}; } catch(e){ courseDocs = {}; }
  try { customTerms = JSON.parse(localStorage.getItem('docket:customTerms')) || {}; } catch(e){ customTerms = {}; }
  try { deletedTerms = JSON.parse(localStorage.getItem('docket:deletedTerms')) || []; } catch(e){ deletedTerms = []; }
  try { caseBriefNotebooks = JSON.parse(localStorage.getItem('docket:caseBriefNotebooks')) || {}; } catch(e){ caseBriefNotebooks = {}; }
  try { issueSpottingProgress = JSON.parse(localStorage.getItem('docket:issueSpottingProgress')) || {}; } catch(e){ issueSpottingProgress = {}; }
  settings.mode = settings.mode || 'local';
  settings.deepgramKey = settings.deepgramKey || '';
  settings.anthropicKey = settings.anthropicKey || '';
  settings.githubToken = settings.githubToken || '';
  settings.gistId = settings.gistId || '';
  settings.lastSync = settings.lastSync || 0;
  settings.termReviewMode = settings.termReviewMode || 'auto';
  settings.briefTemplateFields = (Array.isArray(settings.briefTemplateFields) && settings.briefTemplateFields.length) ? settings.briefTemplateFields : ['Facts','Issue','Rule','Analysis','Conclusion'];
  lectures = normalizeLectures(lectures);
  return { courses, lectures, settings, deletedLectureIds, termProgress, caseBriefs, courseDocs, customTerms, deletedTerms, caseBriefNotebooks, issueSpottingProgress };
}
function saveState(){
  localStorage.setItem('docket:courses', JSON.stringify(state.courses));
  localStorage.setItem('docket:lectures', JSON.stringify(state.lectures));
  localStorage.setItem('docket:settings', JSON.stringify(state.settings));
  localStorage.setItem('docket:deleted', JSON.stringify(state.deletedLectureIds||[]));
  localStorage.setItem('docket:termProgress', JSON.stringify(state.termProgress||{}));
  localStorage.setItem('docket:caseBriefs', JSON.stringify(state.caseBriefs||{}));
  localStorage.setItem('docket:caseBriefNotebooks', JSON.stringify(state.caseBriefNotebooks||{}));
  localStorage.setItem('docket:deletedTerms', JSON.stringify(state.deletedTerms||[]));
  localStorage.setItem('docket:customTerms', JSON.stringify(state.customTerms||{}));
  localStorage.setItem('docket:issueSpottingProgress', JSON.stringify(state.issueSpottingProgress||{}));
  localStorage.setItem('docket:courseDocs', JSON.stringify(state.courseDocs||{}));
}

let state = loadState();
let ui = {
  activeCourse: state.courses.find(c => !c.archived)?.id || null,
  search: '',
  showUpload: false,
  showSettings: false,
  showDashboard: false,
  showArchived: false,

function renderDashboardView(){
  const activeCourses = state.courses.filter(c => !c.archived);
  const today = todayStr();
  let totalDue = 0, totalTerms = 0, totalMastered = 0;
  const rows = activeCourses.map(c => {
    const dict = buildDictionary(c.id);
    const due = dict.filter(d => { const p = getTermProgress(c.id, d.term); return !p || p.nextReview <= today; }).length;
    const mastered = dict.filter(d => { const p = getTermProgress(c.id, d.term); return p && p.box >= 4; }).length;
    totalDue += due; totalTerms += dict.length; totalMastered += mastered;
    const todos = buildTodoBoard(c.id).filter(t => !t.done);
    const overdueTodos = todos.filter(t => t.dueDate && t.dueDate < today).length;
    return { course: c, termCount: dict.length, due, mastered, todosOpen: todos.length, overdueTodos };
  });
  const overallMasteryPct = totalTerms ? Math.round((totalMastered/totalTerms)*100) : 0;

  return `
  <div class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div class="sub">Across ${activeCourses.length} active course${activeCourses.length===1?'':'s'}</div>

    </div>
    <div class="content">
      ${activeCourses.length === 0 ? `

          </div>
          <div style="flex:1;min-width:140px;background:var(--paper-raised);border:1px solid var(--rule);border-left:3px solid var(--brass);padding:14px 16px;">
            <div class="mono" style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.8px;">Overall mastery</div>
            <div class="display" style="font-size:26px;margin-top:4px;">${overallMasteryPct}%</div>
          </div>
          <div style="flex:1;min-width:140px;background:var(--paper-raised);border:1px solid var(--rule);border-left:3px solid var(--green-ok);padding:14px 16px;">
            <div class="mono" style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.8px;">Total terms tracked</div>
            <div class="display" style="font-size:26px;margin-top:4px;">${totalTerms}</div>

          ${rows.map(r => `
            <div class="entry" data-dash-course="${r.course.id}" style="cursor:pointer;">
              <div>
                <div class="title">${escapeHtml(r.course.name)}</div>
                <div class="meta">${r.termCount} term${r.termCount===1?'':'s'} &middot; ${r.due} due &middot; ${r.mastered} mastered${r.todosOpen ? ` &middot; ${r.todosOpen} open to-do${r.todosOpen===1?'':'s'}` : ''}${r.overdueTodos ? ` &middot; <span style="color:var(--oxblood);">${r.overdueTodos} overdue</span>` : ''}</div>

  </div>`;
}

        <div class="empty">

function docketNumber(lecture){
  const course = state.courses.find(c=>c.id===lecture.courseId);
  const prefix = (course ? course.name : 'GEN').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3);
  const siblings = state.lectures.filter(l=>l.courseId===lecture.courseId).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const idx = siblings.findIndex(l=>l.id===lecture.id) + 1;
  return `${prefix}-${String(idx).padStart(3,'0')}`;
}

function renderEntry(l, q){
  const statusClass = l.status === 'ready' ? 'ready' : (l.status === 'error' ? 'error' : 'working');
  const statusText = l.status === 'ready' ? 'Transcribed' : (l.status === 'error' ? 'Failed' : 'Processing');
  return `
  <div class="entry" data-lecture="${l.id}">
    <div>
      <div class="num">${docketNumber(l)}${q ? ' &middot; ' + escapeHtml(state.courses.find(c=>c.id===l.courseId)?.name || '') : ''}</div>
      <div class="title">${escapeHtml(l.title || 'Untitled recording')}</div>
      <div class="meta">${l.date || ''}${l.durationLabel ? ' &middot; ' + l.durationLabel : ''}</div>
    </div>
    <div class="status ${statusClass}">${statusText}</div>
  </div>`;
}

/* ============ MODALS ============ */
function renderUploadModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'uploadOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>New Recording</h2>
        <button class="modal-close" id="closeUpload">&times;</button>
      </div>
      <div class="modal-body">
        <label>Course</label>
        <select id="fCourse">
          ${state.courses.map(c=>`<option value="${c.id}" ${c.id===ui.activeCourse?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>

        <label>Title</label>
        <input type="text" id="fTitle" placeholder="e.g. Duty of Care &mdash; Palsgraf" />

        <label>Date</label>
        <input type="date" id="fDate" value="${new Date().toISOString().slice(0,10)}" />

        <label>Video or audio file</label>
        <div class="filepick" id="filePick">Click to choose a file, or drag one here — video or audio (MP4, MOV, MP3, M4A, WAV, AAC, etc.)</div>
        <input type="file" id="fFile" accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mp3,.m4a,.wav,.aac,.ogg,.flac" style="display:none" />

        <label>Transcription mode</label>
        <div class="mode-row">
          <div class="mode-opt ${state.settings.mode==='local'?'sel':''}" data-mode="local">Local (free, in-browser)</div>
          <div class="mode-opt ${state.settings.mode==='cloud'?'sel':''}" data-mode="cloud">Cloud (Deepgram key)</div>
        </div>
        <div class="help" id="modeHelp"></div>

        <div id="uploadProgress"></div>
        <div id="uploadError"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="cancelUpload">Cancel</button>
        <button class="btn" id="startTranscribe">Transcribe</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('closeUpload').onclick = () => { ui.showUpload = false; overlay.remove(); };
  document.getElementById('cancelUpload').onclick = () => { ui.showUpload = false; overlay.remove(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ ui.showUpload=false; overlay.remove(); }});

  const filePick = document.getElementById('filePick');
  const fFile = document.getElementById('fFile');
  filePick.onclick = () => fFile.click();
  fFile.onchange = () => {
    if(fFile.files[0]){
      filePick.textContent = fFile.files[0].name;
      filePick.classList.add('has-file');
    }
  };
  filePick.addEventListener('dragover', (e) => { e.preventDefault(); filePick.style.borderColor = 'var(--oxblood)'; });
  filePick.addEventListener('dragleave', () => { filePick.style.borderColor = ''; });
  filePick.addEventListener('drop', (e) => {
    e.preventDefault();
    filePick.style.borderColor = '';
    const dropped = e.dataTransfer.files[0];
    if(dropped){
      const dt = new DataTransfer();
      dt.items.add(dropped);
      fFile.files = dt.files;
      filePick.textContent = dropped.name;
      filePick.classList.add('has-file');
    }
  });

  let chosenMode = state.settings.mode;
  updateModeHelp();
  overlay.querySelectorAll('.mode-opt').forEach(el=>{
    el.onclick = () => {
      chosenMode = el.dataset.mode;
      overlay.querySelectorAll('.mode-opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      updateModeHelp();
    };
  });
  function updateModeHelp(){
    const helpEl = document.getElementById('modeHelp');
    if(chosenMode==='local'){
      helpEl.textContent = 'Runs entirely in your browser. First use downloads a ~150MB speech model. Slower, but free and fully private. Needs a WebGPU-capable browser (recent Chrome or Edge) for reasonable speed.';
    } else {
      helpEl.textContent = state.settings.deepgramKey
        ? 'Sends audio to Deepgram using your saved API key. Faster and more accurate.'
        : 'No Deepgram key saved yet — add one in Settings first.';
    }
  }

  document.getElementById('startTranscribe').onclick = async () => {
    const courseId = document.getElementById('fCourse').value;
    const title = document.getElementById('fTitle').value.trim() || 'Untitled recording';
    const date = document.getElementById('fDate').value;
    const file = fFile.files[0];
    const errEl = document.getElementById('uploadError');
    const progEl = document.getElementById('uploadProgress');
    errEl.innerHTML = '';

    if(!file){ errEl.innerHTML = `<div class="err-box">Choose a file first.</div>`; return; }
    if(chosenMode==='cloud' && !state.settings.deepgramKey){ errEl.innerHTML = `<div class="err-box">Add a Deepgram API key in Settings, or switch to Local mode.</div>`; return; }

    document.getElementById('startTranscribe').disabled = true;
    document.getElementById('cancelUpload').disabled = true;

    const lecture = {
      id: 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      courseId, title, date,
      status: 'working',
      transcript: '', keyPoints: '', caseLaw: [], todos: [], keyTerms: [], policyNotes: '',
      durationLabel: '',
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    state.lectures.push(lecture);
    saveState();

    try{
      setProgress(progEl, 'Decoding audio track...');
      const { float32, sampleRate, durationSec } = await decodeAndResample(file);
      lecture.durationLabel = formatDuration(durationSec);

      let transcript;
      if(chosenMode==='local'){
        setProgress(progEl, 'Loading local speech model (first run may take a minute)...');
        transcript = await localTranscribe(float32, sampleRate, (msg)=>setProgress(progEl, msg));
      } else {
        setProgress(progEl, 'Uploading to Deepgram...');
        const wavBlob = encodeWAV(float32, sampleRate);
        transcript = await cloudTranscribe(wavBlob, state.settings.deepgramKey);
      }

      lecture.transcript = transcript;
      lecture.status = 'ready';
      lecture.updatedAt = Date.now();
      saveState();

      if(state.settings.anthropicKey && transcript && transcript.trim()){
        setProgress(progEl, 'Generating notes, case law citations, and to-dos...');
        try{
          const courseName = state.courses.find(c=>c.id===courseId)?.name || '';
          const docs = await generateDocs(transcript, state.settings.anthropicKey, courseName, date);
          lecture.keyPoints = docs.keyPoints;
          lecture.caseLaw = mergeCaseArrays(lecture.caseLaw, docs.caseLaw);
          lecture.todos = docs.todos;
          const approvedTerms1 = (state.settings.termReviewMode === 'review' && docs.keyTerms.length)
            ? await reviewNewTermsModal(docs.keyTerms)
            : docs.keyTerms;
          lecture.keyTerms = mergeTermArrays(lecture.keyTerms, approvedTerms1);
          lecture.policyNotes = docs.policyNotes;
          lecture.updatedAt = Date.now();
          saveState();
        }catch(e){
          console.error(e);
          // doc generation failure shouldn't block the transcript being saved
        }
      }

      if(state.settings.githubToken){
        setProgress(progEl, 'Syncing to your other devices...');
        try{ await syncNow(); }catch(e){ console.error('Sync failed', e); }
      }

      ui.showUpload = false;
      overlay.remove();
      ui.activeCourse = courseId;
      ui.openLecture = lecture.id;
      render();
    }catch(e){
      console.error(e);
      lecture.status = 'error';
      lecture.updatedAt = Date.now();
      saveState();
      errEl.innerHTML = `<div class="err-box">${escapeHtml(e.message || 'Something went wrong during transcription.')}</div>`;
      document.getElementById('startTranscribe').disabled = false;
      document.getElementById('cancelUpload').disabled = false;
      progEl.innerHTML = '';
    }
  };
}

  el.innerHTML = `<div class="progress"><span class="dot"></span>${escapeHtml(msg)}</div>`;

/* ============ SPACED REPETITION (Leitner system) ============ */
// Standard 5-box Leitner scheduling — correct recall promotes a term to a longer interval,
// a miss drops it back to box 1. Spacing + active recall is the best-evidenced method for
// durable term/definition memorization.
const LEITNER_INTERVALS = [1, 2, 4, 9, 21]; // days, indexed by box-1

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function termKey(courseId, term, deck){
  const d = deck || 'term';
  // 'term' deck keeps the original key shape so existing vocabulary progress isn't disturbed.
  return d === 'term' ? (courseId + '::' + term.trim().toLowerCase()) : (d + '::' + courseId + '::' + term.trim().toLowerCase());
}
function getTermProgress(courseId, term, deck){
  return (state.termProgress || {})[termKey(courseId, term, deck)] || null;
}
function recordTermAnswer(courseId, term, definition, gotIt, deck){
  const key = termKey(courseId, term, deck);
  const existing = state.termProgress[key];
  const today = todayStr();
  // A box only advances once per calendar day — otherwise repeated correct answers
  // within one drilling session (Free Practice, requeue-on-miss) could rocket a term
  // straight to "Mastered" without it ever actually being tested across real days,
  // which is the whole point of spaced repetition. A miss still resets immediately;
  // only upward progress is capped.
  const advancedToday = existing && existing.lastAdvanceDate === today;
  let box;
  if(!gotIt){
    box = 1;
  } else if(advancedToday){
    box = existing.box;
  } else {
    box = Math.min((existing?.box||0) + 1, 5);
  }
  state.termProgress[key] = {
    courseId, term, definition,
    box,
    nextReview: addDays(today, LEITNER_INTERVALS[box-1]),
    lastReviewed: Date.now(),
    lastAdvanceDate: (gotIt && !advancedToday) ? today : (existing?.lastAdvanceDate || null),
    reviewCount: (existing?.reviewCount||0) + 1,
    updatedAt: Date.now(),
  };
  saveState();
}
function recordTermTaught(courseId, term, definition, deck){
  // First-ever exposure to a term: teach it, don't quiz it yet. Lands in box 1,
  // due back tomorrow for its first real recall test.
  const key = termKey(courseId, term, deck);
  state.termProgress[key] = {
    courseId, term, definition,
    box: 1,
    nextReview: addDays(todayStr(), LEITNER_INTERVALS[0]),
    lastReviewed: Date.now(),
    lastAdvanceDate: todayStr(),
    reviewCount: 0,
    updatedAt: Date.now(),
  };
  saveState();
}
function buildCaseCardPool(courseId){
  // Case-holdings flashcard pool: reuses the Case Law index, preferring a full brief's
  // issue/holding when one has been generated, otherwise falling back to the class description.
  return buildCaseLawIndex(courseId).map(c => {
    const brief = getCaseBrief(courseId, c.name);
    const answer = brief ? `Issue: ${brief.issue}\n\nHolding: ${brief.holding}` : `Holding (from class): ${c.description}`;
    return { term: c.name, definition: answer, sources: c.sources };
  });
}
function buildStudyQueue(courseId, prioritizeNew, deck){
  const d = deck || 'term';
  const pool = courseId === '__master__' ? buildMasterDictionaryPool() : (d === 'case' ? buildCaseCardPool(courseId) : buildDictionary(courseId));
  const today = todayStr();
  const withStatus = pool.map(item => {
    const progress = getTermProgress(item.courseId || courseId, item.term, d);
    const isNew = !progress;
    const isDue = !isNew && progress.nextReview <= today;
    return { ...item, progress, isNew, isDue };
  });
  const due = withStatus.filter(item => item.isDue);
  const fresh = withStatus.filter(item => item.isNew);
  due.sort((a,b) => (a.progress.nextReview).localeCompare(b.progress.nextReview));
  return prioritizeNew ? [...fresh, ...due] : [...due, ...fresh];
}
const MASTERY_LEVELS = [
  { label: 'New', percent: 4,  color: 'var(--oxblood)' },      // box 0 (never studied)
  { label: 'Learning', percent: 20, color: 'var(--oxblood)' }, // box 1
  { label: 'Familiar', percent: 40, color: 'var(--brass)' },   // box 2
  { label: 'Practiced', percent: 60, color: 'var(--brass)' },  // box 3
  { label: 'Confident', percent: 80, color: 'var(--brass)' },  // box 4
  { label: 'Mastered', percent: 100, color: 'var(--green-ok)' }, // box 5
];
function chooseBlankIndices(words, box){
  // Light support early on, nearly full recall once a term is mastered — the blanking
  // ratio scales with the same Leitner box used for scheduling.
  const proportions = [0.15, 0.15, 0.35, 0.55, 0.75, 0.95];
  const pct = proportions[Math.max(0, Math.min(5, box||0))];
  const nBlanks = Math.max(1, Math.round(words.length * pct));
  const eligible = words.map((w,i)=>i).filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= 3);
  const pool = (eligible.length >= nBlanks ? eligible : words.map((w,i)=>i)).slice();
  for(let i = pool.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return new Set(pool.slice(0, Math.min(nBlanks, pool.length)));
}
function buildBlankedHtml(words, blankSet){
  return words.map((w, i) => {
    if(!blankSet.has(i)) return escapeHtml(w);
    const widthCh = Math.max(3, w.replace(/[^a-zA-Z0-9]/g,'').length + 2);
    return `<input type="text" class="blank-input" data-idx="${i}" style="width:${widthCh}ch;border:none;border-bottom:2px solid var(--brass);background:transparent;font-family:'Source Serif 4',serif;font-size:15.5px;text-align:center;padding:0 2px;" autocomplete="off" spellcheck="false" />`;
  }).join(' ');
}

function computeWordDiff(userText, correctText){
  // Word-level LCS diff — shows exactly which words of the correct definition were
  // reproduced (in order) and which were missed or misworded, for verbatim practice.
  const clean = (w) => w.toLowerCase().replace(/[.,;:!?()'"]/g, '');
  const u = (userText||'').trim().split(/\s+/).filter(Boolean);
  const c = (correctText||'').trim().split(/\s+/).filter(Boolean);
  const m = u.length, n = c.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = clean(u[i-1]) === clean(c[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const matched = new Array(n).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(clean(u[i-1]) === clean(c[j-1])){ matched[j-1] = true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  const score = n>0 ? Math.round((matched.filter(Boolean).length/n)*100) : 100;
  return { correctWords: c, matched, score };
}

function masteryInfo(box){
  return MASTERY_LEVELS[Math.max(0, Math.min(5, box||0))];
}
function termStatusLabel(courseId, term){
  const p = getTermProgress(courseId, term);
  const m = masteryInfo(p ? p.box : 0);
  if(!p) return { ...m, sub: 'Not studied yet' };
  const today = todayStr();
  if(p.box >= 5) return { ...m, sub: `Next review ${p.nextReview}` };
  if(p.nextReview <= today) return { ...m, sub: 'Due for review' };
  return { ...m, sub: `Next review ${p.nextReview}` };
}

function capitalizeTerm(s){
  if(!s) return s;
  const trimmed = s.trim();
  // Only capitalize single-word terms (Battery, Negligence). Multi-word legal phrases
  // (res ipsa loquitur, duty of care, assumption of risk) aren't conventionally
  // capitalized as a whole headword, so leave those exactly as generated/typed.
  if(trimmed.includes(' ')) return trimmed;
  return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
}

function buildDictionary(courseId){
  const map = {};
  const lectures = state.lectures
    .filter(l => l.courseId === courseId)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  lectures.forEach(l => {
    (l.keyTerms||[]).forEach(t => {
      if(!t.term || !t.term.trim()) return;
      const key = t.term.trim().toLowerCase();
      const existing = map[key];
      const sources = existing ? existing.sources : [];
      // Later lectures win on content — if a term comes up again, the newer explanation
      // usually reflects a more complete or refined understanding. Fields the newer
      // mention left blank fall back to whatever was captured before, so a thin second
      // mention doesn't erase a richer earlier one.
      map[key] = {
        term: capitalizeTerm(t.term.trim()),
        definition: t.definition || existing?.definition || '',
        context: t.context || existing?.context || null,
        usagePattern: t.usagePattern || existing?.usagePattern || null,
        sources,
      };
      map[key].sources.push({ lectureId: l.id, title: l.title, date: l.date });
    });
  });

  // Manual additions/edits always win — they're your professor's exact wording, and
  // regenerating a lecture should never silently overwrite something you fixed by hand.
  const customPrefix = courseId + '::';
  Object.entries(state.customTerms || {}).forEach(([storeKey, custom]) => {
    if(!storeKey.startsWith(customPrefix)) return;
    const key = storeKey.slice(customPrefix.length);
    if(map[key]){
      // Preserve whichever label is actually accurate — a term you added fresh should
      // keep saying so even if a later lecture happens to also mention that same name.
      map[key] = {
        ...map[key],
        definition: custom.definition,
        usagePattern: custom.usagePattern || map[key].usagePattern,
        context: custom.context || map[key].context,
        edited: !custom.manual,
        manual: !!custom.manual,
      };
    } else {
      const sources = [{ lectureId: null, title: 'Added manually', date: null }];
      if(custom.foundInLecture){
        sources.push({ lectureId: custom.foundInLecture.lectureId, title: custom.foundInLecture.title, date: custom.foundInLecture.date });
      }
      map[key] = {
        term: custom.term, definition: custom.definition,
        context: custom.context || null, usagePattern: custom.usagePattern || null,
        sources,
        manual: true,
      };
    }
  });

  // Deletions apply last, regardless of whether the term came from a lecture or was added by hand.
  const deletedSet = new Set(state.deletedTerms || []);
  Object.keys(map).forEach(key => {
    if(deletedSet.has(courseId + '::' + key)) delete map[key];
  });

  return Object.values(map).sort((a,b) => a.term.localeCompare(b.term));
}

function customTermKey(courseId, term){
  return courseId + '::' + term.trim().toLowerCase();
}
function saveCustomTerm(courseId, term, definition, isManualAddition, extra){
  const key = customTermKey(courseId, term);
  const prev = state.customTerms[key];
  state.customTerms[key] = {
    term: term.trim(),
    definition: definition.trim(),
    manual: !!isManualAddition,
    usagePattern: (extra && extra.usagePattern !== undefined) ? (extra.usagePattern || null) : (prev?.usagePattern || null),
    context: (extra && extra.context !== undefined) ? (extra.context || null) : (prev?.context || null),
    foundInLecture: (extra && extra.foundInLecture !== undefined) ? extra.foundInLecture : (prev?.foundInLecture || null),
    updatedAt: Date.now(),
  };
  saveState();
}
function deleteTermEverywhere(courseId, term){
  const key = customTermKey(courseId, term);
  state.deletedTerms = state.deletedTerms || [];
  if(!state.deletedTerms.includes(key)) state.deletedTerms.push(key);
  delete state.customTerms[key];
  delete state.termProgress[key]; // 'term' deck keys share this exact format
  saveState();
}

function findTermContextInTranscripts(courseId, term){
  // Local, offline search across transcripts already sitting in memory — no API call.
  const cleanTerm = term.trim();
  if(!cleanTerm) return null;
  let re;
  try{
    re = new RegExp('\\b' + cleanTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  }catch(e){ return null; }
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && l.transcript)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  for(const l of lectures){
    if(!re.test(l.transcript)) continue;
    let sentences;
    try{
      sentences = l.transcript.split(/(?<=[.!?])\s+/);
    }catch(e){
      sentences = l.transcript.split('. ');
    }
    const match = sentences.find(s => re.test(s));
    if(match && match.trim()){
      return { context: match.trim(), lectureId: l.id, lectureTitle: l.title, lectureDate: l.date };
    }
  }
  return null;
}

async function generateUsagePattern(term, definition, apiKey){
  const prompt = `Give one short sentence (20 words or fewer) describing how the legal term "${term}" — defined as: "${definition}" — is typically used grammatically or in legal writing (common phrasing, collocations, or part of speech). Return ONLY that sentence. No quotes, no preamble, no extra commentary.`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 120,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join(' ').trim();
}

async function searchTranscriptsWithAI(courseId, term, definition, apiKey){
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && l.transcript)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if(lectures.length === 0) return { found: false };

  let combined = '';
  const included = [];
  for(const l of lectures){
    const block = `[LECTURE ${included.length+1}: "${l.title||'Untitled'}" (${l.date||'no date'})]\n${l.transcript}\n\n`;
    if(combined.length + block.length > 150000) break; // generous but bounded — a full semester of dense courses may not all fit in one pass
    combined += block;
    included.push(l);
  }

  const prompt = `A student is adding "${term}" (defined as: "${definition}") to their course dictionary. Below are transcripts from their actual class lectures, each tagged with a [LECTURE N: ...] marker. Even if the exact word "${term}" never appears, determine whether this concept was genuinely discussed under different phrasing, a synonym, or closely related wording — not just a loosely related topic.

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "found": true or false,
  "lectureIndex": the N from the matching [LECTURE N: ...] marker, or null if not found,
  "context": "the EXACT verbatim sentence(s), copied word-for-word from that transcript, where the concept is discussed — never a paraphrase or summary. Or null if not found."
}
Only set found:true if you're genuinely confident the concept itself is discussed, not just an adjacent or loosely related idea.

TRANSCRIPTS:
${combined}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 600,
      temperature: 0.1,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  const parsed = JSON.parse(extractJSON(raw));
  if(!parsed.found || !parsed.lectureIndex) return { found: false };
  const lecture = included[parsed.lectureIndex - 1];
  if(!lecture || !parsed.context) return { found: false };
  return { found: true, context: parsed.context, lecture: { lectureId: lecture.id, title: lecture.title, date: lecture.date } };
}

function buildMasterDictionaryPool(){
  const pool = [];
  state.courses.filter(c => !c.archived).forEach(course => {
    buildDictionary(course.id).forEach(d => {
      pool.push({ ...d, courseId: course.id, courseName: course.name });
    });
  });
  return pool.sort((a,b) => a.term.localeCompare(b.term));
}

      if(!term || !definition){ alert('Fill in the term and definition first.'); return; }
      aiSearchBtn.disabled = true; aiSearchBtn.textContent = 'Searching...';
      const previewEl = document.getElementById('contextPreview');
      try{
        const result = await searchTranscriptsWithAI(courseId, term, definition, state.settings.anthropicKey);
        if(result.found){
          foundContext = { context: result.context, foundInLecture: result.lecture };
          previewEl.innerHTML = `<b>AI found a match in ${escapeHtml(result.lecture.title||'Untitled')}:</b><br/>"${escapeHtml(result.context)}"`;
        } else {
          foundContext = null;
          previewEl.textContent = "This concept doesn't appear to be discussed in any transcript on hand — you can still add the term with your own definition.";
        }
      }catch(e){
        alert('AI search failed: ' + e.message);
      }
      aiSearchBtn.disabled = false; aiSearchBtn.textContent = 'Search with AI (different phrasing)';
    };
  }

  document.getElementById('saveTF').onclick = async () => {
    const term = document.getElementById('tfTerm').value.trim();
    const definition = document.getElementById('tfDefinition').value.trim();
    const usagePattern = document.getElementById('tfUsage').value.trim();
    const errEl = document.getElementById('tfError');
    if(!term || !definition){ errEl.innerHTML = `<div class="err-box">Both a term and a definition are required.</div>`; return; }
    const extra = { usagePattern: usagePattern || null };
    if(!isEdit && foundContext){
      extra.context = foundContext.context;
      extra.foundInLecture = foundContext.foundInLecture;
    }
    saveCustomTerm(courseId, term, definition, isEdit ? wasManual : true, extra);
    if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
    close();
    if(onSaved) onSaved();
  };
}

/* ============ CASE LAW INDEX (course-wide) ============ */
function buildCaseLawIndex(courseId){
  const map = {};
  const lectures = state.lectures
    .filter(l => l.courseId === courseId)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  lectures.forEach(l => {
    (l.caseLaw||[]).forEach(c => {
      if(!c.name || !c.name.trim()) return;
      const key = c.name.trim().toLowerCase();
      const existing = map[key];
      const sources = existing ? existing.sources : [];
      // Same principle as the Dictionary: a case revisited in a later lecture often gets
      // fuller treatment, so the newer description/quote wins, falling back to what's
      // already there if the newer mention is thinner.
      map[key] = {
        name: c.name.trim(),
        description: c.description || existing?.description || '',
        citation: c.citation || existing?.citation || null,
        quote: c.quote || existing?.quote || '',
        sources,
      };
      map[key].sources.push({ lectureId: l.id, title: l.title, date: l.date });
    });
  });
  return Object.values(map).map(c => ({
    ...c,
    verified: !!getCaseBrief(courseId, c.name)?.verified,
  })).sort((a,b) => a.name.localeCompare(b.name));
}

function renderStudySessionModal(initialBatch, remainingAfter, allowRequeue, deck, recallMode, direction, blankTarget){
  const courseId = ui.activeCourse;
  const pending = initialBatch.slice(); // true queue — shrinks on mastery, never grows

  let masteredCount = 0;
  let revealed = false;
  let learnedCount = 0;
  let reviewCorrect = 0;
  let reviewAttempts = 0;
  let streak = 0;
  let bestStreak = 0;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);

  function draw(){
    if(pending.length === 0){
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Session complete</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>

            <div class="display" style="font-size:19px;margin-bottom:6px;">${masteredCount} / ${totalUnique} terms mastered</div>

            <div class="help" style="margin-top:10px;">${remainingAfter > 0 ? `${remainingAfter} more term${remainingAfter===1?'':'s'} waiting outside this batch &mdash; start another session anytime.` : `That's everything in the queue for now.`}</div>

          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      document.getElementById('doneSess').onclick = close;
      const anotherBtn = document.getElementById('anotherSess');
      if(anotherBtn) anotherBtn.onclick = () => { close(); renderStudySetupModal(); };
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      if(state.settings.githubToken){ syncNow().catch(e=>console.error(e)); }
      return;
    }
    const card = pending[0];
    const cardCourseId = card.courseId || courseId;
    const streakBadge = streak >= 2 ? `<span class="mono" style="font-size:11px;color:var(--brass);margin-left:8px;">&#9679; streak ${streak}</span>` : '';
    const reversed = !card.isNew && (direction === 'reverse' || (direction === 'mixed' && Math.random() < 0.5));

      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me</h2>
            <button class="modal-close" id="closeSess">&times;</button>

          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="mono" style="font-size:10px;color:var(--oxblood);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px;">New term &mdash; learning</div>
            <div style="text-align:center;padding:16px 10px 6px;">

            </div>
          </div>
          <div class="modal-foot">
            <button class="btn" id="learnedBtn">Got it — next</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('learnedBtn').onclick = () => {
        recordTermTaught(cardCourseId, card.term, card.definition, deck);
        learnedCount++; masteredCount++;
        pending.shift();
        draw();
      };
      return;
    }

    if(recallMode === 'verbatim' && !revealed){
      const promptLabel = reversed ? 'Definition' : (deck === 'case' ? 'Case' : 'Term');
      const promptText = reversed ? card.definition : card.term;
      const askFor = reversed ? (deck === 'case' ? 'the case name' : 'the term') : (deck === 'case' ? 'the holding' : 'the definition');
      overlay.innerHTML = `

          <div class="modal-head">

        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Fill in the Blanks</h2>

    overlay.innerHTML = `

        <div class="modal-head">

          <button class="modal-close" id="closeSess">&times;</button>
        </div>

    const skipBtn = document.getElementById('skipBtn');

    const gotBtn = document.getElementById('gotBtn');
    const missBtn = document.getElementById('missBtn');

      recordTermAnswer(cardCourseId, card.term, card.definition, true, deck);

      pending.shift();

      recordTermAnswer(cardCourseId, card.term, card.definition, false, deck);
      reviewAttempts++;

      pending.shift();
      if(allowRequeue){
        // Same term, same session, just a few cards later — no next-day wait.
        // pending never grows: we removed it above, this just changes its position.
        const reinsertAt = Math.min(3, pending.length);
        pending.splice(reinsertAt, 0, card);
      }

    };

}

function caseBriefKey(courseId, name){
  return courseId + '::' + name.trim().toLowerCase();
}
function getCaseBrief(courseId, name){
  return (state.caseBriefs || {})[caseBriefKey(courseId, name)] || null;
}
function saveCaseBrief(courseId, name, brief){
  state.caseBriefs[caseBriefKey(courseId, name)] = { ...brief, updatedAt: Date.now() };
  saveState();
}
function setCaseVerified(courseId, name, verified){
  const key = caseBriefKey(courseId, name);
  const existing = state.caseBriefs[key] || {};
  state.caseBriefs[key] = { ...existing, verified, updatedAt: Date.now() };
  saveState();
}

/* ============ PRACTICE: ISSUE-SPOTTER HYPOTHETICALS ============ */
const ISSUE_SPOTTING_TECHNIQUES = [
  { id: 'but', name: 'Find the "But"', tip: 'Conjunctions like "but," "however," "although," "except," and "unless" usually mark the exact spot where a clean fact pattern gets a twist. Everything before sets up what looks like an easy case; everything after introduces the complication that IS the issue.', example: '"Cindy locked the door, but she quietly unlocked it five minutes later." — the "but" flags that the confinement was temporary, which is the whole ballgame for the awareness element of false imprisonment.' },
  { id: 'numbers', name: 'Suspicious Specificity', tip: 'Facts stated with unusual precision — exact times, distances, ages, dollar amounts — are almost never decorative. Ask what legal threshold or rule a number like that might be keyed to.', example: '"the invoice was 31 days overdue" — 30 days is a common contractual cutoff, so the extra day is probably the point being tested.' },
  { id: 'adverbs', name: 'Adverbs Are Doing Legal Work', tip: 'Words like "quietly," "secretly," "immediately," "reasonably," "knowingly" usually map directly onto an element of a claim — state of mind, causation, or timing. Don\'t skim past them.', example: '"quietly locks the door" signals the other party\'s lack of awareness — directly relevant to an awareness element.' },
  { id: 'mental-state', name: 'State-of-Mind Words Pick the Claim', tip: 'Intentionally / accidentally / negligently / recklessly / knowingly often determine which cause of action is even available in the first place.', example: 'A "negligent" act points toward negligence; the same act described as "intentional" opens the door to intentional torts instead.' },
  { id: 'parties', name: 'Every New Party Is a Potential Claim', tip: 'As soon as a third party enters a fact pattern — an employer, a bystander, a company — ask whether they create vicarious liability, a new duty, a new defense, or a separate claim entirely.', example: 'An employee\'s tortious act during work hours often raises a separate vicarious liability question against the employer.' },
  { id: 'elements', name: 'Test Every Element, Even the Obvious Ones', tip: 'Don\'t silently skip an element because it feels obviously satisfied. Rubrics give credit for stating it, and sometimes the "obvious" element is the one with a hidden twist.', example: 'Even when intent is clearly present, say so explicitly rather than jumping straight to the contested element.' },
  { id: 'convenient', name: 'A Convenient Resolution Is a Clue', tip: 'If a fact pattern conveniently resolves an obstacle — the door "happened" to be unlocked, the check "happened" to clear — that convenience is usually the point being tested, not a coincidence.', example: 'The door being unlocked before the plaintiff ever tried it is precisely what defeats the awareness element.' },
  { id: 'discuss-all', name: '"Discuss All" Means More Than One', tip: 'If the call of the question says "fully discuss" or "discuss all potential claims," that\'s the professor telling you there\'s more than one thing to find. Treat the first issue you spot as the floor, not the ceiling.', example: 'Finding one valid claim doesn\'t mean you\'re done — keep scanning the facts for others.' },
];

function buildCourseContextForPractice(courseId){
  const keyPointsText = state.lectures
    .filter(l => l.courseId === courseId && l.keyPoints)
    .map(l => `From "${l.title}":\n${l.keyPoints}`)
    .join('\n\n')
    .slice(0, 6000); // keep prompt size sane for courses with many lectures
  const caseLaw = buildCaseLawIndex(courseId)
    .map(c => `${c.name}${c.citation ? ' ('+c.citation+')' : ''}: ${c.description}`)
    .join('\n')
    .slice(0, 3000);
  return { keyPointsText, caseLaw };
}

async function generateHypothetical(courseName, context, apiKey, multiIssue){
  const prompt = multiIssue ? `You are a law professor's teaching assistant helping a first-year law student practice full exam-style issue-spotting for "${courseName}". Using the rules and cases below (drawn from their actual class material), write ONE longer, more complex fact pattern that intentionally raises 2-4 DISTINCT issues spanning multiple rules or cases from class — the kind of multi-issue question that would appear on an actual final exam, not a single clean textbook hypothetical. Do not reveal the issues or the answer.

${context.keyPointsText || '(none available yet)'}

CASE LAW DISCUSSED:
${context.caseLaw || '(none available yet)'}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "hypothetical": "the fact pattern, 8-14 sentences, realistic and specific, deliberately weaving in facts relevant to multiple distinct issues, ending with a call to action like 'Discuss all claims that may arise.'",
  "targetRule": "a short internal note (not shown to the student until after they answer) listing each distinct issue/rule/case this hypothetical is testing, one per line"
}` : `You are a law professor's teaching assistant helping a first-year law student practice issue-spotting for "${courseName}". Using the rules and cases below (drawn from their actual class material), write ONE realistic fact-pattern hypothetical that requires applying one or more of these rules — the kind of question that would appear on an exam or in a practice problem. Do not reveal the issue or the answer.

${context.keyPointsText || '(none available yet)'}

CASE LAW DISCUSSED:
${context.caseLaw || '(none available yet)'}

Return ONLY a JSON object, no markdown fences, no commentary:
{

  "targetRule": "a short internal note (not shown to the student until after they answer) naming which rule(s) or case(s) this hypothetical is testing"
}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'

    body: JSON.stringify({

      max_tokens: multiIssue ? 1400 : 800,
      messages: [{ role: 'user', content: prompt }]

  if(!res.ok){

    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);

  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');

// Stage numbers: 0 = not started, 1 = learned why + saw a worked example,
// 2 = completed guided practice (signal given, just interpret it), 3 = mastered
// (completed a fully independent drill). Each stage unlocks the next — no skipping.
function setTechniqueStage(techniqueId, stage){
  state.issueSpottingProgress = state.issueSpottingProgress || {};
  state.issueSpottingProgress[techniqueId] = Math.max(state.issueSpottingProgress[techniqueId] || 0, stage);
  saveState();
}
function getTechniqueStage(techniqueId){
  return (state.issueSpottingProgress || {})[techniqueId] || 0;
}
const STAGE_LABELS = ['Not started', 'Learned — ready for guided practice', 'Guided practice done — ready to try it alone', 'Mastered'];

function renderIssueSpottingModal(){
  const course = state.courses.find(c=>c.id===ui.activeCourse);
  const progress = state.issueSpottingProgress || {};
  const masteredCount = ISSUE_SPOTTING_TECHNIQUES.filter(t => (progress[t.id]||0) >= 3).length;
  const allMastered = masteredCount === ISSUE_SPOTTING_TECHNIQUES.length;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal wide">
      <div class="modal-head">
        <h2>Issue Spotting: ${escapeHtml(course?course.name:'')}</h2>
        <button class="modal-close" id="closeIS">&times;</button>
      </div>
      <div class="modal-body">
        <div class="help" style="margin-bottom:14px;">Each technique below builds up in three steps: first you learn <i>why</i> it works with a fully worked example, then you practice with the signal already pointed out to you, and only then do you try it completely on your own. Once all eight are mastered, the natural next step is <b>Practice &rarr; Multi-issue exam</b>, with no hints at all.</div>
        <div class="help" style="margin-bottom:16px;color:${allMastered?'var(--green-ok)':'var(--brass)'};">${masteredCount} / ${ISSUE_SPOTTING_TECHNIQUES.length} techniques mastered${allMastered ? ' — you\'re ready for unhinted multi-issue practice.' : ''}</div>
        ${ISSUE_SPOTTING_TECHNIQUES.map(t => {
          const stage = getTechniqueStage(t.id);
          const btnLabel = stage === 0 ? 'Start: Learn why it works' : stage === 1 ? 'Continue: Guided practice' : stage === 2 ? 'Continue: Try it on your own' : 'Practice again';
          return `
          <div style="margin-bottom:16px;border-bottom:1px solid var(--rule);padding-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
              <div style="font-weight:600;font-size:15.5px;">${escapeHtml(t.name)}</div>
              <div class="mono" style="font-size:10px;color:${stage>=3?'var(--green-ok)':'var(--ink-soft)'};white-space:nowrap;">${escapeHtml(STAGE_LABELS[stage])}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin:5px 0 8px;">
              <div style="flex:1;max-width:140px;height:5px;background:var(--rule);position:relative;">
                <div style="position:absolute;left:0;top:0;bottom:0;width:${(stage/3)*100}%;background:${stage>=3?'var(--green-ok)':'var(--brass)'};"></div>
              </div>
            </div>
            <div class="summary-body" style="font-size:14px;margin:4px 0 6px;">${escapeHtml(t.tip)}</div>
            <button class="btn ghost start-technique-btn" data-technique="${t.id}" data-stage="${stage}" style="font-size:13px;padding:8px 14px;">${btnLabel}</button>
          </div>
        `;}).join('')}
      </div>
      <div class="modal-foot">
        <button class="btn" id="closeIS2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closeIS').onclick = close;
  document.getElementById('closeIS2').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelectorAll('.start-technique-btn').forEach(btn => {
    btn.onclick = async () => {
      if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
      const technique = ISSUE_SPOTTING_TECHNIQUES.find(t => t.id === btn.dataset.technique);
      const stage = parseInt(btn.dataset.stage, 10);
      const targetStage = stage >= 3 ? 3 : stage; // "practice again" replays the independent stage
      btn.disabled = true; btn.textContent = 'Loading...';
      try{
        const context = buildCourseContextForPractice(ui.activeCourse);
        if(targetStage === 0){
          const lesson = await generateTechniqueLesson(technique, course?course.name:'', context, state.settings.anthropicKey);
          close();
          renderTechniqueLessonModal(technique, lesson);
        } else if(targetStage === 1){
          const drill = await generateGuidedDrill(technique, course?course.name:'', context, state.settings.anthropicKey);
          close();
          renderGuidedDrillAnswerModal(technique, drill);
        } else {
          const drill = await generateTechniqueDrill(technique, course?course.name:'', context, state.settings.anthropicKey);
          close();
          renderTechniqueAnswerModal(technique, drill);
        }
      }catch(e){
        alert('Could not load this step: ' + e.message);
        btn.disabled = false; btn.textContent = 'Continue';
      }
    };
  });
}

function buildCourseSynthesisContext(courseId){
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && (l.keyPoints || l.policyNotes))
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));

  const blocks = lectures.map(l => ({
    lecture: l,
    text: `## ${l.title || 'Untitled'} (${l.date || 'no date'})\n${l.keyPoints ? 'Key Points:\n' + l.keyPoints : ''}${l.policyNotes && !/^no policy discussion/i.test(l.policyNotes.trim()) ? '\n\nPolicy/Rationale:\n' + l.policyNotes : ''}`
  }));

  // Cap is generous — should comfortably fit a full semester for most courses. If we
  // still have to drop lectures, drop from the OLDEST end and keep the newest, since
  // regenerating is usually specifically to capture a class that just happened. Whole
  // lectures are dropped, never a lecture cut off mid-sentence.
  const CHAR_CAP = 150000;
  let totalLen = blocks.reduce((sum,b) => sum + b.text.length + 2, 0);
  const excluded = [];
  let startIdx = 0;
  while(totalLen > CHAR_CAP && startIdx < blocks.length - 1){
    totalLen -= (blocks[startIdx].text.length + 2);
    excluded.push(blocks[startIdx].lecture);
    startIdx++;
  }
  const included = blocks.slice(startIdx);
  const combinedText = included.map(b => b.text).join('\n\n');

  const caseLawText = buildCaseLawIndex(courseId)
    .map(c => `${c.name}${c.citation ? ' ('+c.citation+')' : ''}: ${c.description}`)
    .join('\n')
    .slice(0, 6000);

  return {
    combinedText, caseLawText,
    lectureCount: included.length,
    excludedLectures: excluded.map(l => ({ title: l.title, date: l.date })),
  };
}

function renderMarkdown(text){
  // Small purpose-built renderer for the outline/rule-bank output — headers, bold,
  // italics, and lists, styled to match the app rather than showing raw # and ** symbols.
  if(!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inList = null;
  let paragraphBuffer = [];

  function inlineFormat(s){
    let out = escapeHtml(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
    out = out.replace(/(^|[^_])_(.+?)_(?!_)/g, '$1<em>$2</em>');
    return out;
  }
  function flushParagraph(){
    if(paragraphBuffer.length){
      html += `<p style="margin:0 0 12px;line-height:1.7;">${inlineFormat(paragraphBuffer.join(' '))}</p>`;
      paragraphBuffer = [];
    }
  }
  function closeList(){
    if(inList){ html += `</${inList}>`; inList = null; }
  }

  for(const rawLine of lines){
    const line = rawLine.trimEnd();
    if(!line.trim()){ flushParagraph(); closeList(); continue; }

    const h1 = line.match(/^#\s+(.*)/);
    const h2 = line.match(/^##\s+(.*)/);
    const h3 = line.match(/^###\s+(.*)/);
    const bullet = line.match(/^[-*]\s+(.*)/);
    const numbered = line.match(/^\d+[.)]\s+(.*)/);

    if(h1){
      flushParagraph(); closeList();
      html += `<div style="font-family:'Libre Caslon Display',serif;font-size:22px;color:var(--oxblood);border-bottom:2px solid var(--oxblood);padding-bottom:6px;margin:28px 0 14px;">${inlineFormat(h1[1])}</div>`;
    } else if(h2){
      flushParagraph(); closeList();
      html += `<div style="font-family:'Libre Caslon Display',serif;font-size:18px;font-weight:600;color:var(--brass);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:20px 0 10px;">${inlineFormat(h2[1])}</div>`;
    } else if(h3){
      flushParagraph(); closeList();
      html += `<div style="font-weight:700;font-style:italic;font-size:15.5px;color:var(--ink);margin:16px 0 8px;">${inlineFormat(h3[1])}</div>`;
    } else if(bullet){
      flushParagraph();
      if(inList !== 'ul'){ closeList(); html += '<ul style="margin:0 0 10px;padding-left:22px;">'; inList = 'ul'; }
      html += `<li style="margin-bottom:5px;line-height:1.65;">${inlineFormat(bullet[1])}</li>`;
    } else if(numbered){
      flushParagraph();
      if(inList !== 'ol'){ closeList(); html += '<ol style="margin:0 0 10px;padding-left:22px;">'; inList = 'ol'; }
      html += `<li style="margin-bottom:5px;line-height:1.65;">${inlineFormat(numbered[1])}</li>`;
    } else {
      paragraphBuffer.push(line.trim());
    }
  }
  flushParagraph();
  closeList();
  return html;
}
