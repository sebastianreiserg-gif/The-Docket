        ` : ''}
        ${!hasContent ? `<div class="help">No key points recorded yet for this course.</div>` : ''}
        ${doc.tipsExcludedLectures && doc.tipsExcludedLectures.length ? `<div class="err-box" style="margin-bottom:14px;">This left out ${doc.tipsExcludedLectures.length} older lecture(s) to fit in one generation: ${doc.tipsExcludedLectures.map(l=>escapeHtml(l.title||'Untitled')).join(', ')}. Everything else is included.</div>` : ''}
        ${doc.tips ? `<div style="font-size:14.5px;">${renderMarkdown(doc.tips)}</div>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn" id="closePT2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closePT').onclick = close;
  document.getElementById('closePT2').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  const exportBtn = document.getElementById('exportTipsBtn');
  if(exportBtn){
    exportBtn.onclick = () => {
      const blob = new Blob([doc.tips], {type:'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(course?course.name:'course').replace(/[^a-z0-9]+/gi,'-')}-professor-tips.txt`;
      a.click();
    };
  }
  const scanBtn = document.getElementById('scanTipsBtn');
  if(scanBtn){
    scanBtn.onclick = async () => {
      if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
      scanBtn.disabled = true;
      const bar = document.createElement('div');
      bar.className = 'progress-bar-track inline-progress-bar';
      bar.innerHTML = '<div class="progress-bar-fill" style="width:0%;"></div>';
      scanBtn.insertAdjacentElement('afterend', bar);
      const fill = bar.querySelector('.progress-bar-fill');
      const etaEl = document.createElement('div');
      etaEl.className = 'mono';
      etaEl.style.cssText = 'font-size:10px;color:var(--ink-soft);margin-top:4px;';
      bar.insertAdjacentElement('afterend', etaEl);
      const scanStart = Date.now();
      let failures = 0;
      for(let i = 0; i < unscanned.length; i++){
        const lecture = unscanned[i];
        scanBtn.textContent = `Scanning ${i+1} of ${unscanned.length}...`;
        fill.style.width = Math.round((i / unscanned.length) * 100) + '%';
        // Estimated from the actual average time per lecture so far, not a guess —
        // needs at least one completed lecture before there's a rate to measure.
        if(i > 0){
          const avgPerLecture = (Date.now() - scanStart) / i;
          const etaSec = (avgPerLecture * (unscanned.length - i)) / 1000;
          etaEl.textContent = `About ${formatEta(etaSec)} remaining`;
        }
        try{
          const tips = await extractProfessorTipsOnly(lecture.transcript, state.settings.anthropicKey);
          lecture.professorTips = mergeProfessorTips(lecture.professorTips, tips);
          lecture.tipsScannedAt = Date.now();
        }catch(e){
          console.error('Tips scan failed for lecture', lecture.id, e);
          failures++;
        }
      }
      fill.style.width = '100%';
      etaEl.remove();
      saveState(['lectures']);
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      if(failures){
        alert(`Scanned with ${failures} failure(s) — those lectures can be retried by opening this again. Now generating the tips document from everything found so far.`);
      }
      // Roll straight into synthesis so one click gets you a finished document, not
      // just raw scanned data with an extra step still required.
      scanBtn.textContent = 'Generating tips document...';
      try{
        const context = buildCourseSynthesisContext(ui.activeCourse);
        const tips = await generateProfessorTips(course?course.name:'', context, state.settings.anthropicKey);
        state.courseDocs[ui.activeCourse] = {
          ...(state.courseDocs[ui.activeCourse]||{}),
          tips, tipsGeneratedAt: Date.now(),
          tipsExcludedLectures: context.excludedLectures,
          updatedAt: Date.now()
        };
        saveState(['courseDocs']);
        if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      }catch(e){
        alert('Scanned lectures successfully, but could not generate the tips document: ' + e.message);
      }
      bar.remove();
      close();
      renderProfessorTipsModal();
    };
  }
  document.getElementById('genTipsBtn').onclick = async () => {
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    const btn = document.getElementById('genTipsBtn');
    btn.disabled = true; btn.textContent = 'Generating...';
    const { update, cleanup } = showDeterminateBar(btn);
    try{
      const context = buildCourseSynthesisContext(ui.activeCourse);
      const tips = await generateProfessorTips(course?course.name:'', context, state.settings.anthropicKey, update);
      state.courseDocs[ui.activeCourse] = {
        ...(state.courseDocs[ui.activeCourse]||{}),
        tips, tipsGeneratedAt: Date.now(),
        tipsExcludedLectures: context.excludedLectures,
        updatedAt: Date.now()
      };
      saveState(['courseDocs']);
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      cleanup();
      close();
      renderProfessorTipsModal();
    }catch(e){
      cleanup();
      alert('Could not generate tips: ' + e.message);
      btn.disabled = false; btn.textContent = doc.tips ? 'Regenerate tips' : 'Generate tips';
    }
  };
}

/* ============ CASE BRIEF NOTEBOOK ============ */
function getNotebook(courseId){
  const nb = state.caseBriefNotebooks[courseId] || { sections: [] };
  // Migrate old single-date blocks to the dates-array shape, and backfill new flags.
  nb.sections = (nb.sections || []).map(sec => ({
    locked: false,
    collapsed: false,
    ...sec,
    blocks: (sec.blocks || []).map(b => {
      const dates = Array.isArray(b.dates) ? b.dates : (b.date ? [b.date] : []);
      return { discussed: false, collapsed: false, ...b, dates };
    })
  }));
  return nb;
}
function setSectionCollapsed(courseId, sectionId, collapsed){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id === sectionId ? { ...sec, collapsed } : sec);
  saveNotebook(courseId, notebook);
}
function saveNotebook(courseId, notebook){
  state.caseBriefNotebooks[courseId] = { ...notebook, updatedAt: Date.now() };
  saveState(['caseBriefNotebooks']);
}
function addNotebookSection(courseId, title){
  const notebook = getNotebook(courseId);
  notebook.sections = [...notebook.sections, { id: 'sec_'+Date.now(), title: title.trim(), locked: false, blocks: [] }];
  saveNotebook(courseId, notebook);
}
function addNotebookBlock(courseId, sectionId){
  const notebook = getNotebook(courseId);
  const fields = {};
  (state.settings.briefTemplateFields||[]).forEach(label => { fields[label] = ''; });
  notebook.sections = notebook.sections.map(sec => sec.id === sectionId
    ? { ...sec, blocks: [...sec.blocks, { id: 'blk_'+Date.now(), caseName: '', dates: [todayStr()], discussed: false, fields }] }
    : sec
  );
  saveNotebook(courseId, notebook);
}
function updateNotebookSectionTitle(courseId, sectionId, title){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id === sectionId ? { ...sec, title } : sec);
  saveNotebook(courseId, notebook);
}
function setSectionLocked(courseId, sectionId, locked){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id === sectionId ? { ...sec, locked } : sec);
  saveNotebook(courseId, notebook);
}
function updateNotebookBlock(courseId, sectionId, blockId, patch){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id !== sectionId ? sec : {
    ...sec,
    blocks: sec.blocks.map(b => b.id === blockId ? { ...b, ...patch, fields: { ...b.fields, ...(patch.fields||{}) } } : b)
  });
  saveNotebook(courseId, notebook);
}
function addBlockDate(courseId, sectionId, blockId, dateStr){
  if(!dateStr) return;
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id !== sectionId ? sec : {
    ...sec,
    blocks: sec.blocks.map(b => b.id === blockId ? { ...b, dates: Array.from(new Set([...(b.dates||[]), dateStr])).sort() } : b)
  });
  saveNotebook(courseId, notebook);
}
function removeBlockDate(courseId, sectionId, blockId, dateStr){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id !== sectionId ? sec : {
    ...sec,
    blocks: sec.blocks.map(b => b.id === blockId ? { ...b, dates: (b.dates||[]).filter(d => d !== dateStr) } : b)
  });
  saveNotebook(courseId, notebook);
}
function deleteNotebookBlock(courseId, sectionId, blockId){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.map(sec => sec.id !== sectionId ? sec : { ...sec, blocks: sec.blocks.filter(b => b.id !== blockId) });
  saveNotebook(courseId, notebook);
}
function deleteNotebookSection(courseId, sectionId){
  const notebook = getNotebook(courseId);
  notebook.sections = notebook.sections.filter(sec => sec.id !== sectionId);
  saveNotebook(courseId, notebook);
}

function normalizeFieldLabel(label){
  // Strips trailing punctuation, case, and whitespace differences, so a trivial edit
  // to a template field label (e.g. "Facts" -> "Facts:") doesn't orphan content
  // that's already been typed in under the old exact label.
  return (label||'').trim().toLowerCase().replace(/[:.\s]+$/, '');
}
function getBlockFieldValue(block, label){
  const fields = block.fields || {};
  if(fields[label] !== undefined) return fields[label];
  const norm = normalizeFieldLabel(label);
  const matchKey = Object.keys(fields).find(k => normalizeFieldLabel(k) === norm);
  return matchKey ? fields[matchKey] : '';
}
function buildBlockHtml(sec, block){
  return `
    <div class="legal-pad-block" data-section="${sec.id}" data-block="${block.id}" data-locked="${sec.locked?'1':'0'}" data-discussed="${block.discussed?'1':'0'}">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;" title="Mark as discussed in class">
          <input type="checkbox" class="block-discussed" data-section="${sec.id}" data-block="${block.id}" ${block.discussed?'checked':''} style="width:20px;height:20px;" />
        </label>
        <input type="text" class="legal-pad-case-name block-case-name" data-section="${sec.id}" data-block="${block.id}" value="${escapeAttr(block.caseName)}" placeholder="Case name..." style="flex:1;min-width:220px;" ${sec.locked?'readonly':''} />
        <button class="toggle-collapse-btn mono" data-section="${sec.id}" data-block="${block.id}" title="${block.collapsed ? 'Expand' : 'Minimize'}" style="font-size:18px;color:#5C4A0E;background:rgba(138,109,30,0.12);border:1px solid rgba(138,109,30,0.35);padding:5px 12px;cursor:pointer;">${block.collapsed ? '&#9660;' : '&#9650;'}</button>
        <button class="export-block-btn mono" data-section="${sec.id}" data-block="${block.id}" style="font-size:15px;color:var(--ink-soft);background:none;border:1px solid var(--rule);padding:5px 12px;cursor:pointer;white-space:nowrap;">Export</button>
        ${!sec.locked ? `<button class="del-block-btn mono" data-section="${sec.id}" data-block="${block.id}" style="font-size:15px;color:#7C2D2D;background:none;border:1px solid rgba(124,45,45,0.3);padding:5px 12px;cursor:pointer;white-space:nowrap;">Remove</button>` : ''}
      </div>
      <div class="legal-pad-block-body" style="${block.collapsed ? 'display:none;' : ''}">
        ${(state.settings.briefTemplateFields||[]).map((label, idx) => `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;height:44px;">
            <div class="legal-pad-field-label" style="margin:0;">${escapeHtml(label)}</div>
            ${idx === 0 ? `
              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                ${(block.dates||[]).map(d => `
                  <span class="legal-pad-datechip">${escapeHtml(d)}${!sec.locked ? `<button class="rm-date-btn" data-section="${sec.id}" data-block="${block.id}" data-date="${escapeAttr(d)}">&times;</button>` : ''}</span>
                `).join('')}
                ${!sec.locked ? `<button type="button" class="legal-pad-adddate-btn add-date-trigger" data-section="${sec.id}" data-block="${block.id}">+ Add date</button><input type="date" class="legal-pad-adddate-hidden add-date-input" data-section="${sec.id}" data-block="${block.id}" />` : ''}
              </div>
            ` : ''}
          </div>
          <textarea class="legal-pad-field block-field" data-section="${sec.id}" data-block="${block.id}" data-label="${escapeAttr(label)}" rows="1" ${sec.locked?'readonly':''}>${escapeHtml(getBlockFieldValue(block, label))}</textarea>
        `).join('')}
        ${state.settings.anthropicKey ? `<button class="btn ghost review-brief-btn" data-section="${sec.id}" data-block="${block.id}" style="font-size:16px;margin-top:10px;">Review this brief</button>` : ''}
      </div>
    </div>
  `;
}

function autoGrowTextarea(el){
  // Snap to an exact multiple of the 44px line unit rather than trusting the browser's
  // raw scrollHeight pixel value — sub-pixel font rendering can report something like
  // 87px or 89px for what's meant to be exactly two 44px lines, and that small rounding
  // error compounds into visible drift for everything that follows.
  el.style.height = 'auto';
  const lines = Math.max(1, Math.ceil(el.scrollHeight / 44));
  el.style.height = (lines * 44) + 'px';
}

function wireRemoveDateButton(btn, courseId){
  btn.onclick = () => {
    removeBlockDate(courseId, btn.dataset.section, btn.dataset.block, btn.dataset.date);
    btn.closest('.legal-pad-datechip').remove();
  };
}

function wireBlockElement(blockEl, courseId, overlay){
  const sectionId = blockEl.dataset.section, blockId = blockEl.dataset.block;
  const discussedCb = blockEl.querySelector('.block-discussed');
  if(discussedCb) discussedCb.onchange = () => {
    updateNotebookBlock(courseId, sectionId, blockId, { discussed: discussedCb.checked });
    blockEl.dataset.discussed = discussedCb.checked ? '1' : '0';
  };
  const caseNameInput = blockEl.querySelector('.block-case-name');
  if(caseNameInput) caseNameInput.onblur = () => {
    updateNotebookBlock(courseId, sectionId, blockId, { caseName: caseNameInput.value });
  };
  const collapseBtn = blockEl.querySelector('.toggle-collapse-btn');
  if(collapseBtn) collapseBtn.onclick = () => {
    const body = blockEl.querySelector('.legal-pad-block-body');
    const nowCollapsed = body.style.display !== 'none';
    body.style.display = nowCollapsed ? 'none' : '';
    collapseBtn.innerHTML = nowCollapsed ? '&#9660;' : '&#9650;';
    collapseBtn.title = nowCollapsed ? 'Expand' : 'Minimize';
    updateNotebookBlock(courseId, sectionId, blockId, { collapsed: nowCollapsed });
    if(!nowCollapsed){
      body.querySelectorAll('textarea.legal-pad-field').forEach(autoGrowTextarea);
    }
  };
  const addDateTrigger = blockEl.querySelector('.add-date-trigger');
  const addDateInput = blockEl.querySelector('.add-date-input');
  if(addDateTrigger && addDateInput){
    addDateTrigger.onclick = () => {
      if(addDateInput.showPicker){ addDateInput.showPicker(); } else { addDateInput.focus(); addDateInput.click(); }
    };
    addDateInput.onchange = () => {
      if(!addDateInput.value) return;
      addBlockDate(courseId, sectionId, blockId, addDateInput.value);
      const chipHtml = `<span class="legal-pad-datechip">${escapeHtml(addDateInput.value)}<button class="rm-date-btn" data-section="${sectionId}" data-block="${blockId}" data-date="${escapeAttr(addDateInput.value)}">&times;</button></span>`;
      addDateTrigger.insertAdjacentHTML('beforebegin', chipHtml);
      wireRemoveDateButton(addDateTrigger.previousElementSibling.querySelector('.rm-date-btn'), courseId);
      addDateInput.value = '';
    };
  }
  blockEl.querySelectorAll('.rm-date-btn').forEach(btn => wireRemoveDateButton(btn, courseId));
  blockEl.querySelectorAll('.block-field').forEach(el => {
    el.onblur = () => {
      updateNotebookBlock(courseId, sectionId, blockId, { fields: { [el.dataset.label]: el.value } });
    };
    el.addEventListener('input', () => autoGrowTextarea(el));
  });
  const reviewBtn = blockEl.querySelector('.review-brief-btn');
  if(reviewBtn) reviewBtn.onclick = async () => {
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    // Read straight from the live inputs rather than saved state, in case something
    // hasn't been blurred yet — this should reflect exactly what's on the page right now.
    const caseName = blockEl.querySelector('.block-case-name')?.value || '';
    const fields = {};
    blockEl.querySelectorAll('.block-field').forEach(el => { fields[el.dataset.label] = el.value; });
    const hasContent = Object.values(fields).some(v => v && v.trim());
    if(!hasContent){ alert('Fill in at least one field before requesting a review.'); return; }
    reviewBtn.disabled = true; reviewBtn.textContent = 'Reviewing...';
    try{
      const review = await reviewCaseBrief(caseName, fields, state.settings.anthropicKey);
      renderCaseBriefReviewModal(caseName, review);
    }catch(e){
      alert('Could not generate a review: ' + e.message);
    }
    reviewBtn.disabled = false; reviewBtn.textContent = 'Review this brief';
  };
  const exportBtn = blockEl.querySelector('.export-block-btn');
  if(exportBtn) exportBtn.onclick = () => {
    // Read straight from the live inputs, same as Review, so an export always reflects
    // exactly what's on the page — no need to click away from a field first.
    const caseName = blockEl.querySelector('.block-case-name')?.value || 'Untitled case';
    const dateEls = blockEl.querySelectorAll('.legal-pad-datechip');
    const dates = Array.from(dateEls).map(el => el.textContent.replace(/×$/, '').trim()).filter(Boolean);
    const discussed = blockEl.querySelector('.block-discussed')?.checked;
    const lines = [caseName, '='.repeat(caseName.length)];
    if(dates.length) lines.push('Date(s): ' + dates.join(', '));
    lines.push('Discussed in class: ' + (discussed ? 'Yes' : 'No'), '');
    blockEl.querySelectorAll('.block-field').forEach(el => {
      lines.push(el.dataset.label.toUpperCase(), el.value || '(blank)', '');
    });
    const blob = new Blob([lines.join('\n')], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${caseName.replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'') || 'case-brief'}.txt`;
    a.click();
  };
}

function renderCaseBriefNotebookModal(restoreScrollTop){
  const courseId = ui.activeCourse;
  const course = state.courses.find(c=>c.id===courseId);
  const notebook = getNotebook(courseId);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal legal-pad-modal">
      <div class="modal-head">
        <h2>Case Briefs — ${escapeHtml(course?course.name:'')}</h2>
        <button class="modal-close" id="closeCB">&times;</button>
      </div>
      <div style="padding:14px 24px;border-bottom:1px solid var(--rule);">
        <button class="btn" id="addSectionBtn">+ New Topic Section</button>
      </div>
      <div class="modal-body" style="padding:0;" id="cbScrollArea">
        <div class="legal-pad">
          ${notebook.sections.length === 0 ? `
            <div style="font-family:'Source Serif 4',serif;color:#6b5d1f;line-height:28px;">No topics yet — start one with "+ New Topic Section" above (e.g. "False Imprisonment"), then insert a case brief template inside it.</div>
          ` : notebook.sections.map(sec => `
            <div class="legal-pad-section" data-section="${sec.id}" data-locked="${sec.locked?'1':'0'}">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <input type="text" class="legal-pad-section-title sec-title-input" data-section="${sec.id}" value="${escapeAttr(sec.title)}" placeholder="Topic name..." style="flex:1;" ${sec.locked?'readonly':''} />
                <button class="toggle-section-collapse-btn mono" data-section="${sec.id}" title="${sec.collapsed ? 'Expand topic' : 'Minimize topic'}" style="font-size:18px;color:#5C4A0E;background:rgba(138,109,30,0.12);border:1px solid rgba(138,109,30,0.35);padding:5px 12px;cursor:pointer;">${sec.collapsed ? '&#9660;' : '&#9650;'}</button>
                ${sec.locked
                  ? `<button class="edit-section-btn mono" data-section="${sec.id}" style="font-size:16px;color:#5C4A0E;background:rgba(138,109,30,0.12);border:1px solid rgba(138,109,30,0.35);padding:6px 14px;cursor:pointer;">Edit</button>`
                  : `<button class="finish-section-btn mono" data-section="${sec.id}" style="font-size:16px;color:#2C5F2D;background:rgba(62,92,62,0.1);border:1px solid var(--green-ok);padding:6px 14px;cursor:pointer;">Finish case briefs</button>`
                }
                <button class="del-section-btn mono" data-section="${sec.id}" style="font-size:16px;color:#7C2D2D;background:none;border:1px solid rgba(124,45,45,0.3);padding:6px 14px;cursor:pointer;">Delete topic</button>
              </div>
              <div class="legal-pad-section-body" data-section="${sec.id}" style="${sec.collapsed ? 'display:none;' : ''}">
                ${sec.blocks.map(block => buildBlockHtml(sec, block)).join('')}
                ${!sec.locked ? `<button class="btn ghost insert-template-btn" data-section="${sec.id}" style="font-size:18px;height:44px;box-sizing:border-box;margin:0;display:flex;align-items:center;justify-content:center;">+ Insert case brief template</button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="modal-foot">
        <span id="saveNotebookStatus" class="help" style="margin-right:auto;"></span>
        <button class="btn ghost" id="saveNotebookBtn">Save</button>
        <button class="btn" id="closeCB2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // True close (X / Close button) syncs as a safety net. Internal re-renders triggered
  // by structural edits use closeForRerender() instead, which does NOT sync — that was
  // the actual cause of the lag: every insert/date-change was quietly closing (and thus
  // syncing) the modal on every single action.
  const closeForRerender = () => overlay.remove();
  const close = () => {
    if(state.settings.githubToken){ syncNow().catch(e => console.error(e)); }
    overlay.remove();
  };
  document.getElementById('closeCB').onclick = close;
  document.getElementById('closeCB2').onclick = close;
  document.getElementById('saveNotebookBtn').onclick = async () => {
    if(document.activeElement && overlay.contains(document.activeElement) && document.activeElement.blur){
      document.activeElement.blur();
    }
    const btn = document.getElementById('saveNotebookBtn');
    const status = document.getElementById('saveNotebookStatus');
    btn.disabled = true; btn.textContent = 'Saving...';
    if(state.settings.githubToken){
      try{ await syncNow(); status.textContent = 'Synced just now.'; }
      catch(e){ status.textContent = 'Saved locally — sync failed: ' + e.message; }
    } else {
      status.textContent = 'Saved locally.';
    }
    btn.disabled = false; btn.textContent = 'Save';
  };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  // Auto-grow every field textarea to fit its content (skip ones inside a currently
  // collapsed block — they'll be sized when expanded, since a hidden element reports
  // zero scroll height).
  overlay.querySelectorAll('.legal-pad-section-body:not([style*="display:none"]) .legal-pad-block-body:not([style*="display:none"]) textarea.legal-pad-field').forEach(autoGrowTextarea);

  // Only jump to the first undiscussed brief on a genuinely fresh open.
  if(typeof restoreScrollTop === 'number'){
    const scrollArea = document.getElementById('cbScrollArea');
    if(scrollArea) scrollArea.scrollTop = restoreScrollTop;
  } else {
    setTimeout(() => {
      const firstUndiscussed = overlay.querySelector('.legal-pad-block[data-discussed="0"]');
      if(firstUndiscussed){
        firstUndiscussed.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 50);
  }

  document.getElementById('addSectionBtn').onclick = () => {
    const title = prompt('Topic name (e.g. "False Imprisonment"):');

    }

  // from and no full rebuild to wait on, regardless of how large the notebook gets.
  overlay.querySelectorAll('.insert-template-btn').forEach(btn => {

    btn.onclick = () => {
      setSectionLocked(courseId, btn.dataset.section, true);

      closeForRerender();
      renderCaseBriefNotebookModal(scrollTop);

      setSectionLocked(courseId, btn.dataset.section, false);
      const scrollTop = document.getElementById('cbScrollArea')?.scrollTop || 0;
      closeForRerender();
      renderCaseBriefNotebookModal(scrollTop);
    };
  });
  overlay.querySelectorAll('.del-section-btn').forEach(btn => {
    btn.onclick = () => {
      if(!confirm('Delete this whole topic and every case brief inside it? This can\'t be undone.')) return;
      deleteNotebookSection(courseId, btn.dataset.section);
      const scrollTop = document.getElementById('cbScrollArea')?.scrollTop || 0;
      closeForRerender();
      renderCaseBriefNotebookModal(scrollTop);
    };
  });
  overlay.querySelectorAll('.toggle-section-collapse-btn').forEach(btn => {
    btn.onclick = () => {
      const body = overlay.querySelector(`.legal-pad-section-body[data-section="${btn.dataset.section}"]`);
      const nowCollapsed = body.style.display !== 'none';
      body.style.display = nowCollapsed ? 'none' : '';
      btn.innerHTML = nowCollapsed ? '&#9660;' : '&#9650;';
      btn.title = nowCollapsed ? 'Expand topic' : 'Minimize topic';
      setSectionCollapsed(courseId, btn.dataset.section, nowCollapsed);
      if(!nowCollapsed){
        body.querySelectorAll('.legal-pad-block-body:not([style*="display:none"]) textarea.legal-pad-field').forEach(autoGrowTextarea);
      }

  });
  overlay.querySelectorAll('.del-block-btn').forEach(btn => {
    btn.onclick = () => {
      if(!confirm('Remove this case brief?')) return;
      deleteNotebookBlock(courseId, btn.dataset.section, btn.dataset.block);

  overlay.querySelectorAll('.sec-title-input').forEach(el => {
    el.onblur = () => {
      updateNotebookSectionTitle(courseId, el.dataset.section, el.value);

/* ============ AUDIO PROCESSING ============ */
async function decodeAndResample(file){
  const arrayBuffer = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const tempCtx = new AC();
  let decoded;
  try{
    decoded = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
  } finally {
    tempCtx.close();
  }
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = decoded;
  source.connect(offlineCtx.destination);
  source.start(0);
  const rendered = await offlineCtx.startRendering();
  return { float32: rendered.getChannelData(0), sampleRate: targetRate, durationSec: decoded.duration };
}

function encodeWAV(samples, sampleRate){
  const buffer = new ArrayBuffer(44 + samples.length*2);
  const view = new DataView(buffer);
  function writeString(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4, 36+samples.length*2, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40, samples.length*2, true);
  let offset=44;
  for(let i=0;i<samples.length;i++, offset+=2){
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([view], { type:'audio/wav' });
}

function formatDuration(sec){
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return `${m}m ${s}s`;
}

/* ============ TRANSCRIPTION BACKENDS ============ */
async function localTranscribe(float32, sampleRate, onProgress){
  if(!localTranscriberPromise){
    localTranscriberPromise = (async () => {
      const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      mod.env.allowLocalModels = false;
      let device = 'wasm';
      try{
        if(navigator.gpu){ device = 'webgpu'; }
      }catch(e){}
      let transcriber;
      try{
        transcriber = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { device });
      }catch(e){
        transcriber = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { device: 'wasm' });
      }
      return transcriber;
    })();
  }
  onProgress && onProgress('Loading model into memory...');
  const transcriber = await localTranscriberPromise;
  onProgress && onProgress('Transcribing audio locally — this can take a while for long recordings...');
  const output = await transcriber(float32, {
    chunk_length_s: 30,
    stride_length_s: 5,
    sampling_rate: sampleRate,
  });
  return (output && output.text) ? output.text.trim() : '';
}

function formatEta(seconds){
  if(seconds < 5) return 'a few seconds';
  if(seconds < 60) return `${Math.round(seconds)}s`;
  const mins = Math.floor(seconds/60);
  const secs = Math.round(seconds%60);
  return `${mins}m ${secs}s`;
}
function cloudTranscribe(wavBlob, apiKey, onProgress){
  // XMLHttpRequest instead of fetch specifically because fetch has no upload-progress
  // event — for an audio file that can be tens of MB, a real percentage is worth the
  // switch rather than just showing an indeterminate spinner the whole time.
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.deepgram.com/v1/listen?model=nova-3&smart_format=true&punctuate=true');
    xhr.setRequestHeader('Authorization', `Token ${apiKey}`);
    xhr.setRequestHeader('Content-Type', 'audio/wav');
    const startTime = Date.now();
    xhr.upload.onprogress = (e) => {
      if(!e.lengthComputable || !onProgress) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      const elapsedSec = (Date.now() - startTime) / 1000;
      // Skip the ETA for the first moment — rate estimates from a tiny sample are wild.
      let etaSec = null;
      if(e.loaded > 0 && elapsedSec > 0.5){
        const rate = e.loaded / elapsedSec;
        etaSec = (e.total - e.loaded) / rate;
      }
      onProgress(pct, etaSec);
    };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300){
        try{
          const data = JSON.parse(xhr.responseText);
          resolve(data?.results?.channels?.[0]?.alternatives?.[0]?.transcript || '');
        }catch(e){
          reject(new Error('Could not parse Deepgram response.'));
        }
      } else {
        reject(new Error(`Deepgram error (${xhr.status}): ${(xhr.responseText||'').slice(0,200)}`));
      }
    };
    xhr.onerror = () => reject(new Error('Network error while uploading to Deepgram.'));
    xhr.send(wavBlob);
  });
}

/* ============ CLASS DOCUMENT UPLOAD (PDF / text handouts, readings, slides) ============ */
// A document becomes a lecture entry with kind 'document', so its terms, cases, key points, and policy notes flow into the
// Dictionary, Case Law, Outline, Rule Bank, and everything else that already reads from lectures.
const DOC_TEXT_STORE_CAP = 300000;   // characters kept on the entry
const DOC_TEXT_AI_CAP = 150000;      // characters sent for note generation
let __pdfJsPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(__pdfJsPromise) return __pdfJsPromise;
  __pdfJsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = async () => {
      try{
        const lib = window.pdfjsLib;
        const wres = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
        const wtxt = await wres.text();
        lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([wtxt], { type: 'text/javascript' }));
        resolve(lib);
      }catch(e){ reject(new Error('Could not load the PDF reader. Check your connection and try again.')); }
    };
    s.onerror = () => { __pdfJsPromise = null; reject(new Error('Could not load the PDF reader. Check your connection and try again.')); };
    document.head.appendChild(s);
  });
  return __pdfJsPromise;
}
async function extractPdfText(file, onProgress){
  const lib = await loadPdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await lib.getDocument({ data }).promise;
  const pages = [];
  for(let n = 1; n <= pdf.numPages; n++){
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    let out = '', lastY = null;
    tc.items.forEach(it => {
      const y = it.transform ? Math.round(it.transform[5]) : null;
      if(lastY !== null && y !== null && Math.abs(y - lastY) > 2) out += '\n';
      else if(out && !out.endsWith(' ') && !out.endsWith('\n')) out += ' ';
      out += it.str;
      if(y !== null) lastY = y;
    });
    pages.push('--- Page ' + n + ' ---\n' + out.replace(/[ \t]+\n/g, '\n').trim());
    if(onProgress) onProgress(n, pdf.numPages);
  }
  return { text: pages.join('\n\n'), pageCount: pdf.numPages };
}
async function extractDocumentText(file, onProgress){
  const name = (file.name || '').toLowerCase();
  if(name.endsWith('.pdf') || file.type === 'application/pdf'){
    const r = await extractPdfText(file, onProgress);
    return { text: r.text, label: r.pageCount + (r.pageCount === 1 ? ' page' : ' pages') };
  }
  if(name.endsWith('.txt') || name.endsWith('.md') || (file.type || '').startsWith('text/')){
    const t = await file.text();
    return { text: t, label: Math.max(1, Math.round(t.split(/\s+/).length / 500)) + ' min read' };
  }
  throw new Error('That file type is not supported yet. Use a PDF, or a .txt or .md file. For a Word file, save it as PDF first.');
}
function hasUsableText(text){ return (String(text).replace(/--- Page \d+ ---/g, '').replace(/\s+/g, '')).length >= 40; }

async function processDocumentFile(file, courseId, titleOverride, date, setStatus){
  setStatus('Reading ' + file.name + '...', null);
  const { text, label } = await extractDocumentText(file, (n, total) => setStatus('Reading ' + file.name + ': page ' + n + ' of ' + total, Math.round(n / total * 100)));
  if(!hasUsableText(text)) throw new Error('No selectable text was found in ' + file.name + '. It may be a scanned PDF. Try a text-based copy, or run OCR on it first.');
  const title = (titleOverride && titleOverride.trim()) || file.name.replace(/\.[^.]+$/, '');
  const lecture = {
    id: 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    courseId, title, date,
    kind: 'document',
    status: 'ready',
    transcript: text.length > DOC_TEXT_STORE_CAP ? text.slice(0, DOC_TEXT_STORE_CAP) + '\n\n[Text cut off here to keep storage small.]' : text,
    keyPoints: '', caseLaw: [], keyTerms: [], policyNotes: '',
    durationLabel: label,
    createdAt: Date.now(), updatedAt: Date.now(),
  };
  state.lectures.push(lecture);
  saveState(['lectures']);
  if(state.settings.anthropicKey){
    try{
      const courseName = state.courses.find(c => c.id === courseId)?.name || '';
      const forAi = text.length > DOC_TEXT_AI_CAP ? text.slice(0, DOC_TEXT_AI_CAP) : text;
      const docs = await generateDocs(forAi, state.settings.anthropicKey, courseName, date, (pct, etaSec) => {
        const etaText = etaSec != null ? ' about ' + formatEta(etaSec) + ' remaining' : '';
        setStatus('Pulling terms, cases, and key points from ' + file.name + '... ' + Math.round(pct) + '%' + (etaText ? ' (' + etaText.trim() + ')' : ''), pct);
      }, 'document');
      lecture.keyPoints = docs.keyPoints;
      lecture.caseLaw = mergeCaseArrays(lecture.caseLaw, docs.caseLaw);
      const approved = (state.settings.termReviewMode === 'review' && docs.keyTerms.length) ? await reviewNewTermsModal(docs.keyTerms) : docs.keyTerms;
      if(state.settings.termReviewMode === 'review') approved.forEach(t => { if(t && t.term) clearTermTombstone(lecture.courseId, t.term); });
      lecture.keyTerms = mergeTermArrays(lecture.keyTerms, approved);
      lecture.policyNotes = docs.policyNotes;
      lecture.professorTips = mergeProfessorTips(lecture.professorTips, docs.professorTips);
      lecture.tipsScannedAt = Date.now();
      lecture.updatedAt = Date.now();
      saveState(['lectures']);
    }catch(e){
      console.error(e);
      lecture.noteError = true;
    }
  }
  return lecture;
}

async function generateDocs(transcript, apiKey, courseName, lectureDateStr, onProgress, sourceKind){
  let prompt = `You are helping a first-year law student review a recorded class session for their course "${courseName}".

Read the transcript below and return ONLY a JSON object (no markdown fences, no preamble, no commentary) with exactly this shape:

{
  "keyPoints": "a bullet-point list of the main points, rules, and holdings discussed, each bullet on its own line starting with a dash",
  "caseLaw": [
    { "name": "Case Name v. Other Party", "description": "2-3 sentence plain-language description of what the case is about and the rule it stands for", "quote": "the verbatim sentence(s) the professor actually said about this case, copied exactly from the transcript, word for word", "citation": "the accurate Bluebook-style legal citation for this case, found via web search — e.g. 'Palsgraf v. Long Island R.R. Co., 248 N.Y. 339, 162 N.E. 99 (1928)'. If you cannot verify a reliable citation, set this to null." }
  ],
  "keyTerms": [
    { "term": "the legal term or word of art (e.g. 'battery', 'negligence per se', 'proximate cause')", "definition": "a clear, concise definition of the term as the professor used or explained it, in plain language, 1-2 sentences", "context": "the verbatim sentence(s) from the transcript where the professor actually used this term, copied exactly, word for word. If the term wasn't used in a clear standalone sentence, set to null.", "usagePattern": "a short note on how this term is typically used grammatically or in legal writing — e.g. common phrasing, collocations, or the part of speech — to help the student use it correctly in their own writing, 1 sentence", "hasRationale": true }
  ],
  "policyNotes": "a bullet-point list capturing the WHY behind the rules discussed — the policy justification, the competing interests being balanced, or the tension the rule resolves — as the professor explained or implied it, not just a restatement of the rule itself. Each bullet on its own line starting with a dash. This is what separates a rote answer from a strong one in class discussion, so focus on reasoning and tension, not restating black-letter law. If the professor didn't get into policy/rationale in this session, use 'No policy discussion identified in this session.'",
  "professorTips": [
    "a single meta-level remark the professor made about HOW to study, take the exam, or what they personally emphasize or warn against — NOT a restatement of the legal rule itself. Only include something here if the professor is explicitly speaking in this register: 'remember this for the exam', 'the biggest mistake students make here is...', 'if you remember nothing else from today...', 'I care more about X than Y', 'don't confuse this with...', 'this always shows up on the final'. If nothing like this occurred in the session, use an empty array []."
  ]
}

Rules:
- If no case law was discussed, "caseLaw" must be an empty array [].
- For each case in "caseLaw", use the web_search tool to find its real, accurate legal citation.
- Only use web search for verifying case citations — do not search for anything else, and do not search for things already answerable from the transcript.
- For "keyTerms": include any legal terminology, doctrines, elements of a claim/defense, or terms of art the professor defined, explained, or used substantively — not casual vocabulary. If none, use an empty array []. Set "hasRationale" to true only if the term embodies a rule, element, or doctrine with an underlying policy purpose worth asking "why does this exist" about — set it to false for purely definitional or procedural vocabulary that doesn't really have a "why".
- For "professorTips": be conservative — most sessions will have zero to a few of these, not many. Do not manufacture a tip out of ordinary substantive teaching; it must be the professor speaking about exam craft, emphasis, or common mistakes specifically.
- The "quote" field must be an exact, word-for-word excerpt from the transcript text below, not a paraphrase.
- Keep keyPoints tight and practical, meant for exam review, not a full recap.
- After any web searches, your FINAL message must be raw JSON only, matching the shape above exactly, with no other text before or after it.

TRANSCRIPT:
${transcript}`;
  if(sourceKind === 'document'){
    // A class handout, reading, or slide deck instead of a recording: same output shape, document wording.
    // Only the instructions are reworded; the document text itself is left exactly as extracted.
    const cut = prompt.lastIndexOf('TRANSCRIPT:\n');
    const head = prompt.slice(0, cut).replace('recorded class session', 'document from class (a handout, reading, or slides)')
      .replace(/the professor actually said/g, 'the document actually says')
      .replace(/transcript/g, 'document');
    prompt = head + 'DOCUMENT:\n' + transcript;
  }

  const raw = await fetchClaudeStreamWithToolsProgress({
    model: 'claude-sonnet-4-6',
    max_tokens: 64000,
    temperature: 0.2,
    messages: [{ role: 'user', content: prompt }],
    tools: [{ type: 'web_search_20250305', name: 'web_search' }]
  }, apiKey, 3500, onProgress);
  let parsed;
  try{
    parsed = JSON.parse(extractJSON(raw));
  }catch(e){
    throw new Error('Could not parse notes response. Try again.');
  }
  return {
    keyPoints: parsed.keyPoints || '',
    caseLaw: Array.isArray(parsed.caseLaw) ? parsed.caseLaw.map(c => ({ ...c, citation: c.citation || null })) : [],
    keyTerms: Array.isArray(parsed.keyTerms) ? parsed.keyTerms.map(t => ({ ...t, term: capitalizeTerm(t.term) })) : [],
    policyNotes: parsed.policyNotes || '',
    professorTips: Array.isArray(parsed.professorTips) ? parsed.professorTips.filter(t => typeof t === 'string' && t.trim()) : []
  };
}

async function generateCaseBrief(caseInfo, apiKey){
  const prompt = `You are helping a first-year law student build case-briefing skill — the actual exam and practice skill, not just recall. Using only the information given below (do not invent facts not implied by it), write a properly structured case brief.

CASE: ${caseInfo.name}
${caseInfo.citation ? 'CITATION: ' + caseInfo.citation : ''}
KNOWN DESCRIPTION: ${caseInfo.description || ''}
PROFESSOR'S OWN WORDS ABOUT IT: ${caseInfo.quote || ''}

Return ONLY a JSON object, no markdown fences, no commentary, with exactly this shape:
{
  "facts": "the key facts of the case in your own words, concise, only what's reasonably inferable from the info above — if the facts aren't clear from what's given, say so plainly rather than inventing detail",
  "proceduralHistory": "how the case got to this court / its procedural posture, if inferable; otherwise 'Not enough information to determine.'",
  "issue": "the precise legal question the court had to answer, phrased as a question",
  "holding": "the court's answer to that issue — the rule of law established",
  "reasoning": "the court's reasoning for reaching that holding, in plain language"
}
Be honest about the limits of what's knowable from the given information — a partial or well-hedged brief is far more useful than a confidently invented one.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 64000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content || []).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  return JSON.parse(extractJSON(raw));
}

  const prompt = `You are helping a first-year law student improve their case-briefing skill for "${caseName}". Below is a case brief they wrote themselves, in their own words, for their own course. Use the web_search tool to check what this case actually held, if it's a real, findable case — this lets you verify their facts, issue, rule, and reasoning against the real thing rather than just checking whether it reads well. Do not invent details about the case if you can't find it; be honest about what you couldn't verify.

STUDENT'S BRIEF:
${briefText}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "caseFound": true or false — whether you found and are confident this is a real, identifiable case via search,
  "sections": [
    { "label": "<one of the student's field labels, exactly as given>", "feedback": "specific feedback on this section — what they got right, what's missing or incorrect, and if their grasp of the underlying rule or concept seems shaky, a short teaching explanation of it. If caseFound is false, don't claim to verify against the real case — instead assess for internal consistency, completeness, and whether the legal reasoning holds together on its own terms." }

  "verificationNote": "if caseFound, 1-2 sentences flagging anything important about the real case's facts or holding that the student's version got wrong, missed, or should know — cite what you found. If not caseFound, say so plainly (e.g. 'This appears to be a practice case not found in search results, so this review is based on internal reasoning only, not verified against a real case.')"
}
Be direct and specific, not generically encouraging — the goal is to actually build their case-briefing skill the way a good professor's feedback would, explaining the doctrine behind an error, not just marking it wrong.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 64000,
      temperature: 0.3,
      messages: [{ role: 'user', content: prompt }],
      tools: [{ type: 'web_search_20250305', name: 'web_search' }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text || '');
  const raw = textBlocks.length ? textBlocks[textBlocks.length - 1] : '';
  return JSON.parse(extractJSON(raw));

function extractJSON(raw){
  const start = raw.indexOf('{');
  if(start === -1) throw new Error('No JSON object found in model response.');
  let depth = 0;
  for(let i = start; i < raw.length; i++){
    if(raw[i] === '{') depth++;
    else if(raw[i] === '}'){
      depth--;
      if(depth === 0) return raw.slice(start, i + 1);
    }
  }
  // Response was cut off before the JSON closed — almost always means it ran out of
  // output room (a lecture with lots of case law / key terms produces a lot of JSON).
  throw new Error('Response was cut off before finishing (likely ran out of output room for a lecture with a lot of content). Try Regenerate again — if it keeps happening on this specific lecture, it may need to be split or trimmed.');
}

/* ============ SYNC (GitHub Gist) ============ */
function mergeState(local, remote){
  const deletedIds = new Set([...(local.deletedLectureIds||[]), ...(remote.deletedLectureIds||[])]);

  const courseMap = {};
  (local.courses||[]).forEach(c=>{ courseMap[c.id]=c; });
  (remote.courses||[]).forEach(c=>{ if(!courseMap[c.id]) courseMap[c.id]=c; });

  const lectureMap = {};
  (local.lectures||[]).forEach(l=>{ lectureMap[l.id]=l; });
  (remote.lectures||[]).forEach(l=>{
    const existing = lectureMap[l.id];
    if(!existing || (l.updatedAt||0) > (existing.updatedAt||0)) lectureMap[l.id]=l;
  });

  const lectures = Object.values(lectureMap).filter(l=>!deletedIds.has(l.id));

  const termProgress = { ...(local.termProgress||{}) };
  Object.entries(remote.termProgress||{}).forEach(([key, entry]) => {
    const existing = termProgress[key];
    if(!existing || (entry.updatedAt||0) > (existing.updatedAt||0)) termProgress[key] = entry;
  });

  const caseBriefs = { ...(local.caseBriefs||{}) };
  Object.entries(remote.caseBriefs||{}).forEach(([key, entry]) => {
    const existing = caseBriefs[key];
    if(!existing || (entry.updatedAt||0) > (existing.updatedAt||0)) caseBriefs[key] = entry;
  });

  const courseDocs = { ...(local.courseDocs||{}) };
  Object.entries(remote.courseDocs||{}).forEach(([key, entry]) => {
    const existing = courseDocs[key];
    if(!existing || (entry.updatedAt||0) > (existing.updatedAt||0)) courseDocs[key] = entry;
  });

  const customTerms = { ...(local.customTerms||{}) };
  Object.entries(remote.customTerms||{}).forEach(([key, entry]) => {
    const existing = customTerms[key];
    if(!existing || (entry.updatedAt||0) > (existing.updatedAt||0)) customTerms[key] = entry;
  });

  // Timestamp-based merge, not a union — a genuine "I brought this word back" has to be
  // able to outrank a stale "this was deleted" from whichever side hasn't seen that
  // change yet, or a re-added word could keep vanishing after every sync.
  const deletedTerms = { ...(local.deletedTerms||{}) };
  Object.entries(remote.deletedTerms||{}).forEach(([key, record]) => {
    const existing = deletedTerms[key];
    if(!existing || (record.updatedAt||0) > (existing.updatedAt||0)) deletedTerms[key] = record;
  });

  const caseBriefNotebooks = { ...(local.caseBriefNotebooks||{}) };
  Object.entries(remote.caseBriefNotebooks||{}).forEach(([key, entry]) => {
    const existing = caseBriefNotebooks[key];
    if(!existing || (entry.updatedAt||0) > (existing.updatedAt||0)) caseBriefNotebooks[key] = entry;
  });

  const issueSpottingProgress = { ...(local.issueSpottingProgress||{}) };
  Object.entries(remote.issueSpottingProgress||{}).forEach(([key, count]) => {
    issueSpottingProgress[key] = Math.max(issueSpottingProgress[key]||0, count||0);
  });

  const outlineFlashcards = { ...(local.outlineFlashcards||{}) };
  Object.entries(remote.outlineFlashcards||{}).forEach(([courseId, remoteCards]) => {
    const localCards = outlineFlashcards[courseId] || [];
    const localIds = new Set(localCards.map(c=>c.id));
    outlineFlashcards[courseId] = [...localCards, ...(remoteCards||[]).filter(c => !localIds.has(c.id))];
  });

  // barSubjectLinks: simple per-subject arrays of courseIds — union, deduped.
  const barSubjectLinks = { ...(local.barSubjectLinks||{}) };
  Object.entries(remote.barSubjectLinks||{}).forEach(([subjectId, remoteCourseIds]) => {
    const existing = new Set(barSubjectLinks[subjectId] || []);
    (remoteCourseIds||[]).forEach(id => existing.add(id));
    barSubjectLinks[subjectId] = Array.from(existing);
  });

  const barReviews = { ...(local.barReviews||{}) };
  Object.entries(remote.barReviews||{}).forEach(([subjectId, entry]) => {
    const existing = barReviews[subjectId];
    if(!existing || (entry.updatedAt||0) > (existing.updatedAt||0)) barReviews[subjectId] = entry;
  });

  return { courses: Object.values(courseMap), lectures, deletedLectureIds: Array.from(deletedIds), termProgress, caseBriefs, courseDocs, customTerms, deletedTerms, caseBriefNotebooks, issueSpottingProgress, outlineFlashcards, barSubjectLinks, barReviews };
}

async function syncNow(){
  const token = state.settings.githubToken;
  let gistId = state.settings.gistId;
  if(!token) throw new Error('Add a GitHub token in Settings first.');

  let remoteData = null;
  if(gistId){
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if(res.ok){
      const gist = await res.json();
      const file = gist.files && gist.files['docket-data.json'];
      if(file && file.content){
        remoteData = JSON.parse(file.content);
        if(remoteData) remoteData.lectures = normalizeLectures(remoteData.lectures);
      }
    } else if(res.status === 404){
      gistId = null;
    } else {
      const t = await res.text().catch(()=> '');
      throw new Error(`GitHub error (${res.status}): ${t.slice(0,150)}`);
    }
  }

  const merged = remoteData
    ? mergeState({ courses: state.courses, lectures: state.lectures, deletedLectureIds: state.deletedLectureIds||[], termProgress: state.termProgress||{}, caseBriefs: state.caseBriefs||{}, courseDocs: state.courseDocs||{}, customTerms: state.customTerms||{}, deletedTerms: state.deletedTerms||{}, caseBriefNotebooks: state.caseBriefNotebooks||{}, issueSpottingProgress: state.issueSpottingProgress||{}, outlineFlashcards: state.outlineFlashcards||{}, barSubjectLinks: state.barSubjectLinks||{}, barReviews: state.barReviews||{} }, remoteData)
    : { courses: state.courses, lectures: state.lectures, deletedLectureIds: state.deletedLectureIds||[], termProgress: state.termProgress||{}, caseBriefs: state.caseBriefs||{}, courseDocs: state.courseDocs||{}, customTerms: state.customTerms||{}, deletedTerms: state.deletedTerms||{}, caseBriefNotebooks: state.caseBriefNotebooks||{}, issueSpottingProgress: state.issueSpottingProgress||{}, outlineFlashcards: state.outlineFlashcards||{}, barSubjectLinks: state.barSubjectLinks||{}, barReviews: state.barReviews||{} };

  state.courses = merged.courses;
  state.lectures = merged.lectures;
  state.deletedLectureIds = merged.deletedLectureIds;
  state.termProgress = merged.termProgress;
  state.caseBriefs = merged.caseBriefs;
  state.courseDocs = merged.courseDocs;
  state.customTerms = merged.customTerms;
  state.deletedTerms = merged.deletedTerms;
  state.caseBriefNotebooks = merged.caseBriefNotebooks;
  state.issueSpottingProgress = merged.issueSpottingProgress;
  state.outlineFlashcards = merged.outlineFlashcards;
  state.barSubjectLinks = merged.barSubjectLinks;
  state.barReviews = merged.barReviews;

  const body = {
    description: 'The Docket — synced app data (do not edit manually)',
    public: false,
    files: {
      'docket-data.json': {
        content: JSON.stringify({ courses: merged.courses, lectures: merged.lectures, deletedLectureIds: merged.deletedLectureIds, termProgress: merged.termProgress, caseBriefs: merged.caseBriefs, courseDocs: merged.courseDocs, customTerms: merged.customTerms, deletedTerms: merged.deletedTerms, caseBriefNotebooks: merged.caseBriefNotebooks, issueSpottingProgress: merged.issueSpottingProgress, outlineFlashcards: merged.outlineFlashcards, barSubjectLinks: merged.barSubjectLinks, barReviews: merged.barReviews }, null, 2)
      }
    }
  };

  const res2 = await fetch(gistId ? `https://api.github.com/gists/${gistId}` : `https://api.github.com/gists`, {
    method: gistId ? 'PATCH' : 'POST',
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!res2.ok){
    const t = await res2.text().catch(()=> '');
    throw new Error(`GitHub sync failed (${res2.status}): ${t.slice(0,150)}`);
  }
  const gistResult = await res2.json();
  state.settings.gistId = gistResult.id;
  state.settings.lastSync = Date.now();
  saveState(['settings']);
}

/* ============ UTIL ============ */
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
render();
