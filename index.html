function renderIssueSpottingModal(){
  const course = state.courses.find(c=>c.id===ui.activeCourse);
  const progress = state.issueSpottingProgress || {};
  const unit1Stage = getTechniqueStage('unit-topic-vs-issue');
  const unit2Stage = getTechniqueStage('unit-issue-statement');
  const foundationsMastered = unit2Stage >= 3;
  const masteredCount = ISSUE_SPOTTING_TECHNIQUES.filter(t => (progress[t.id]||0) >= 3).length;
  const allMastered = masteredCount === ISSUE_SPOTTING_TECHNIQUES.length;

  function unitRow(unit, isFoundation){
    const stage = getTechniqueStage(unit.id);
    const btnLabel = stage === 0 ? 'Start: Learn why it works' : stage === 1 ? 'Continue: Guided practice' : stage === 2 ? 'Continue: Try it on your own' : 'Practice again';
    return `
      <div style="margin-bottom:16px;border-bottom:1px solid var(--rule);padding-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
          <div style="font-weight:600;font-size:15.5px;">${escapeHtml(unit.name)}</div>
          <div class="mono" style="font-size:10px;color:${stage>=3?'var(--green-ok)':'var(--ink-soft)'};white-space:nowrap;">${escapeHtml(STAGE_LABELS[stage])}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin:5px 0 8px;">
          <div style="flex:1;max-width:140px;height:5px;background:var(--rule);position:relative;">
            <div style="position:absolute;left:0;top:0;bottom:0;width:${(stage/3)*100}%;background:${stage>=3?'var(--green-ok)':'var(--brass)'};"></div>
          </div>
        </div>
        <div class="summary-body" style="font-size:14px;margin:4px 0 6px;">${escapeHtml(unit.tip)}</div>
        <button class="btn ghost start-technique-btn" data-technique="${unit.id}" data-stage="${stage}" data-foundation="${isFoundation?'1':'0'}" style="font-size:13px;padding:8px 14px;">${btnLabel}</button>
      </div>
    `;
  }

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal wide">
      <div class="modal-head">
        <h2>Issue Spotting: ${escapeHtml(course?course.name:'')}</h2>
        <button class="modal-close" id="closeIS">&times;</button>
      </div>
      <div class="modal-body">
        <div class="help" style="margin-bottom:10px;">A complete build-up: first what an issue actually is, then how to phrase one as a proper issue statement, then eight detection techniques for finding them, then — once all of that is mastered — unhinted multi-issue practice.</div>

        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--brass);margin:16px 0 10px;">Foundations</div>
        ${unitRow(ISSUE_SPOTTING_FOUNDATIONS[0], true)}
        ${unitRow(ISSUE_SPOTTING_FOUNDATIONS[1], true)}

        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--brass);margin:20px 0 10px;">Detection Techniques ${foundationsMastered ? '' : '(locked until Unit 2 is mastered)'}</div>
        ${!foundationsMastered ? `
          <div class="help">Master "Writing an Issue Statement" above first — the detection techniques are for finding issues faster, but there's no point finding one you can't yet phrase properly.</div>
        ` : `
          <div class="help" style="margin-bottom:14px;color:${allMastered?'var(--green-ok)':'var(--brass)'};">${masteredCount} / ${ISSUE_SPOTTING_TECHNIQUES.length} techniques mastered${allMastered ? ' — you\'re ready for unhinted multi-issue practice (Practice &rarr; Multi-issue exam).' : ''}</div>
          ${ISSUE_SPOTTING_TECHNIQUES.map(t => unitRow(t, false)).join('')}
        `}

        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--brass);margin:20px 0 10px;">NextGen UBE-Style Practice ${allMastered ? '' : '(locked until all techniques are mastered)'}</div>
        ${!allMastered ? `
          <div class="help">One more step once every technique above is mastered: NextGen shifted the bar toward testing applied skills inside one connected scenario, not just doctrinal recall. This mode gives you a single fact pattern with three linked questions — issue-spotting, rule application, and a professional-judgment question classic bar prep never asked.</div>
        ` : `
          <div class="help" style="margin-bottom:10px;">One scenario, three connected questions — issue-spotting, rule application, and professional judgment — mirroring how NextGen actually tests.</div>
          <button class="btn ghost" id="startIntegratedSet" style="font-size:13px;padding:8px 14px;">Start an Integrated Question Set</button>
        `}
      </div>
      <div class="modal-foot">
        <button class="btn" id="closeIS2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closeIS').onclick = close;
  document.getElementById('closeIS2').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  const startIQS = document.getElementById('startIntegratedSet');
  if(startIQS) startIQS.onclick = async () => {
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    startIQS.disabled = true; startIQS.textContent = 'Generating...';
    const { update, cleanup } = showDeterminateBar(startIQS);
    try{
      const context = buildCourseContextForPractice(ui.activeCourse);
      const set = await generateIntegratedQuestionSet(course?course.name:'', context, state.settings.anthropicKey, update);
      cleanup();
      close();
      renderIntegratedSetAnswerModal(set);
    }catch(e){
      cleanup();
      alert('Could not generate a question set: ' + e.message);
      startIQS.disabled = false; startIQS.textContent = 'Start an Integrated Question Set';
    }
  };
  overlay.querySelectorAll('.start-technique-btn').forEach(btn => {
    btn.onclick = async () => {
      if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
      const isFoundation = btn.dataset.foundation === '1';
      const technique = isFoundation
        ? ISSUE_SPOTTING_FOUNDATIONS.find(t => t.id === btn.dataset.technique)
        : ISSUE_SPOTTING_TECHNIQUES.find(t => t.id === btn.dataset.technique);
      const stage = parseInt(btn.dataset.stage, 10);
      const targetStage = stage >= 3 ? 3 : stage; // "practice again" replays the independent stage
      btn.disabled = true; btn.textContent = 'Loading...';
      const options = isFoundation ? {
        guidedGenFn: generateFoundationGuidedDrill,
        gradeFn: gradeFoundationGuidedDrill,
        independentGenFn: generateFoundationIndependentDrill,
        taskLabel: technique.id === 'unit-topic-vs-issue'
          ? 'What is the specific issue here (not just the topic)?'
          : 'Write this as a properly formatted issue statement (Whether ___, when ___).',
        hintLabel: technique.id === 'unit-topic-vs-issue'
          ? (d) => `You're told the general topic: <b>"${escapeHtml(d.signalPhrase)}"</b>. Now push further to the specific issue.`
          : (d) => `The issue, stated informally: <b>"${escapeHtml(d.signalPhrase)}"</b>. Now phrase it as a proper issue statement.`,
      } : undefined;
      try{
        const context = buildCourseContextForPractice(ui.activeCourse);
        if(targetStage === 0){
          const lessonFn = isFoundation ? generateFoundationLesson : generateTechniqueLesson;
          const lesson = await lessonFn(technique, course?course.name:'', context, state.settings.anthropicKey);
          close();
          renderTechniqueLessonModal(technique, lesson, options);
        } else if(targetStage === 1){
          const guidedGenFn = isFoundation ? generateFoundationGuidedDrill : generateGuidedDrill;
          const drill = await guidedGenFn(technique, course?course.name:'', context, state.settings.anthropicKey);
          close();
          renderGuidedDrillAnswerModal(technique, drill, options);
        } else {
          const indepGenFn = isFoundation ? generateFoundationIndependentDrill : generateTechniqueDrill;
          const drill = await indepGenFn(technique, course?course.name:'', context, state.settings.anthropicKey);
          close();
          renderTechniqueAnswerModal(technique, drill, options);
        }
      }catch(e){
        alert('Could not load this step: ' + e.message);
        btn.disabled = false; btn.textContent = 'Continue';
      }
    };
  });
}

    <div class="modal wide">

  document.getElementById('closeGA').onclick = close;

      errEl.innerHTML = `<div class="err-box">${escapeHtml(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Get feedback';
    }

async function generateWritingFeedback(draft, question, apiKey){
  const prompt = question ? `A first-year law student answered a graded quiz/exam question and wants to understand what cost them points, so they can improve. Focus on legal reasoning and issue-spotting completeness — the actual skill being tested — not tone or vocabulary.

QUESTION / FACT PATTERN THEY WERE ANSWERING:
${question}

THEIR ANSWER:
${draft}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "missedIssues": "go through the fact pattern and identify every distinct issue, element, or sub-point it raises. For each one, say whether their answer addressed it, partially addressed it, or missed it entirely. Be specific and thorough — this is the single most useful section for them.",
  "structure": "does their answer show the reasoning process (rule stated, then applied to facts) or does it jump straight to a conclusion without showing the work? Point to specifics.",
  "ruleApplication": "does the analysis actually apply the rule to these specific facts, or stay abstract/conclusory? Point to a specific passage.",
  "gaps": "any counterarguments, exceptions, or minority/majority rule distinctions that a fuller answer would have addressed, even if only to rule them out",
  "strongestPart": "the single strongest part of their answer, and why",
  "topPriorityFix": "the one change that would have earned them the most additional points"
}
Be honest and direct — the goal is to show them exactly what a full-credit answer would have included, the way a professor's rubric would.` : `A first-year law student wants feedback on a piece of legal writing (a memo, brief, or analysis draft) before turning it in. Focus entirely on structure and precision — the things that make writing read as competent legal analysis rather than a first-year draft. Do not comment on tone, vocabulary, or "sounding smart" — those aren't what's being evaluated.

DRAFT:
${draft}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "structure": "does it follow a clear IRAC/CREAC-style structure? Point to specific places where structure is strong or missing.",
  "precision": "are legal terms used correctly and precisely? Any imprecise or incorrect usage, named specifically?",
  "ruleApplication": "does the analysis actually apply the rule to the specific facts, or does it stay abstract/conclusory? Point to a specific passage.",
  "gaps": "any counterarguments, elements, or steps in the analysis that seem to be missing",
  "strongestPart": "the single strongest part of the draft, and why",
  "topPriorityFix": "if they only fix one thing before submitting, what should it be"
}
Be honest and direct. This is meant to actually improve the grade, not to make them feel good.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 64000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  return JSON.parse(extractJSON(raw));
}

/* ============ COURSE OUTLINE & RULE BANK ============ */
function buildCourseSynthesisContext(courseId){
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && (l.keyPoints || l.policyNotes))
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));

  const blocks = lectures.map(l => ({
    lecture: l,
    text: `## ${l.title || 'Untitled'} (${l.date || 'no date'})\n${l.keyPoints ? 'Key Points:\n' + l.keyPoints : ''}${l.policyNotes && !/^no policy discussion/i.test(l.policyNotes.trim()) ? '\n\nPolicy/Rationale:\n' + l.policyNotes : ''}`
  }));

  // Cap is generous — should comfortably fit a full semester for most courses. If we
  // still have to drop lectures, drop from the OLDEST end and keep the newest, since
  // regenerating is usually specifically to capture a class that just happened. Whole
  // lectures are dropped, never a lecture cut off mid-sentence.
  const CHAR_CAP = 150000;
  let totalLen = blocks.reduce((sum,b) => sum + b.text.length + 2, 0);
  const excluded = [];
  let startIdx = 0;
  while(totalLen > CHAR_CAP && startIdx < blocks.length - 1){
    totalLen -= (blocks[startIdx].text.length + 2);
    excluded.push(blocks[startIdx].lecture);
    startIdx++;
  }
  const included = blocks.slice(startIdx);
  const combinedText = included.map(b => b.text).join('\n\n');

  // Built from the same included/excluded lecture set as combinedText, so a tips
  // synthesis and an outline synthesis always agree on which lectures were covered —
  // kept as its own field rather than folded into combinedText so Outline/Rule Bank
  // generation isn't handed tip-style commentary it didn't ask for.
  const tipsText = included
    .filter(b => b.lecture.professorTips && b.lecture.professorTips.length)
    .map(b => `## ${b.lecture.title || 'Untitled'} (${b.lecture.date || 'no date'})\n${b.lecture.professorTips.map(t => '- ' + t).join('\n')}`)
    .join('\n\n');

  const caseLawText = buildCaseLawIndex(courseId)
    .map(c => `${c.name}${c.citation ? ' ('+c.citation+')' : ''}: ${c.description}`)
    .join('\n')
    .slice(0, 6000);

  return {
    combinedText, caseLawText, tipsText,
    lectureCount: included.length,
    excludedLectures: excluded.map(l => ({ title: l.title, date: l.date })),
  };
}

async function generateCourseOutline(courseName, context, apiKey, onProgress){
  const prompt = `You are helping a law student build a comprehensive course outline for "${courseName}" — the primary study document they'll use going into finals. Using the class notes and case law below (given by lecture date), synthesize ONE outline organized BY LEGAL TOPIC OR DOCTRINE, not by date. Merge overlapping or repeated points across lectures into one clear statement of the rule, note where a rule was refined or added to in a later class, and place the relevant case law directly under the topic it supports rather than in a separate list.

CRITICAL FORMATTING RULE: whenever a rule, claim, or doctrine breaks down into multiple elements — the way a professor splits a definition into its component parts when teaching it — list those elements as a numbered list (1. 2. 3.), never as dashes or a run-on sentence. Dash bullets are for supporting notes, sub-points, or case facts; numbered lists are reserved specifically for elements of a rule. For rules that have a genuine policy rationale (not pure procedural or definitional content), add exactly one short, direct sentence right after the elements, starting with "*Why:*" — plain and to the point, not elaborated prose. Skip it entirely for rules that don't really have a "why." For example:

## Battery
Intentional tort requiring:
1. Intent to cause harmful or offensive contact
2. Harmful or offensive contact actually occurs
3. Causation between the act and the contact
*Why:* Protects a person's right to control their own body from unwanted contact, regardless of whether real physical harm results.
- *[Case name]*: illustrates that contact through an object the plaintiff is holding still satisfies the contact element

TABLES: use a Markdown table wherever the material is genuinely a side-by-side comparison — majority vs. minority rule across jurisdictions, elements/remedies/defenses compared across a few similar torts, standards of review compared across issue types, statute of limitations periods across different claims. Use standard Markdown table syntax:

| Rule | Element | Standard |
|------|---------|----------|
| Example | Example | Example |

Use these sparingly and only where you're genuinely comparing multiple things side by side — most individual rules are still better served by the numbered-elements format above, and a table is worse than a clean list for anything that isn't actually a comparison. Keep tables small (a handful of rows/columns) and place directly under the topic they compare.

CLASS NOTES BY LECTURE:
${context.combinedText || '(no key points recorded yet)'}

CASE LAW DISCUSSED:
${context.caseLawText || '(none recorded yet)'}

Return the outline as clean, well-structured Markdown (# / ## headers, numbered lists for every rule's elements, dash bullets for everything else, occasional tables for genuine comparisons). Return ONLY the outline text itself — no preamble, no commentary, no closing remarks.`;

  return await fetchClaudeStreamWithProgress({
    model: 'claude-sonnet-4-6',
    max_tokens: 64000,
    temperature: 0.3,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 3500, onProgress);
}

async function generateRuleBank(courseName, context, apiKey, onProgress){
  const prompt = `You are helping a law student build a condensed rule-statement bank for "${courseName}" — the kind of one-page black-letter cheat sheet used for exam prep. Using the class notes below, extract every distinct legal rule, claim, or doctrine discussed — for a torts course, that means every tort covered, not just a subset.

For each rule, give the rule name as a header, then four clearly labeled parts, in this order, using bold sub-labels exactly as shown:

**Elements** — broken down the exact way a professor splits a definition into parts when teaching it, as a numbered list (1. 2. 3.), one element per line, terse and precise, no case names, no policy discussion, no explanation folded into the element itself. If an element has sub-requirements, nest a lettered list (a. b. c.) under it. Immediately after the elements, if the rule has a genuine policy rationale (not pure procedural/definitional content), add exactly one short, direct sentence starting with "*Why:*" — plain and to the point, not elaborated prose. Skip it entirely for rules that don't really have a "why."

**Remedies** — what relief is actually available if the claim succeeds (e.g. compensatory damages, nominal damages, punitive damages if applicable, injunctive relief), as a short numbered or dash list. Skip this section only if the class material genuinely never covered remedies for that rule.

**Defenses** — the defenses that commonly arise against this specific claim, each as its own line with its own brief elements/requirements where the material supports it (e.g. consent, self-defense, defense of property, privilege) — not a generic list of all torts defenses, only ones actually relevant to this claim. Skip this section only if none were covered.

**Nuances** — any qualifier, exception, minority/majority jurisdictional split, or "gotcha" that changes how the doctrine applies and that a student would otherwise miss — the kind of thing a professor flags as "don't forget." Keep this tight, a sentence or two per point, not a restatement of the elements. Skip this section only if the material didn't cover any.

Group related rules under a shared topic header where it makes sense, but keep each rule's four-part breakdown intact rather than merging them together.

Example of the expected format:
## Battery
**Elements**
1. Intent to cause harmful or offensive contact (or intent to cause imminent apprehension of such contact)
2. Harmful or offensive contact with the plaintiff's person actually results
3. Causation
*Why:* Protects a person's right to control their own body from unwanted contact, regardless of whether real physical harm results.

**Remedies**
- Compensatory damages (including for offense/dignitary harm even absent physical injury)
- Punitive damages where conduct is willful or malicious

**Defenses**
- Consent — express or implied (e.g. participation in a contact sport)
- Self-defense — reasonable force proportionate to the perceived threat

**Nuances**
- Contact need not be with the plaintiff's actual body — an object closely associated with the person (e.g. a plate the plaintiff is holding) can satisfy the contact element.
- "Offensive" is judged by an objective, reasonable-person standard, not the plaintiff's own subjective sensitivity.

## False Imprisonment
**Elements**
1. An act or omission intended to confine another
2. The act directly or indirectly results in confinement
3. Confinement to a bounded area with no reasonable means of escape known to the plaintiff
4. Plaintiff is aware of the confinement, or is harmed by it

**Remedies**
- Compensatory damages for the deprivation of liberty and any resulting harm
- Nominal damages where confinement is proven but no substantial harm resulted

**Defenses**
- Shopkeeper's privilege — reasonable, temporary detention on reasonable suspicion of theft
- Consent to the confinement

**Nuances**
- Under the majority/Restatement view, awareness must exist during the confinement — learning of it only afterward does not satisfy the awareness element.

CLASS NOTES:
${context.combinedText || '(no key points recorded yet)'}

Return as clean Markdown text only (## headers per rule, bold sub-labels for Elements/Remedies/Defenses/Nuances, numbered lists for elements). This should be short enough to actually use as a one-page reference during an exam, not a restatement of the full outline — no explanatory prose beyond what's asked for above. Return ONLY the rule bank itself — no preamble, no commentary.`;

  return await fetchClaudeStreamWithProgress({
    model: 'claude-sonnet-4-6',
    max_tokens: 64000,
    temperature: 0.2,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 4200, onProgress);
}

function getOutlineFlashcards(courseId){
  return (state.outlineFlashcards || {})[courseId] || [];
}
function addOutlineFlashcards(courseId, cards, sourceTag){
  const existing = getOutlineFlashcards(courseId);
  const additions = cards
    .filter(c => c.term && c.definition)
    .map(c => ({ id: 'ofc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), term: c.term.trim(), definition: c.definition.trim(), source: sourceTag, createdAt: Date.now(), hasRationale: c.hasRationale }));
  state.outlineFlashcards = state.outlineFlashcards || {};
  state.outlineFlashcards[courseId] = [...existing, ...additions];
  saveState(['outlineFlashcards']);
  return additions.length;
}
function deleteOutlineFlashcard(courseId, cardId){
  state.outlineFlashcards[courseId] = getOutlineFlashcards(courseId).filter(c => c.id !== cardId);
  saveState(['outlineFlashcards']);
}
function buildOutlineFlashcardPool(courseId, sourceFilter){
  const cards = getOutlineFlashcards(courseId).map(c => ({ term: c.term, definition: c.definition, source: c.source, cardId: c.id, createdAt: c.createdAt, hasRationale: c.hasRationale }));
  return sourceFilter ? cards.filter(c => c.source === sourceFilter) : cards;
}

async function turnIntoFlashcards(triggerBtn, courseId, sourceLabel, sourceTag, text, closeParentModal){
  if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
  if(!text || !text.trim()){ alert('Nothing to extract from yet.'); return; }
  triggerBtn.disabled = true; triggerBtn.textContent = 'Extracting...';
  const { update, cleanup } = showDeterminateBar(triggerBtn);
  try{
    const cards = await extractFlashcardsFromDocument(sourceLabel, text, state.settings.anthropicKey, update);
    cleanup();
    if(!cards.length){
      alert('Could not find any clear flashcard-worthy terms in this document.');
      triggerBtn.disabled = false; triggerBtn.textContent = 'Turn into flashcards';
      return;
    }
    const approved = await reviewNewTermsModal(cards);
    if(approved.length){
      const added = addOutlineFlashcards(courseId, approved, sourceTag);
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      alert(`Added ${added} card(s) to this course's Outline & Rule Bank flashcard deck — kept separate from your regular Dictionary.`);
      if(closeParentModal) closeParentModal();
      render();
    }
  }catch(e){
    cleanup();
    alert('Could not extract flashcards: ' + e.message);
  }
  triggerBtn.disabled = false; triggerBtn.textContent = 'Turn into flashcards';
}

async function extractProfessorTipsOnly(transcript, apiKey){
  // A lightweight, tips-only pass for backfilling lectures that already have a saved
  // transcript but were processed before this feature existed — no web search, no
  // touching keyPoints/caseLaw/keyTerms, just this one field.
  const prompt = `Read the class transcript below and identify any meta-level remarks the professor made about HOW to study, take the exam, or what they personally emphasize or warn against — NOT the substantive legal rules themselves. Only include something if the professor is explicitly speaking in this register: "remember this for the exam", "the biggest mistake students make here is...", "if you remember nothing else from today...", "I care more about X than Y", "don't confuse this with...", "this always shows up on the final". Be conservative — most sessions will have zero to a few of these, not many.

Return ONLY a JSON object, no markdown fences, no commentary:
{ "professorTips": ["tip 1", "tip 2"] }
If nothing like this occurred, return { "professorTips": [] }.

TRANSCRIPT:
${transcript}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 64000,
      temperature: 0.2,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  const parsed = JSON.parse(extractJSON(raw));
  return Array.isArray(parsed.professorTips) ? parsed.professorTips.filter(t => typeof t === 'string' && t.trim()) : [];
}

async function generateWhyExplanation(term, definition, studentAnswer, apiKey){
  // Elaborative interrogation only works if the feedback engages with what the student
  // actually wrote — comparing it against a separately-generated reference paragraph
  // just means eyeballing two disconnected texts, and a professor's own framing in
  // class can be long and specific in ways that make a poor standard to match exactly.
  // This judges the underlying reasoning instead: does it hold up substantively, even
  // if phrased completely differently than any "model" answer would be.
  const prompt = `A law student is studying the term "${term}" (defined as: ${definition}). They wrote their own explanation of why this rule/element exists — what it's protecting against, what would go wrong without it:

"${studentAnswer}"

Assess whether their reasoning is substantively sound — do they capture a legitimate policy rationale for this rule, even if phrased completely differently than you would put it yourself? Legal rationale often has more than one defensible framing, so judge the underlying idea, not exact wording or completeness against everything that could possibly be said. In 3-5 sentences: confirm what they got right, note anything significant they missed or got wrong, and if useful, mention an angle they didn't consider. Plain language, no headers, no preamble, no score or grade. Return ONLY the feedback itself.`;

  return await fetchClaudeStreamWithProgress({
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 64000,
    temperature: 0.3,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 350, null);
}

function buildRuleSynthesisContext(courseId){
  // Real assigned cases are always better material for a synthesis exercise than
  // invented ones — this gathers full briefs (issue/holding/reasoning) already built
  // via the Case Law feature, if there are enough to work with.
  const cases = buildCaseLawIndex(courseId);
  const briefed = cases
    .map(c => ({ name: c.name, brief: getCaseBrief(courseId, c.name) }))
    .filter(c => c.brief && c.brief.issue && c.brief.holding);
  const text = briefed.map(c => `Case: ${c.name}\nIssue: ${c.brief.issue}\nHolding: ${c.brief.holding}\nReasoning: ${c.brief.reasoning || '(not recorded)'}`).join('\n\n');
  return { text, count: briefed.length };
}

function leitnerNext(prev, gotIt){
  // Same rules as every other deck: a miss resets to box 1 at once, but a box only advances once
  // per calendar day so same-session repeats can't rocket an item to "mastered".
  const today = todayStr();
  const advancedToday = !!(prev && prev.lastAdvanceDate === today);
  let box;
  if(!gotIt) box = 1;
  else if(advancedToday) box = prev.box || 1;
  else box = Math.min(((prev && prev.box) || 0) + 1, 5);
  return {
    box,
    nextReview: addDays(today, LEITNER_INTERVALS[box - 1]),
    lastReviewed: Date.now(),
    lastAdvanceDate: (gotIt && !advancedToday) ? today : ((prev && prev.lastAdvanceDate) || null),
    reviewCount: ((prev && prev.reviewCount) || 0) + 1,
  };
}

function normalizePlaybookDrill(p){
  if(!p || typeof p.factPattern !== 'string' || p.factPattern.trim().length < 80) throw new Error('The model returned an incomplete fact pattern. Try again.');
  const issues = (Array.isArray(p.issues) ? p.issues : [])
    .filter(i => i && i.claim && i.expected)
    .map(i => ({ claim: String(i.claim).trim(), expected: String(i.expected).trim() }));
  if(!issues.length) throw new Error('The model returned a fact pattern without an answer key. Try again.');
  return {
    factPattern: p.factPattern.trim(),
    call: String(p.call || 'Discuss the claims and defenses these facts raise.').trim(),
    issues,
  };
}

function normalizePlaybookGrade(p){

    .map(s => ({ check: String(s.check), pass: s.pass === true || s.pass === 'true', note: String(s.note || '') }));

"""

Grade like this:
1. "issues": include EVERY issue from the answer key, in the key's order. verdict is "hit" (spotted and analyzed correctly), "partial" (spotted but analysis wrong or thin, or conclusion wrong), or "missed". The note is one or two specific sentences — quote a short phrase from the essay where useful. Also add an entry with verdict "partial" and the note starting "Extra:" for any claim the student analyzed that is not in the key only if it was clearly wrong or irrelevant.
2. "structure": 4 to 10 checks, only those that apply to this essay, each judged against the student's structures. Consider: opening paragraph has all three sentences (name the claim and parties, define the claim, predict the outcome); each element paragraph runs the five moves in order (name, define, fact, explicit connection of fact to definition, conclusion of that element); a closing sentence per claim; a nested sub-test (negligence per se, res ipsa loquitur) placed inside the right element and walked as its own numbered sub-test; the proximate cause fork flagged when a secondary unusual harm appears; FTCA walks each deadline separately with explicit dates and a met/not-met for each; private nuisance uses classification then balancing and does NOT force numbered elements; medical malpractice uses the professional standard, not reasonable person. Each check has "check" (what was checked), "pass" (true or false), and "note" (one short sentence, specific).
3. "analysis": 2 to 4 sentences on the quality of the legal analysis itself — is each fact explicitly connected to the definition with "because", are conclusions justified, were close calls acknowledged. Be honest and specific.
4. "fixes": the 2 or 3 most valuable things to fix, most points-costly first, each one concrete and actionable.

Do NOT write a model answer or rewrite any of the student's paragraphs. Do not give a numeric score. Be direct, not harsh, and do not pad praise.

Return ONLY a JSON object, no markdown fences, no commentary:
{ "issues": [ { "claim": "", "verdict": "hit", "note": "" } ], "structure": [ { "check": "", "pass": true, "note": "" } ], "analysis": "", "fixes": [ "" ] }`;

  const raw = await fetchClaudeStreamWithProgress({
    model: 'claude-sonnet-4-6',
    max_tokens: 64000,
    temperature: 0.2,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 4500, onProgress);
  return normalizePlaybookGrade(JSON.parse(extractJSON(raw)));
}

function playbookFeedbackHtml(result){
  const mark = { hit: ['✓', '#3a7d44', 'Spotted'], partial: ['~', '#8A6D1E', 'Partly'], missed: ['✗', 'var(--oxblood)', 'Missed'] };
  const head = (t) => `<div class="section-label" style="margin-top:16px;">${t}</div>`;
  const row = (glyph, color, title, note) => `<div style="display:flex;gap:10px;margin-bottom:8px;font-size:14px;line-height:1.55;"><span style="flex:0 0 auto;color:${color};font-weight:700;">${glyph}</span><div style="min-width:0;"><b>${escapeHtml(title)}</b>${note ? ' &mdash; ' + escapeHtml(note) : ''}</div></div>`;
  return `
    ${result.issues.length ? head('Issues') + result.issues.map(i => { const m = mark[i.verdict]; return row(m[0], m[1], i.claim + ' (' + m[2] + ')', i.note); }).join('') : ''}
    ${result.structure.length ? head('Your structure') + result.structure.map(s => row(s.pass ? '✓' : '✗', s.pass ? '#3a7d44' : 'var(--oxblood)', s.check, s.note)).join('') : ''}
    ${result.analysis ? head('Analysis') + `<div class="summary-body" style="font-size:14px;line-height:1.65;">${escapeHtml(result.analysis)}</div>` : ''}
    ${result.fixes.length ? head('Fix these first') + `<ol style="margin:0;padding-left:22px;font-size:14px;line-height:1.65;">${result.fixes.map(f => `<li style="margin-bottom:6px;">${escapeHtml(f)}</li>`).join('')}</ol>` : ''}`;
}

/* ---- the modal ---- */
function renderExamPlaybookModal(){
  const courseId = ui.activeCourse;
  const course = state.courses.find(c => c.id === courseId);
  const isTorts = !!(course && /tort/i.test(course.name));
  let tab = 'structures';
  let closed = false;
  let drillState = null;                 // null = setup screen; otherwise { phase: 'writing' | 'graded', ... }
  let timerId = null;
  let lastFocus = 'mixed', lastClock = '0', lastClosed = false;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal wide">
      <div class="modal-head">
        <h2>Exam Playbook</h2>
        <button class="modal-close" id="closePB">&times;</button>
      </div>
      <div class="modal-body">
        ${isTorts ? '' : `<div class="err-box" style="margin-bottom:12px;">This playbook is built from your Torts exam sheet, so the drills assume a Torts course. Open it from Torts for the best results.</div>`}
        <div id="pbTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;"></div>
        <div id="pbPanel"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="closePB2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const tabsEl = document.getElementById('pbTabs');
  const panel = document.getElementById('pbPanel');

  const writing = () => !!(drillState && drillState.phase === 'writing');
  const locked = () => writing() && drillState.closedBook;
  function captureEssay(){
    const el = document.getElementById('pbEssay');
    if(writing() && el && typeof el.value === 'string') drillState.essay = el.value;
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
  function tick(){
    if(closed){ stopTimer(); return; }
    const el = document.getElementById('pbTimer');
    if(!el || !writing()) return;
    const elapsed = Math.floor((Date.now() - drillState.startedAt) / 1000);
    if(drillState.limitSec){
      const rem = drillState.limitSec - elapsed;
      el.textContent = rem >= 0 ? fmtClock(rem) + ' left' : '+' + fmtClock(-rem) + ' over';
      el.style.color = rem < 0 ? 'var(--oxblood)' : '';
    } else {
      el.textContent = fmtClock(elapsed) + ' elapsed';
    }
  }
  function startTimer(){ stopTimer(); timerId = setInterval(tick, 1000); tick(); }
  function close(){
    if(writing()){
      captureEssay();
      if(drillState.essay && drillState.essay.trim() && !confirm('Leave this fact pattern? Your essay will be lost.')) return;
    }
    closed = true; stopTimer(); overlay.remove();
  }
  document.getElementById('closePB').onclick = close;
  document.getElementById('closePB2').onclick = close;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });

  function renderTabs(){
    const defs = [['structures', 'Structures'], ['flow', 'Flow chart'], ['tree', 'Find the path'], ['compare', 'Compare'], ['recall', 'Recall'], ['drill', 'Fact patterns']];
    tabsEl.innerHTML = defs.map(d => {
      const off = locked() && d[0] !== 'drill';
      return `<button class="btn ${tab === d[0] ? '' : 'ghost'}" id="pbTab_${d[0]}" ${off ? 'disabled title="Closed book: locked until you submit"' : ''} style="font-size:11px;padding:6px 7px;">${d[1]}</button>`;
    }).join('');
    defs.forEach(d => {
      const b = document.getElementById('pbTab_' + d[0]);
      if(b) b.onclick = () => go(d[0]);
    });
  }
  function go(next){
    if(locked() && next !== 'drill') return;
    if(tab === 'drill') captureEssay();
    tab = next;
    renderTabs();
    if(tab === 'structures') renderStructures();
    else if(tab === 'flow') renderFlow();
    else if(tab === 'tree') renderTree();
    else if(tab === 'compare') renderCompare();
    else if(tab === 'recall') renderRecall();
    else renderDrill();
  }

  /* ---- tab 1: structures ---- */
  function renderStructures(){
    panel.innerHTML = `
      <div class="help" style="margin-bottom:14px;">Your exam sheet, color-coded the same way as the FIRAC and Essay Formula guides. Every claim gets the General Essay Skeleton; the sections below show the specific structure to use for each one. When you can write all of this from a blank page, move to the Recall drill, then the Fact-pattern drill.</div>
      <div class="section-label">Which structure to use</div>
      <div style="overflow-x:auto;margin-bottom:20px;">
        <table style="border-collapse:collapse;width:100%;font-size:14px;line-height:1.5;">
          <thead><tr><th style="text-align:left;padding:8px 10px;border-bottom:2px solid var(--oxblood);">Claim type</th><th style="text-align:left;padding:8px 10px;border-bottom:2px solid var(--oxblood);">Structure</th></tr></thead>
          <tbody>${EXAM_PLAYBOOK_QUICKREF.map(r => `<tr><td style="padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;">${escapeHtml(r[0])}</td><td style="padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;">${escapeHtml(r[1])}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      ${EXAM_PLAYBOOK.map((e, i) => `
        <details ${i === 0 ? 'open' : ''} style="margin-bottom:12px;border-bottom:1px solid var(--rule);padding-bottom:10px;">
          <summary style="cursor:pointer;font-family:'Libre Caslon Display',serif;font-size:19px;color:var(--oxblood);padding:4px 0;">${escapeHtml(e.title)}${e.when ? ` <span class="mono" style="font-size:11px;color:var(--ink-soft);font-family:inherit;">(${escapeHtml(e.when)})</span>` : ''}</summary>
          <div style="margin-top:10px;">${playbookEntryHtml(e)}</div>
        </details>`).join('')}`;
  }

  /* ---- tab: flow chart (duty -> breach -> cause -> damages) ---- */
  let flowPick = 'flow_general';
  function renderFlow(){
    const prog = getPlaybookProgress(courseId);
    const path = NEGLIGENCE_FLOW.find(p => p.id === flowPick) || NEGLIGENCE_FLOW[0];
    const chipsFor = (group) => NEGLIGENCE_FLOW.filter(p => p.group === group).map(p => `<button class="btn ${p.id === path.id ? '' : 'ghost'} pbFlowPick" data-id="${p.id}" style="font-size:12.5px;padding:7px 12px;">${escapeHtml(p.short)}</button>`).join('');
    const pr = prog[path.id];
    const status = !pr ? 'not quizzed yet' : ('Box ' + pr.box + ' of 5 · ' + (isPlaybookDue(prog, path.id) ? 'due now' : 'next ' + pr.nextReview));
    const dueIds = NEGLIGENCE_FLOW.filter(p => isPlaybookDue(prog, p.id)).map(p => p.id);
    const heads = ['Duty', 'Breach', 'Cause', 'Damages'];
    panel.innerHTML = `
      <div class="help" style="margin-bottom:14px;">The idea: the <b>trigger</b> in the facts picks the <b>type of duty</b>, the type of duty decides the <b>type of breach</b>, which decides how <b>cause</b> is analyzed, which decides what <b>damages</b> follow. Pick a duty type and follow it down. This is built from your exam sheet plus standard first-year doctrine; where your professor framed it differently, go with your professor.</div>
      <div class="section-label">From your exam sheet</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${chipsFor('sheet')}</div>
      <div class="section-label">Other duty types (only if your class covered them)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${chipsFor('other')}</div>
      <div class="section-label">Premises: the visitor's status sets the duty (only if your class covered it)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">${chipsFor('premises')}</div>
      <div style="font-family:'Libre Caslon Display',serif;font-size:20px;color:var(--oxblood);margin:16px 0 8px;">${escapeHtml(path.title)}</div>
      ${flowPathHtml(path)}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;">
        <button class="btn" id="pbFlowQuizOne">Quiz me on this path</button>
        <button class="btn ghost" id="pbFlowQuizDue" ${dueIds.length ? '' : 'disabled'}>Quiz me on all due (${dueIds.length})</button>
        ${path.compareId ? '<button class="btn ghost" id="pbFlowCompare">Compare side by side</button>' : ''}
        <button class="btn ghost" id="pbFlowFind">Not sure which path? Walk the tree</button>
      </div>
      <div class="mono" style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;">This path: ${escapeHtml(status)}</div>
      <details style="margin-top:22px;">
        <summary style="cursor:pointer;font-family:'Libre Caslon Display',serif;font-size:18px;color:var(--oxblood);">All paths at a glance: trigger, duty, breach, cause, damages</summary>
        <div style="overflow-x:auto;margin-top:10px;">
          <table style="border-collapse:collapse;width:100%;min-width:820px;font-size:13px;line-height:1.5;">
            <thead><tr><th style="text-align:left;padding:8px 8px;border-bottom:2px solid var(--oxblood);">Duty type</th><th style="text-align:left;padding:8px 8px;border-bottom:2px dashed var(--ink-soft);color:var(--ink-soft);">Trigger</th>${heads.map((h, i) => `<th style="text-align:left;padding:8px 8px;border-bottom:2px solid ${FLOW_COLORS[i]};color:${FLOW_COLORS[i]};">${h}</th>`).join('')}</tr></thead>
            <tbody>${NEGLIGENCE_FLOW.map(p => `<tr><td style="padding:8px;border-bottom:1px solid var(--rule);vertical-align:top;font-weight:600;">${escapeHtml(p.short)}</td><td style="padding:8px;border-bottom:1px solid var(--rule);vertical-align:top;font-style:italic;">${escapeHtml(p.trigger.short)}</td>${p.glance.map(g => `<td style="padding:8px;border-bottom:1px solid var(--rule);vertical-align:top;">${escapeHtml(g)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>
      </details>`;
    panel.querySelectorAll('.pbFlowPick').forEach(b => { b.onclick = () => { flowPick = b.dataset.id; renderFlow(); }; });
    document.getElementById('pbFlowQuizOne').onclick = () => startRecall([path.id], renderFlow);
    document.getElementById('pbFlowQuizDue').onclick = () => startRecall(dueIds, renderFlow);
    document.getElementById('pbFlowFind').onclick = () => go('tree');
    const cmpBtn = document.getElementById('pbFlowCompare');
    if(cmpBtn) cmpBtn.onclick = () => { comparePick = path.compareId; go('compare'); };
  }


  /* ---- tab: find the path (if A then B then C decision tree) ---- */
  let treeTrail = [];
  function renderTree(){
    const cur = treeNext(treeTrail);
    // rebuild the answered steps for the trail display
    let id = TREE_START;
    const steps = treeTrail.map(idx => { const n = TREE_NODES[id]; const o = n.opts[idx]; const step = { q: n.q, a: o.label, why: o.why }; id = o.next; return step; });
    const trailHtml = steps.length ? `<div class="tree-trail">${steps.map(st => `<div class="tree-step"><div class="q">${escapeHtml(st.q)}</div><div class="a">&rarr; ${escapeHtml(st.a)}</div><div class="why">${escapeHtml(st.why)}</div></div>`).join('')}</div>` : '';
    let body;
    if(cur.leaf){
      const path = NEGLIGENCE_FLOW.find(p => p.id === cur.leaf);
      body = `
        <div style="font-family:'Libre Caslon Display',serif;font-size:20px;color:var(--oxblood);margin:14px 0 8px;">Your path: ${escapeHtml(path.title)}</div>
        ${flowPathHtml(path)}
        <div style="font-size:13.5px;line-height:1.6;font-style:italic;color:var(--ink-soft);margin-top:12px;">${escapeHtml(TREE_LAYER_ON)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;">
          <button class="btn" id="pbTreeQuiz">Quiz me on this path</button>
          ${path.compareId ? '<button class="btn ghost" id="pbTreeCompare">Compare side by side</button>' : ''}
          <button class="btn ghost" id="pbTreeBack">Back one step</button>
          <button class="btn ghost" id="pbTreeReset">Start over</button>
        </div>`;
    } else {
      const n = TREE_NODES[cur.node];
      body = `
        <div style="font-family:'Libre Caslon Display',serif;font-size:19px;color:var(--oxblood);margin:12px 0 10px;line-height:1.35;">${escapeHtml(n.q)}</div>
        ${n.opts.map((o, i) => `<button class="tree-opt pbTreeOpt" data-idx="${i}"><b>${escapeHtml(o.label)}</b><span>${escapeHtml(o.why)}</span></button>`).join('')}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
          ${treeTrail.length ? '<button class="btn ghost" id="pbTreeBack">Back one step</button><button class="btn ghost" id="pbTreeReset">Start over</button>' : ''}
        </div>`;
    }
    panel.innerHTML = `
      <div class="help" style="margin-bottom:12px;">Answer a few questions about the facts. Each choice tells you why that branch exists, and the end of the tree is the full duty &rarr; breach &rarr; cause &rarr; damages path. Built from your exam sheet plus standard first-year doctrine; where your professor framed it differently, go with your professor.</div>
      ${trailHtml}${body}
      <details style="margin-top:22px;">
        <summary style="cursor:pointer;font-family:'Libre Caslon Display',serif;font-size:18px;color:var(--oxblood);">See the whole tree at once</summary>
        <div class="tree-full" style="margin-top:10px;"><div><b>Start: ${escapeHtml(TREE_NODES[TREE_START].q)}</b></div>${treeWholeHtml(TREE_START, {})}</div>
      </details>`;
    panel.querySelectorAll('.pbTreeOpt').forEach(b => { b.onclick = () => { treeTrail.push(parseInt(b.dataset.idx, 10)); renderTree(); }; });
    const back = document.getElementById('pbTreeBack'); if(back) back.onclick = () => { treeTrail.pop(); renderTree(); };
    const reset = document.getElementById('pbTreeReset'); if(reset) reset.onclick = () => { treeTrail = []; renderTree(); };
    const quiz = document.getElementById('pbTreeQuiz'); if(quiz) quiz.onclick = () => startRecall([cur.leaf], renderTree);
    const cmpB = document.getElementById('pbTreeCompare');
    if(cmpB) cmpB.onclick = () => { comparePick = NEGLIGENCE_FLOW.find(p => p.id === cur.leaf).compareId; go('compare'); };
  }

  /* ---- tab: compare (look-alike doctrines side by side) ---- */
  let comparePick = 'per_se_vs_res_ipsa';
  let compareCover = false;
  let compareShown = {};
  function renderCompare(){
    const c = comparisonById(comparePick) || COMPARISONS[0];
    const chips = COMPARISONS.map(x => `<button class="btn ${x.id === c.id ? '' : 'ghost'} pbCmpPick" data-id="${x.id}" style="font-size:12.5px;padding:7px 12px;">${escapeHtml(x.short)}</button>`).join('');
    const cell = (side, r, i) => {
      const key = i + side;
      const who = '<span class="cmp-who">' + escapeHtml(c[side].name) + '</span>';
      if(compareCover && !compareShown[c.id + key]) return `<button class="cmp-cell ${side} pbCell" data-key="${key}">${who}Tap to reveal</button>`;
      return `<div class="cmp-cell ${side}">${who}${escapeHtml(r[side])}${r.flag && side === 'b' ? `<span class="cmp-flag">${escapeHtml(r.flag)}</span>` : ''}</div>`;
    };
    panel.innerHTML = `
      <div class="help" style="margin-bottom:14px;">Look-alike doctrines, side by side. Pick a pair, read across each row, then turn on "Cover the answers" and try to say each cell before you tap it. Built from your exam sheet plus standard first-year doctrine; where your professor framed it differently, go with your professor.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${chips}</div>
      <div style="font-family:'Libre Caslon Display',serif;font-size:20px;color:var(--oxblood);margin-bottom:6px;">${escapeHtml(c.title)}</div>
      <div style="font-size:14.5px;line-height:1.6;margin-bottom:6px;"><b>The difference:</b> ${escapeHtml(c.difference)}</div>
      <div style="font-size:14px;line-height:1.6;font-style:italic;color:var(--ink-soft);margin-bottom:12px;"><b style="font-style:normal;">Ask yourself:</b> ${escapeHtml(c.ask)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button class="btn ${compareCover ? '' : 'ghost'}" id="pbCmpCover">${compareCover ? 'Show all answers' : 'Cover the answers'}</button>
      </div>
      <div class="cmp-head"><div></div><div style="color:#2C4F6E;">${escapeHtml(c.a.name)}<div style="font-weight:400;font-size:12px;color:var(--ink-soft);">${escapeHtml(c.a.sub)}</div></div><div style="color:#2C5F2D;">${escapeHtml(c.b.name)}<div style="font-weight:400;font-size:12px;color:var(--ink-soft);">${escapeHtml(c.b.sub)}</div></div></div>
      ${c.rows.map((r, i) => `<div class="cmp-row"><div class="cmp-label">${escapeHtml(r.label)}</div>${cell('a', r, i)}${cell('b', r, i)}</div>`).join('')}`;
    panel.querySelectorAll('.pbCmpPick').forEach(b => { b.onclick = () => { comparePick = b.dataset.id; compareShown = {}; renderCompare(); }; });
    document.getElementById('pbCmpCover').onclick = () => { compareCover = !compareCover; compareShown = {}; renderCompare(); };
    panel.querySelectorAll('.pbCell').forEach(b => { b.onclick = () => { compareShown[c.id + b.dataset.key] = true; renderCompare(); }; });
  }

  /* ---- tab 2: recall drill ---- */
  function renderRecall(){
    const prog = getPlaybookProgress(courseId);
    const due = EXAM_PLAYBOOK.filter(e => isPlaybookDue(prog, e.id));
    const status = (e) => { const p = prog[e.id]; return !p ? 'New' : ('Box ' + p.box + ' of 5 · ' + (isPlaybookDue(prog, e.id) ? 'due now' : 'next ' + p.nextReview)); };
    panel.innerHTML = `
      <div class="help" style="margin-bottom:14px;">Pick a structure and write it out from a blank page, in order, with what each part means. Then reveal the real one and mark each part you actually had. Be strict: a half-remembered part is a miss. Anything you miss drops back to Box 1 and returns soon; anything you nail comes back on a longer and longer schedule.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <button class="btn" id="pbRecallDue" ${due.length ? '' : 'disabled'}>Study due (${due.length})</button>
        <button class="btn ghost" id="pbRecallAll">Practice all (${EXAM_PLAYBOOK.length})</button>
      </div>
      <div class="section-label">Your structures</div>
      ${EXAM_PLAYBOOK.map(e => `<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;"><span>${escapeHtml(e.title)}</span><span class="mono" style="font-size:10.5px;color:var(--ink-soft);text-align:right;">${escapeHtml(status(e))}</span></div>`).join('')}`;
    document.getElementById('pbRecallDue').onclick = () => startRecall(due.map(e => e.id));
    document.getElementById('pbRecallAll').onclick = () => startRecall(EXAM_PLAYBOOK.map(e => e.id));
  }
  function startRecall(ids, back){
    if(!ids.length) return;
    back = back || renderRecall;
    const queue = ids.slice();
    for(let i = queue.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = queue[i]; queue[i] = queue[j]; queue[j] = t; }
    const retried = new Set();
    let right = 0, total = 0;
    tabsEl.style.display = 'none';

    const finish = async () => {
      panel.innerHTML = `
        <div class="summary-body" style="padding:14px;background:var(--paper);"><b>Session done.</b> ${right} of ${total} fully recalled on the first try.${right < total ? ' The ones you missed are back in Box 1 and will come around again soon.' : ''}</div>
        <button class="btn" id="pbRecallBack" style="margin-top:12px;">Back</button>`;
      document.getElementById('pbRecallBack').onclick = () => { tabsEl.style.display = 'flex'; back(); };
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
    };
    function next(){
      if(!queue.length){ finish(); return; }
      const nextId = queue.shift();
      const entry = recallEntryById(nextId);
      if(!entry){ next(); return; }
      const isRetry = retried.has(entry.id);
      panel.innerHTML = `
        <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">${queue.length} more after this${isRetry ? ' · second try' : ''}</div>
        <div style="font-family:'Libre Caslon Display',serif;font-size:20px;color:var(--oxblood);margin-bottom:4px;">${escapeHtml(entry.title)}</div>
        ${entry.when ? `<div class="help" style="margin-bottom:10px;">${escapeHtml(entry.when)}</div>` : ''}
        <textarea id="pbRecallInput" rows="9" placeholder="${entry.kind === 'flow' ? 'Starting from this duty, write what breach standard, what cause analysis, and what damages follow. Do not peek.' : 'Write the structure out the way you would write it on the exam: in order, with what each part means. Do not peek.'}"></textarea>
        <button class="btn" id="pbReveal" style="margin-top:10px;">Reveal and check myself</button>`;
      document.getElementById('pbReveal').onclick = () => reveal(entry, isRetry);
    }

/* ============ CONTRAST CARDS (look-alike doctrine pairs) ============ */
// Each card is a PAIR of look-alike doctrines/terms (e.g. negligence per se vs. res ipsa loquitur)
// plus short unlabeled fact patterns, each belonging to exactly one side. Studying = reading a
// fact pattern and choosing which doctrine it triggers — practicing the discrimination itself,
// which is the exam skill, rather than recalling either definition in isolation. Scheduling
// reuses the same 5-box Leitner intervals as every other deck, stored per pair on the card.
function contrastPairKey(nameA, nameB){
  return [nameA, nameB].map(s => (s||'').trim().toLowerCase()).sort().join(' || ');
}
function getContrastCards(courseId){
  return (((state.courseDocs || {})[courseId] || {}).contrastCards) || [];
}
function saveContrastCards(courseId, cards){
  state.courseDocs = state.courseDocs || {};
  state.courseDocs[courseId] = { ...(state.courseDocs[courseId] || {}), contrastCards: cards, updatedAt: Date.now() };
  saveState(['courseDocs']);
}
function isContrastCardDue(card){
  return !card.nextReview || card.nextReview <= todayStr();
}
function recordContrastAnswer(courseId, cardId, gotIt){
  // Same rules as recordTermAnswer: a miss resets to box 1 immediately, but a box only
  // advances once per calendar day so same-session drilling can't rocket a pair to "mastered".
  const cards = getContrastCards(courseId).map(c => ({ ...c }));
  const card = cards.find(c => c.id === cardId);
  if(!card) return;
  const today = todayStr();
  const advancedToday = card.lastAdvanceDate === today;
  let box;
  if(!gotIt) box = 1;
  else if(advancedToday) box = card.box || 1;
  else box = Math.min((card.box || 0) + 1, 5);
  card.box = box;
  card.nextReview = addDays(today, LEITNER_INTERVALS[box - 1]);
  card.lastReviewed = Date.now();
  card.lastAdvanceDate = (gotIt && !advancedToday) ? today : (card.lastAdvanceDate || null);
  card.reviewCount = (card.reviewCount || 0) + 1;
  saveContrastCards(courseId, cards);
}

function normalizeContrastPairs(rawPairs, existingCards){
  const seen = new Set(existingCards.map(c => contrastPairKey(c.a.name, c.b.name)));
  const out = [];
  (Array.isArray(rawPairs) ? rawPairs : []).forEach((p, i) => {
    if(!p || !p.a || !p.b || !p.a.name || !p.b.name || !p.keyDifference) return;
    const scenarios = (Array.isArray(p.scenarios) ? p.scenarios : [])
      .filter(s => s && s.text && (s.answer === 'a' || s.answer === 'b') && s.why);
    // A pair needs at least one scenario for each side, or the quiz would always have the same answer.
    if(!scenarios.some(s => s.answer === 'a') || !scenarios.some(s => s.answer === 'b')) return;
    const key = contrastPairKey(p.a.name, p.b.name);
    if(seen.has(key)) return;
    seen.add(key);
    const side = (x) => ({ name: String(x.name).trim(), definition: String(x.definition || '').trim(), trigger: String(x.trigger || '').trim() });
    out.push({
      id: 'cc_' + Date.now().toString(36) + '_' + i + Math.floor(Math.random() * 1000).toString(36),
      a: side(p.a),
      b: side(p.b),
      sharedGround: String(p.sharedGround || '').trim(),
      keyDifference: String(p.keyDifference).trim(),
      scenarios: scenarios.map(s => ({ text: String(s.text).trim(), answer: s.answer, why: String(s.why).trim() })),
      box: 0,
      nextReview: null,
      lastReviewed: null,
      lastAdvanceDate: null,
      reviewCount: 0,
      createdAt: Date.now(),
    });
  });
  return out;
}

async function generateContrastCards(courseName, material, termNames, existingCards, apiKey, onProgress){
  const have = existingCards.map(c => `- ${c.a.name} vs. ${c.b.name}`).join('\n') || '(none yet)';
  const prompt = `You are helping a law student in "${courseName}" learn to tell apart doctrines and terms they are likely to confuse. Using ONLY the class material below, find up to 8 PAIRS of look-alike doctrines, rules, or terms that both appear in the material and that students commonly mix up — for example, two doctrines that both help establish the same element without proving specific conduct, two defenses with similar names, or two terms that sound alike but apply to different situations.

Quality bar: only pair things that genuinely resemble each other on the surface AND can be separated by a clear test the class material actually supports. Do not invent doctrines or distinctions the material doesn't reflect. If fewer than 8 good pairs exist, return fewer — never pad. Skip any pair already listed here:
${have}

TERMS ALREADY IN THE STUDENT'S DICTIONARY (useful for spotting candidates, not a required list):
${termNames.slice(0, 300).join('; ') || '(none)'}

CLASS MATERIAL:
${material || '(none available yet)'}

For each pair return:
- a and b, each with: "name", "definition" (one plain sentence), "trigger" (the kind of facts that should make a student think of this one)
- "sharedGround": one sentence on what they have in common — why students confuse them
- "keyDifference": one or two sentences stating the single test or feature that separates them
- "scenarios": exactly 3 short fact patterns (2-3 sentences each). A scenario must NOT name either doctrine or lean on its distinctive vocabulary — the student has to recognize it from the facts. At least one scenario must belong to each side. Each has "text", "answer" ("a" or "b"), and "why" (one or two sentences pointing to the specific fact that decides it).

Return ONLY a JSON object, no markdown fences, no commentary:
{ "pairs": [ { "a": {"name":"","definition":"","trigger":""}, "b": {"name":"","definition":"","trigger":""}, "sharedGround": "", "keyDifference": "", "scenarios": [ {"text":"","answer":"a","why":""} ] } ] }
If no genuinely confusable pairs exist in the material, return { "pairs": [] }.`;

  const raw = await fetchClaudeStreamWithProgress({
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 64000,
    temperature: 0.3,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 9000, onProgress);
  const parsed = JSON.parse(extractJSON(raw));
  return normalizeContrastPairs(parsed.pairs, existingCards);
}
