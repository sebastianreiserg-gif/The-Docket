            ${renderNotes(notesFor(p.part))}
          </div>
        `).join('')}

        <div class="help" style="margin-bottom:22px;padding:12px 14px;background:var(--paper);border-left:2px solid var(--oxblood);">The one-line test for whether your synthesis is done: could you apply your synthesized rule to a brand-new, fourth fact pattern and correctly predict how a court would likely rule, without needing to reread any of the three cases? If yes, the synthesis is complete.</div>

        <div style="font-family:'Libre Caslon Display',serif;font-size:18px;color:var(--oxblood);border-bottom:2px solid var(--oxblood);padding-bottom:4px;margin-bottom:10px;display:inline-block;">Practice</div>
        <div class="help" style="margin-bottom:10px;">Uses cases you've already briefed for this course when there are enough of them to work with — otherwise, a short fictional exercise built for practicing the method itself.</div>
        <button class="btn" id="genSynthesisBtn">Start an exercise</button>
        <div id="synthesisArea" style="margin-top:16px;"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="closeRS2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closeRS').onclick = close;
  document.getElementById('closeRS2').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  document.getElementById('genSynthesisNotesBtn').onclick = async () => {
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    const btn = document.getElementById('genSynthesisNotesBtn');
    btn.disabled = true; btn.textContent = 'Searching...';
    const hideBar = showInlineBar(btn);
    try{
      const context = buildCourseSynthesisContext(ui.activeCourse);
      const sectionNames = RULE_SYNTHESIS_GUIDE.map(p => p.part);
      const result = await generateProfessorAnnotations(course?course.name:'', context, 'rule synthesis — combining multiple cases into one rule statement', sectionNames, state.settings.anthropicKey);
      hideBar();
      state.courseDocs[ui.activeCourse] = {
        ...(state.courseDocs[ui.activeCourse]||{}),
        synthesisNotes: { ...result, generatedAt: Date.now() },
        updatedAt: Date.now()
      };
      saveState(['courseDocs']);
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      close();
      renderRuleSynthesisModal();
    }catch(e){
      hideBar();
      alert('Could not search for professor notes: ' + e.message);
      btn.disabled = false; btn.textContent = saved ? 'Regenerate professor notes' : 'Find professor\'s synthesis notes';
    }
  };

  const genBtn = document.getElementById('genSynthesisBtn');
  genBtn.onclick = async () => {
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    const area = document.getElementById('synthesisArea');
    genBtn.disabled = true; genBtn.textContent = 'Generating...';
    const { update, cleanup } = showDeterminateBar(genBtn);
    try{
      const context = buildRuleSynthesisContext(ui.activeCourse);
      const exercise = await generateRuleSynthesisExercise(course?course.name:'', context, state.settings.anthropicKey, update);
      cleanup();
      genBtn.disabled = false; genBtn.textContent = 'Start another exercise';
      if(!exercise.usableCases){
        area.innerHTML = `<div class="help">None of your briefed cases for this course genuinely share a common issue yet — brief a few more from related cases, or try again for a fictional exercise instead.</div>`;
        return;
      }
      area.innerHTML = `
        <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;">${exercise.isReal ? 'From your own briefed cases' : 'Fictional practice exercise'}</div>
        ${exercise.caseSummaries.map(c => `
          <div class="summary-body" style="margin-bottom:10px;padding:10px 12px;background:var(--paper);border-left:2px solid var(--brass);">
            <b>${escapeHtml(c.name)}</b> — ${escapeHtml(c.summary)}
          </div>
        `).join('')}
        <label style="margin-top:10px;">Your synthesized rule statement</label>
        <textarea id="synthesisInput" rows="4" placeholder="Write a rule statement that accounts for all of the cases above..."></textarea>
        <div id="synthesisError"></div>
        <button class="btn" id="getSynthesisFeedback" style="margin-top:10px;">Get feedback</button>
        <div id="synthesisFeedbackArea" style="margin-top:14px;"></div>
      `;
      document.getElementById('getSynthesisFeedback').onclick = async () => {
        const studentAnswer = document.getElementById('synthesisInput').value.trim();
        const errEl = document.getElementById('synthesisError');
        if(!studentAnswer){ errEl.innerHTML = `<div class="err-box">Write your synthesis first.</div>`; return; }
        errEl.innerHTML = '';
        const fbBtn = document.getElementById('getSynthesisFeedback');
        fbBtn.disabled = true; fbBtn.textContent = 'Grading...';
        const bar2 = showInlineBar(fbBtn);
        try{
          const feedback = await gradeRuleSynthesis(exercise.caseSummaries, exercise.modelSynthesis, studentAnswer, state.settings.anthropicKey);
          bar2();
          document.getElementById('synthesisFeedbackArea').innerHTML = `
            <div class="section-label">Feedback</div>
            <div class="summary-body">${escapeHtml(feedback)}</div>
          `;
          fbBtn.style.display = 'none';
        }catch(e){
          bar2();
          errEl.innerHTML = `<div class="err-box">${escapeHtml(e.message)}</div>`;
          fbBtn.disabled = false; fbBtn.textContent = 'Get feedback';
        }
      };
    }catch(e){
      cleanup();
      alert('Could not generate an exercise: ' + e.message);
      genBtn.disabled = false; genBtn.textContent = 'Start an exercise';
    }
  };
}

/* ============ FIHRR CASE ILLUSTRATION & OFFICE MEMO GUIDE ============ */
// Deconstructed from the Legal Research & Writing materials: the professor's FIHRR case-illustration sample
// (case description: Facts, Issue, Holding, Rule, Reasoning, then an Application that compares the case to the client's facts)
// and her full objective memo sample (Questions Presented through Conclusion, with CREAC-style point sections).
// Same look and color system as the FIRAC guide. All worked examples use INVENTED practice facts (Reyes v. Calloway's, Martha and Cindy),
// so the guide teaches the formula without reproducing the professor's samples or any assignment. Real authority is limited to
// Restatement (Second) of Torts section 42. In your own work, cite real, verified authority.
const FIHRR_GUIDE = [
  {
    part: 'Fact',
    template: `In [A: case name], [B: who did or suffered what]. [C: The key facts bearing on the disputed element, including the fact that cuts the other way.]`,
    checks: [
      { l: 'A', q: `Does the sentence open with the case name, so the reader knows which case this is?` },
      { l: 'B', q: `Is it one plain sentence of what happened, with no legal conclusions?` },
      { l: 'C', q: `Are these the facts the court relied on for the disputed element, including the one that complicates it ("was not present, but...")?` },
    ],
    note: `Only the facts that matter to the element you are about to apply. If a fact will not show up in your comparison later, cut it.`,
    example: `In [A: Reyes], [B: a store manager locked a stockroom door as a joke while Reyes, an employee, was asleep inside]. [C: The manager unlocked the door ten minutes later, and Reyes never woke or knew of the lock until a coworker told her afterward. She was not physically harmed.]`,
  },
  {
    part: 'Issue',
    template: `[A: The plaintiff] brought a claim for [B: the claim], and the issue was whether [C: the requirement] could be met even though [D: the troublesome fact].`,
    checks: [
      { l: 'A', q: `Is it the party who brought the claim?` },
      { l: 'B', q: `Is it the claim by name?` },
      { l: 'C', q: `Is it the specific requirement or element, not the whole claim?` },
      { l: 'D', q: `Does "even though" name the fact that makes it a real question?` },
    ],
    note: `One issue per case illustration. It is the same question you will answer about your client, so keep the words close.`,
    example: `[A: Reyes] brought a claim for [B: false imprisonment], and the issue was whether [C: she could satisfy the confinement requirement] even though [D: she was unaware of the lock while it was engaged].`,
  },
  {
    part: 'Holding',
    template: `The court held that [A: the party] [B: did or did not satisfy the element] because [C: the short reason tied to the key fact].`,
    checks: [
      { l: 'A', q: `Is it the party the ruling is about?` },
      { l: 'B', q: `Does it answer the Issue directly, yes or no, in the Issue's own words?` },
      { l: 'C', q: `Is the "because" the one fact that decided it, in a few words?` },
    ],
    note: `Just the result and a short reason. The longer explanation comes in the Reasoning, so do not do both jobs here.`,
    example: `The court held that [A: Reyes] [B: could not recover] because [C: she was unaware of the confinement and was not harmed by it].`,
  },
  {
    part: 'Rule',
    template: `Relying on [A: the precedent or authority], the court explained that [B: the general rule], [C: including the factors or considerations it uses].`,
    checks: [
      { l: 'A', q: `Does it name the authority the court relied on, so the reader sees where the rule comes from?` },
      { l: 'B', q: `Is the rule stated generally, with none of this case's facts attached?` },
      { l: 'C', q: `Did you include the factors or limits the court listed, since those are what you will compare against later?` },
    ],
    note: `The rule is the part you carry to the next case. The sample puts the Rule sentence before the Reasoning sentence.`,
    example: `Relying on [A: section 42 of the Restatement (Second) of Torts], the court explained that [B: a person is not liable for false imprisonment unless the person confined is conscious of the confinement or harmed by it], [C: so what matters is whether the plaintiff actually knew of the confinement, not whether the defendant meant to confine her].`,
  },
  {
    part: 'Reasoning',
    template: `The court reasoned that [A: the key fact] [B: did or did not meet the rule], since [C: the reason]. Thus, [D: the element] [E: was or was not met].`,
    checks: [
      { l: 'A', q: `Is it the single key fact the court applied the rule to?` },
      { l: 'B', q: `Does it say whether that fact met the rule, in the rule's own words?` },
      { l: 'C', q: `Does "since" give the court's reason, not a repeat of the fact?` },
      { l: 'D', q: `Does "Thus" return to the element named in the Issue?` },
      { l: 'E', q: `Does it say met or not met, matching the Holding?` },
    ],
    note: `Fact, rule, because, so. This is the same move you will make for your own client in the Application.`,
    example: `The court reasoned that [A: Reyes sleeping through the entire ten minutes] [B: did not meet the awareness requirement], since [C: a person who never knows she is confined has lost no freedom she could feel]. Thus, [D: the confinement requirement] [E: was not met].`,
  },
  {
    part: 'Application: prediction and analogy',
    template: `[A: Your client] likely [B: satisfies or fails] [C: the element]. Like [D: the case party], [E: the client's matching fact].`,
    checks: [
      { l: 'A', q: `Does it start with your client by name?` },
      { l: 'B', q: `Did you commit to a prediction ("likely satisfies" or "likely fails"), not just describe?` },
      { l: 'C', q: `Does it name the exact element from the Issue?` },
      { l: 'D', q: `Does "Like" point to the case party, so the comparison is visible?` },
      { l: 'E', q: `Is the client fact specific, drawn from your Statement of Facts, and the one that matches the case's key fact?` },
    ],
    note: `Compare the fact the court relied on, not every fact. Facts similar to the case lead to the same result as the case. Facts different in a way that matters lead to the opposite result.`,
    example: `[A: Martha] likely [B: fails] [C: the awareness requirement]. Like [D: Reyes], [E: Martha did not know the bathroom door was locked while it was locked. She never tried the door during the five minutes and learned of the lock only when Cindy told her afterward].`,
  },
  {
    part: 'Application: compare back',
    template: `[A: These facts closely resemble or differ from the case], where [B: the case's key fact]. [C: A difference] does not change the result, because [D: it does not touch the fact the court relied on]. [E: Prediction restated.]`,
    checks: [
      { l: 'A', q: `Does it say resemble or differ, honestly?` },
      { l: 'B', q: `Does "where" restate the case's key fact, so the reader sees the match?` },
      { l: 'C', q: `Did you name the difference you noticed, instead of hoping the reader will not?` },
      { l: 'D', q: `Does "because" explain why the difference does or does not matter?` },
      { l: 'E', q: `Is the prediction restated in a short sentence?` },
    ],
    note: `If a difference does touch the fact the court relied on, flip it: say it changes the result, and explain why.`,
    example: `[A: These facts closely resemble Reyes], where [B: the plaintiff also learned of the lock only after it had been undone]. [C: Martha was awake, unlike Reyes, but that] does not change the result, because [D: the court relied on awareness of the confinement, not on whether the plaintiff was conscious]. [E: Martha therefore likely cannot show the confinement requirement was met.]`,
  },
  {
    part: 'Application: the counter-fact',
    template: `Although [A: a fact that cuts against your prediction], [B: the prediction still holds] because [C: the reason]. Unlike [D: the contrary scenario], [E: your client's actual facts].`,
    checks: [
      { l: 'A', q: `Did you name the strongest fact against your prediction?` },
      { l: 'B', q: `Does the sentence say the prediction still holds?` },
      { l: 'C', q: `Does "because" give a reason, not just a denial?` },
      { l: 'D', q: `Does "Unlike" paint the scenario where the other result would be right?` },
      { l: 'E', q: `Does it return to the client's actual facts?` },
    ],
    note: `This is the move that makes the analysis feel fair. It is optional when your word limit is tight, but it is usually what separates a good illustration from a great one.`,
    example: `Although [A: Cindy locked the door deliberately], [B: Martha's claim still likely fails] because [C: Cindy's intent goes to a different requirement than awareness]. Unlike [D: a person who hears the lock click and tries the handle], [E: Martha never tried the door and had no reason to think she could not leave].`,
  },
];
const FIHRR_SHAPE = [
  { para: 'Paragraph 1: the case description, part one', parts: 'Fact, then Issue', detail: `Two sentences of facts, then the claim and the "whether ... even though" question.` },
  { para: 'Paragraph 2: the case description, part two', parts: 'Holding, then Rule, then Reasoning', detail: `The result with a short because, the general rule with its authority, then the reasoning that ends with "Thus."` },
  { para: 'Paragraph 3: the application, part one', parts: 'Prediction and analogy, then compare back', detail: `Your prediction, "Like" the case party, then "These facts closely resemble" or "differ."` },
  { para: 'Paragraph 4: the application, part two', parts: 'Counter-fact, then close', detail: `"Although ... because ...", the "Unlike" contrast, and the return to your client.` },
];

// Rebuilt from the Legal Research & Writing objective-memo lessons (Caption, QP, Brief Answer, Statement of Facts,
// Discussion with Roadmap and CREAC segments, Conclusion, and organizing CREACs around sub-rules) plus the full sample memo.
// All worked examples use INVENTED practice facts (Martha Lane and Cindy Pratt; the practice case Reyes v. Calloway's).
// Real authority is limited to Restatement (Second) of Torts sections 35 and 42; verify before relying on them.
const refCard = (title, bodyHtml) => `<details style="margin:0 0 12px;border:1px solid var(--rule);background:var(--paper);"><summary style="cursor:pointer;padding:8px 12px;font-size:13.5px;color:var(--oxblood);font-weight:600;">Reference: ${escapeHtml(title)}</summary><div style="padding:4px 14px 12px;">${bodyHtml}</div></details>`;
const refList = (items) => `<ul style="margin:0;padding-left:20px;">${items.map(i => `<li style="margin-bottom:6px;line-height:1.55;font-size:14px;">${i}</li>`).join('')}</ul>`;
const MEMO_RULE_KINDS_HTML = refCard('First, know what kind of rule governs your issue', `
  <div style="font-size:14px;line-height:1.55;margin-bottom:8px;">How you organize the Discussion depends on the source and kind of the broad governing rule. Some analyses mix kinds. Organize around <b>rules</b>, not around <b>cases</b>.</div>
  ${refList([
    `<b>Statute with elements.</b> Your narrow issues are how the elements apply to your facts.`,
    `<b>Court opinion with elements.</b> Same approach, with the elements coming from case law (the elements of negligence, say).`,
    `<b>Common-law rule from a series of opinions.</b> Your narrow issues are how one or more components of the rule apply (respondeat superior: was the person negligent, and were they acting within the scope of employment?).`,
    `<b>Factors.</b> Your narrow issues are the factors in question on your facts, and how they weigh (whether a worker is an employee or an independent contractor turns on control factors).`,
  ])}`);
const MEMO_SOF_REF_HTML = refCard('Statement of Facts: what to include, how to organize it, what to avoid', `
  <div style="font-size:13px;font-weight:700;margin:2px 0 4px;">What every Statement of Facts includes</div>
  ${refList([
    `The <b>parties and players</b> by full name with a title or descriptor ("our client, Plaintiff Susan Keith, a former employee"), not just "plaintiff" and "defendant."`,
    `The <b>dates</b> of the events, if you know them.`,
    `<b>Every key fact that appears in your Discussion</b>, favorable or unfavorable. A reader should never meet a fact for the first time in the Discussion, and no fact should appear in the Statement that the Discussion never uses.`,
    `<b>Background facts</b> that give context and tie the key facts into a narrative. Do not overdo them, and do not leave gaps.`,
  ])}
  <div style="font-size:13px;font-weight:700;margin:12px 0 4px;">Pick an organization (most use a mix)</div>
  ${refList([
    `<b>Chronological:</b> the story in the order the events unfolded. Most common.`,
    `<b>Topical:</b> one paragraph per topic, useful with several narrow issues or a factor test.`,
    `<b>Perceptual:</b> the same events as seen by different people, useful when versions compete.`,
  ])}
  <div style="font-size:13px;font-weight:700;margin:12px 0 4px;">Open and close</div>
  ${refList([
    `<b>Open</b> by naming the parties, their relationship, the nature of the dispute, and who your client is. No "catchy" opening is needed in an objective memo.`,
    `<b>Close</b> with where the matter stands procedurally, or the assignment itself ("You asked me to assess whether there is a valid basis for...").`,
  ])}
  <div style="font-size:13px;font-weight:700;margin:12px 0 4px;">Pitfalls</div>
  ${refList([
    `<b>Characterizing:</b> "mowed down the plaintiff" becomes "hit the plaintiff with his vehicle."`,
    `<b>A falsely positive story:</b> include the unfavorable key facts too.`,
    `<b>Legal conclusions as facts:</b> "the barn served their daily comfort" belongs in the Discussion, not the facts.`,

  <div style="font-size:13px;font-weight:700;margin:12px 0 4px;">Make it readable</div>

const MEMO_DRAFT_ORDER_HTML = refCard('Drafting order: start with the Discussion', `
  <div style="font-size:14px;line-height:1.6;">Unless your professor says otherwise, draft the <b>Discussion first</b>, then work outward. The Discussion tells you the governing law (the "under" and "does"), the key facts (the "when" and the Statement of Facts), the sub-rules (the Brief Answers), and the next steps (the Conclusion). Outline first, ask your professor to look at the outline if you can, and expect to revise it. The process is recursive, not linear.</div>`);

const MEMO_GUIDE = [
  {
    part: 'Heading',
    template: `MEMORANDUM\nTo: [A: full name and title of the person who asked for the memo]\nFrom: [B: your name and position]\nDate: [C: the date you submit the final memo]\nRe: [D: both parties in full, who our client is, and the file number]\n[E: a short description of the legal issue or issues the memo addresses]`,
    checks: [
      { l: 'A', q: `Is it the full name and title of the person who requested the memo?` },
      { l: 'B', q: `Is it your name and your position?` },

      { l: 'D', q: `Does it name both parties in full, say who the client is, and give the office file number (and the docket number if the case is already in court)?` },
      { l: 'E', q: `Does it describe the subject matter or issue, such as a potential claim, so the file can be found later?` },
    ],
    note: `The Re line needs at least three things: both parties' names, a file number, and a description of the issue. Order and layout vary, so your professor's template, or a go-by memo from the person who asked, controls.`,
    example: `MEMORANDUM\nTo: [A: Supervising Attorney, Senior Partner]\nFrom: [B: Associate Attorney]\nDate: [C: October 20, 2026]\nRe: [D: Martha Lane (potential client) v. Cindy Pratt; Our File No. 00-000]\n[E: Potential false imprisonment claim]`,
  },

    part: 'Questions Presented',

    checks: [
      { l: 'A', q: `The "under": does it name the specific rule (statute, section, or case-law rule), not just "under state law," and say in a few words what it does, using the phrases that pay?` },
      { l: 'B', q: `The "does": is it the one narrow question the Discussion will answer? The verb can be is, can, did, or has. Are the parties named in full, with their relationship, since this is the first time the reader sees them?` },

    example: `1. [A: Under the Restatement (Second) of Torts § 42, which makes a defendant liable for false imprisonment only if the person confined is aware of the confinement or harmed by it,] [B: was Martha Lane, a guest at the home of her friend Cindy Pratt, confined by Cindy] [C: when Cindy locked a bathroom door for five minutes, but Martha never tried the door and learned of the lock only afterward?]`,
  },

    part: 'Questions Presented: statements-question version',

      { l: 'A', q: `Is it the same "under" information, but as its own statement that names the rule and says what it does?` },
      { l: 'B', q: `Is it the same "when" facts, stated neutrally, with the parties named in full?` },
      { l: 'C', q: `Is the question short and ends on the narrow issue? It should read faster than the one-sentence version.` },
    ],
    note: `The alternative: the same information as under-does-when, rearranged as under, when, then does. Draft both and keep whichever reads better, unless your professor requires one.`,
    example: `1. [A: Under the Restatement (Second) of Torts § 42, a defendant is liable for false imprisonment only if the person confined is aware of the confinement or harmed by it.] [B: Cindy Pratt locked a bathroom door for five minutes while her friend Martha Lane was inside, but Martha never tried the door and learned of the lock only afterward.] [C: Was Martha confined by Cindy?]`,

function stripFiracTags(t){ return String(t).replace(/\[([A-E]):\s*([^\]]+)\]/g, '[$2]'); }
function fullTemplateHtml(btnId, title, intro, items){
  return `
    <div style="margin-top:8px;padding-top:18px;border-top:2px solid var(--oxblood);">
      <div style="font-family:'Libre Caslon Display',serif;font-size:20px;color:var(--oxblood);margin-bottom:6px;">${escapeHtml(title)}</div>
      <div class="help" style="margin-bottom:12px;">${escapeHtml(intro)}</div>
      <div class="mono" style="font-size:13px;line-height:1.7;color:var(--ink-soft);background:var(--paper);padding:12px 14px;border-left:2px solid var(--oxblood);">
        ${items.map(i => `<div style="margin-bottom:14px;"><div style="font-size:10.5px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:3px;">${escapeHtml(i.label)}</div><div style="white-space:pre-line;">${i.html}</div></div>`).join('')}
      </div>
      <div style="margin-top:10px;"><button class="btn ghost" id="${btnId}">Copy this template as plain text</button></div>
    </div>`;
}
function wireFullTemplateCopy(btnId, items){
  const b = document.getElementById(btnId);
  if(!b) return;
  b.onclick = () => {
    const text = items.map(i => i.label + '\n' + i.plain).join('\n\n');
    try { navigator.clipboard.writeText(text).then(() => { b.textContent = 'Copied'; }).catch(() => { b.textContent = 'Copy not available here'; }); }
    catch(e){ b.textContent = 'Copy not available here'; }
  };
}

function buildTemplateLibrary(){
  const lib = [];
  const add = (cat, title, from, items, whole) => lib.push({ cat, title, from, items, whole: !!whole });
  // Memo: whole memo first, then each part, grouped by the six components
  const memoItems = memoFullItems();
  const memoPlain = MEMO_SECTIONS.map(sec => {
    const body = sec.parts.filter(x => typeof x === 'string').map(n => { const p = MEMO_GUIDE.find(g => g.part === n); return (sec.parts.filter(x => typeof x === 'string').length > 1 ? '(' + p.part + ')\n' : '') + stripFiracTags(p.template); }).join('\n\n');
    return sec.n + '. ' + sec.title.toUpperCase() + '\n' + body;
  }).join('\n\n');
  const memoHtml = MEMO_SECTIONS.map(sec => `<div style="margin-bottom:12px;"><div style="font-weight:700;color:var(--oxblood);">${sec.n}. ${escapeHtml(sec.title.toUpperCase())}</div>${sec.parts.filter(x => typeof x === 'string').map(n => { const p = MEMO_GUIDE.find(g => g.part === n); return `<div style="margin:4px 0 6px;white-space:pre-line;">${highlightFiracTags(p.template)}</div>`; }).join('')}</div>`).join('');
  lib.push({ cat: 'Memo', title: 'Full objective memo (all six components)', from: 'FIHRR & Memo Guide', items: [{ label: '', html: memoHtml, plain: memoPlain }], whole: true });
  MEMO_SECTIONS.forEach(sec => sec.parts.filter(x => typeof x === 'string').forEach(n => {
    const it = memoItems.find(i => i.label === n);
    lib.push({ cat: 'Memo', title: n, from: sec.n + '. ' + sec.title, items: [it], whole: false });
  }));
  // FIHRR
  const fi = fihrrFullItems();
  lib.push({ cat: 'FIHRR', title: 'Full FIHRR case illustration (four paragraphs)', from: 'FIHRR & Memo Guide', items: fi, whole: true });
  FIHRR_GUIDE.forEach(p => lib.push({ cat: 'FIHRR', title: p.part, from: 'FIHRR & Memo Guide', items: [{ label: '', html: highlightFiracTags(p.template), plain: stripFiracTags(p.template) }], whole: false }));
  // FIRAC
  lib.push({ cat: 'FIRAC', title: 'Full FIRAC', from: 'FIRAC Method', items: firacFullItems(), whole: true });
  FIRAC_GUIDE.forEach(p => lib.push({ cat: 'FIRAC', title: p.part, from: 'FIRAC Method', items: [{ label: '', html: highlightFiracTags(p.template), plain: stripFiracTags(p.template) }], whole: false }));
  // Exam Playbook: one entry per claim, holding a template for each of its subheadings
  EXAM_PLAYBOOK.forEach(e => {
    const segs = PLAYBOOK_ITEM_TEMPLATES[e.id];
    if(!segs) return;
    const items = e.items.map((it, i) => segs[i] ? { label: it.label || ('Part ' + (i + 1)), html: renderTaggedTemplate(segs[i]), plain: playbookItemTemplatePlain(segs[i]) } : null).filter(Boolean);
    if(items.length) lib.push({ cat: 'Playbook', title: e.title, from: 'Exam Playbook', items, whole: false });
  });
  // Essay
  lib.push({ cat: 'Essay', title: 'Full essay', from: 'Essay Writing Formula', items: essayFullItems(), whole: true });
  ESSAY_FORMULA_GUIDE.forEach(p => lib.push({ cat: 'Essay', title: p.part, from: 'Essay Writing Formula', items: [{ label: '', html: renderTaggedTemplate(p.template), plain: p.template.map(x => x.text).join('') }], whole: false }));
  return lib;
}

  const ok = () => { btn.textContent = doneLabel || 'Copied'; setTimeout(() => { btn.textContent = orig; }, 1500); };
  const fail = () => { btn.textContent = 'Copy not available here'; setTimeout(() => { btn.textContent = orig; }, 2000); };
  try { navigator.clipboard.writeText(text).then(ok).catch(fail); } catch(e){ fail(); }
}
function tplTableToText(table, md){
  const rows = [...table.querySelectorAll('tr')].map(tr => [...tr.children].map(c => c.innerText.replace(/\s*\n\s*/g, ' ').trim()));
  if(md){
    const head = rows[0], body = rows.slice(1);
    return ['| ' + head.join(' | ') + ' |', '| ' + head.map(() => '---').join(' | ') + ' |'].concat(body.map(r => '| ' + r.join(' | ') + ' |')).join('\n');
  }
  return rows.map(r => r.join('\t')).join('\n');
}

function renderTermFormModal(courseId, existingTerm, existingDefinition, wasManual, existingUsage, onSaved){
  const isEdit = !!existingTerm;
  let foundContext = null; // { context, foundInLecture } — set by local or AI search below
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>${isEdit ? 'Edit Term' : 'Add Term'}</h2>
        <button class="modal-close" id="closeTF">&times;</button>
      </div>
      <div class="modal-body">
        <label>Term</label>
        <input type="text" id="tfTerm" value="${escapeAttr(existingTerm||'')}" placeholder="e.g. Battery" />
        ${isEdit ? `<div class="help">Renaming carries over the definition, usage, and study progress to the new name.</div>` : ''}
        <label>Definition</label>
        <textarea id="tfDefinition" rows="6" placeholder="Paste your professor's exact wording here if that's what you need to memorize.">${escapeHtml(existingDefinition||'')}</textarea>
        <label>Usage <span style="text-transform:none;">(optional — how it's properly used, e.g. in a sentence or typical phrasing)</span></label>
        <textarea id="tfUsage" rows="2" placeholder="e.g. Used as a noun: 'the defendant committed battery.' Often paired with 'assault and battery.'">${escapeHtml(existingUsage||'')}</textarea>
        ${state.settings.anthropicKey ? `<button class="btn ghost" id="suggestUsageBtn" style="margin-top:8px;font-size:11px;padding:6px 12px;">Suggest usage</button>` : ''}

        ${!isEdit ? `
          <label style="margin-top:20px;">Excerpt from your lectures <span style="text-transform:none;">(optional)</span></label>
          <div id="contextPreview" class="help">Not searched yet.</div>
          <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
            <button class="btn ghost" id="findContextBtn" style="font-size:11px;padding:6px 12px;">Search transcripts</button>
            <button class="btn ghost" id="aiSearchBtn" style="font-size:11px;padding:6px 12px;display:none;">Search with AI (different phrasing)</button>
          </div>
        ` : ''}
        <div id="tfError"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="cancelTF">Cancel</button>
        <button class="btn" id="saveTF">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closeTF').onclick = close;
  document.getElementById('cancelTF').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  const suggestBtn = document.getElementById('suggestUsageBtn');
  if(suggestBtn){
    suggestBtn.onclick = async () => {
      const term = document.getElementById('tfTerm').value.trim();
      const definition = document.getElementById('tfDefinition').value.trim();
      if(!term || !definition){ alert('Fill in the term and definition first.'); return; }
      suggestBtn.disabled = true; suggestBtn.textContent = 'Thinking...';
      try{
        const usage = await generateUsagePattern(term, definition, state.settings.anthropicKey);
        document.getElementById('tfUsage').value = usage;
      }catch(e){
        alert('Could not generate a suggestion: ' + e.message);
      }
      suggestBtn.disabled = false; suggestBtn.textContent = 'Suggest usage';
    };
  }

  const findContextBtn = document.getElementById('findContextBtn');
  if(findContextBtn){
    findContextBtn.onclick = () => {
      const term = document.getElementById('tfTerm').value.trim();
      if(!term){ alert('Type the term first.'); return; }
      const found = findTermContextInTranscripts(courseId, term);
      const previewEl = document.getElementById('contextPreview');
      const aiBtn = document.getElementById('aiSearchBtn');
      if(found){
        foundContext = { context: found.context, foundInLecture: { lectureId: found.lectureId, title: found.lectureTitle, date: found.lectureDate } };
        previewEl.innerHTML = `<b>Found in ${escapeHtml(found.lectureTitle||'Untitled')}:</b><br/>"${escapeHtml(found.context)}"`;
        if(aiBtn) aiBtn.style.display = 'none';
      } else {
        foundContext = null;
        previewEl.textContent = 'No exact wording match found in your transcripts.';
        if(aiBtn) aiBtn.style.display = state.settings.anthropicKey ? 'inline-block' : 'none';
      }
    };
  }
  const aiSearchBtn = document.getElementById('aiSearchBtn');
  if(aiSearchBtn){
    aiSearchBtn.onclick = async () => {
      const term = document.getElementById('tfTerm').value.trim();
      const definition = document.getElementById('tfDefinition').value.trim();
      if(!term || !definition){ alert('Fill in the term and definition first.'); return; }
      aiSearchBtn.disabled = true; aiSearchBtn.textContent = 'Searching...';
      const previewEl = document.getElementById('contextPreview');
      try{
        const result = await searchTranscriptsWithAI(courseId, term, definition, state.settings.anthropicKey);
        if(result.found){
          foundContext = { context: result.context, foundInLecture: result.lecture };
          previewEl.innerHTML = `<b>AI found a match in ${escapeHtml(result.lecture.title||'Untitled')}:</b><br/>"${escapeHtml(result.context)}"`;
        } else {
          foundContext = null;
          previewEl.textContent = "This concept doesn't appear to be discussed in any transcript on hand — you can still add the term with your own definition.";
        }
      }catch(e){
        alert('AI search failed: ' + e.message);
      }
      aiSearchBtn.disabled = false; aiSearchBtn.textContent = 'Search with AI (different phrasing)';
    };
  }

  document.getElementById('saveTF').onclick = async () => {
    const term = document.getElementById('tfTerm').value.trim();
    const definition = document.getElementById('tfDefinition').value.trim();
    const usagePattern = document.getElementById('tfUsage').value.trim();
    const errEl = document.getElementById('tfError');
    if(!term || !definition){ errEl.innerHTML = `<div class="err-box">Both a term and a definition are required.</div>`; return; }
    const isRename = isEdit && existingTerm && term.toLowerCase() !== existingTerm.trim().toLowerCase();
    if(isRename && buildDictionary(courseId).some(d => d.term.toLowerCase() === term.toLowerCase())){
      errEl.innerHTML = `<div class="err-box">"${escapeHtml(term)}" already exists in this course's dictionary.</div>`;
      return;
    }
    const extra = { usagePattern: usagePattern || null };
    if(!isEdit && foundContext){
      extra.context = foundContext.context;
      extra.foundInLecture = foundContext.foundInLecture;
    }
    if(isRename){
      // Carry study progress over to the new key before the old one gets tombstoned.
      const oldKey = customTermKey(courseId, existingTerm);
      const newKey = customTermKey(courseId, term);
      if(state.termProgress[oldKey]) state.termProgress[newKey] = state.termProgress[oldKey];
      saveCustomTerm(courseId, term, definition, true, extra);
      deleteTermEverywhere(courseId, existingTerm);
    } else {
      saveCustomTerm(courseId, term, definition, isEdit ? wasManual : true, extra);
    }
    if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
    close();
    if(onSaved) onSaved();
  };
}

/* ============ CASE LAW INDEX (course-wide) ============ */
function buildCaseLawIndex(courseId){
  const map = {};
  const lectures = state.lectures
    .filter(l => l.courseId === courseId)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  lectures.forEach(l => {
    (l.caseLaw||[]).forEach(c => {
      if(!c.name || !c.name.trim()) return;
      const key = c.name.trim().toLowerCase();
      const existing = map[key];
      const sources = existing ? existing.sources : [];
      // Same principle as the Dictionary: a case revisited in a later lecture often gets
      // fuller treatment, so the newer description/quote wins, falling back to what's
      // already there if the newer mention is thinner.
      map[key] = {
        name: c.name.trim(),
        description: c.description || existing?.description || '',
        citation: c.citation || existing?.citation || null,
        quote: c.quote || existing?.quote || '',
        sources,
      };
      map[key].sources.push({ lectureId: l.id, title: l.title, date: l.date });
    });
  });
  return Object.values(map).map(c => ({
    ...c,
    verified: !!getCaseBrief(courseId, c.name)?.verified,
  })).sort((a,b) => a.name.localeCompare(b.name));
}

function renderStudySessionModal(initialBatch, remainingAfter, allowRequeue, deck, recallModes, direction, blankTarget, whyMode){
  const courseId = ui.activeCourse;
  const pending = initialBatch.slice(); // true queue — shrinks on mastery, never grows
  const totalUnique = pending.length;
  let masteredCount = 0;
  let revealed = false;
  let learnedCount = 0;
  let reviewCorrect = 0;
  let reviewAttempts = 0;
  let streak = 0;
  let bestStreak = 0;
  // Distractors for multiple choice come from real other items in this same session's
  // batch, never invented — kept as a stable reference separate from `pending`, which
  // gets mutated (shifted, requeued) as the session progresses.
  const distractorPool = initialBatch;

  function showWhyInterstitial(card, onDone){
    // Elaborative interrogation: the student writes their own "why" first, and the
    // feedback then engages with what they specifically wrote — assessing whether the
    // reasoning holds up, not requiring it to match a separately-generated reference
    // explanation word for word. Legal rationale has more than one defensible framing,
    // so this is feedback on soundness, not a grade.
    const whyOverlay = document.createElement('div');
    whyOverlay.className = 'overlay';
    whyOverlay.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>Why does this exist?</h2>
          <button class="modal-close" id="closeWhy">&times;</button>
        </div>
        <div class="modal-body">
          <div class="display" style="font-size:18px;margin-bottom:6px;">${escapeHtml(card.term)}</div>
          <div class="help" style="margin-bottom:14px;">Write your own explanation — what is this protecting against, what would go wrong without it? There's no single "correct" answer here; the value is in doing the thinking yourself.</div>
          <textarea id="whyInput" rows="4" placeholder="Write your own explanation here..."></textarea>
          <div id="whyError"></div>
          <div id="whyCompareArea" style="margin-top:14px;"></div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" id="skipWhy">Skip</button>
          <button class="btn" id="compareWhyBtn">Get feedback</button>
        </div>
      </div>
    `;
    document.body.appendChild(whyOverlay);
    const closeWhy = () => { whyOverlay.remove(); onDone(); };
    document.getElementById('closeWhy').onclick = closeWhy;
    document.getElementById('skipWhy').onclick = closeWhy;
    whyOverlay.addEventListener('click', (e)=>{ if(e.target===whyOverlay) closeWhy(); });
    document.getElementById('compareWhyBtn').onclick = async () => {
      const yourAnswer = document.getElementById('whyInput').value.trim();
      const errEl = document.getElementById('whyError');
      if(!yourAnswer){ errEl.innerHTML = `<div class="err-box">Write your own explanation first — that's the actual exercise here.</div>`; return; }
      if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
      errEl.innerHTML = '';
      const btn = document.getElementById('compareWhyBtn');
      btn.disabled = true; btn.textContent = 'Generating...';
      const hideBar = showInlineBar(btn);
      try{
        const feedback = await generateWhyExplanation(card.term, card.definition, yourAnswer, state.settings.anthropicKey);
        hideBar();
        document.getElementById('whyCompareArea').innerHTML = `
          <div class="section-label">Feedback on your explanation</div>
          <div class="summary-body">${escapeHtml(feedback)}</div>
        `;
        btn.style.display = 'none';
        document.getElementById('skipWhy').textContent = 'Continue';
      }catch(e){
        hideBar();
        alert('Could not generate feedback: ' + e.message);
        btn.disabled = false; btn.textContent = 'Get feedback';
      }
    };
  }
  function advanceCard(completedCard){
    const shouldShowWhy = whyMode && (deck === 'term' || deck === 'outline') && completedCard.hasRationale !== false;
    if(shouldShowWhy){
      showWhyInterstitial(completedCard, () => { revealed = false; draw(); });
    } else {
      revealed = false; draw();
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);

  function draw(){
    if(pending.length === 0){
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Session complete</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="display" style="font-size:19px;margin-bottom:6px;">${masteredCount} / ${totalUnique} terms mastered</div>
            ${learnedCount ? `<div class="help">${learnedCount} of those were brand new.</div>` : ''}
            ${bestStreak >= 3 ? `<div class="help" style="color:var(--brass);margin-top:4px;">&#9733; Best streak this session: ${bestStreak} in a row</div>` : ''}
            <div class="help" style="margin-top:10px;">${remainingAfter > 0 ? `${remainingAfter} more term${remainingAfter===1?'':'s'} waiting outside this batch &mdash; start another session anytime.` : `That's everything in the queue for now.`}</div>
          </div>
          <div class="modal-foot">
            ${remainingAfter > 0 ? `<button class="btn ghost" id="anotherSess">Study more now</button>` : ''}
            <button class="btn" id="doneSess">Done</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      document.getElementById('doneSess').onclick = close;
      const anotherBtn = document.getElementById('anotherSess');
      if(anotherBtn) anotherBtn.onclick = () => { close(); renderStudySetupModal(); };
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      if(state.settings.githubToken){ syncNow().catch(e=>console.error(e)); }
      return;
    }
    const card = pending[0];
    const cardCourseId = card.courseId || courseId;
    const streakBadge = streak >= 2 ? `<span class="mono" style="font-size:11px;color:var(--brass);margin-left:8px;">&#9679; streak ${streak}</span>` : '';
    // Assigned once per card and cached on it, so a re-render mid-attempt (revealing an
    // answer, etc.) never reassigns a different mode out from under an in-progress card.
    if(!card._assignedMode) card._assignedMode = recallModes[Math.floor(Math.random() * recallModes.length)];
    const recallMode = card._assignedMode;
    const reversed = !card.isNew && recallMode !== 'blank' && (direction === 'reverse' || (direction === 'mixed' && Math.random() < 0.5));

    if(card.isNew){
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="mono" style="font-size:10px;color:var(--oxblood);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px;">New term &mdash; learning</div>
            <div style="text-align:center;padding:16px 10px 6px;">
              <div class="display" style="font-size:24px;margin-bottom:16px;">${escapeHtml(card.term)}</div>
              <div class="summary-body" style="font-size:16px;text-align:left;border-top:1px solid var(--rule);padding-top:14px;">${escapeHtml(card.definition)}</div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn" id="learnedBtn">Got it — next</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('learnedBtn').onclick = () => {
        recordTermTaught(cardCourseId, card.term, card.definition, deck);
        learnedCount++;
        pending.shift();
        if(allowRequeue){
          // Without this, a batch of new terms just runs out once each has been shown
          // a single time — no actual reinforcement happens in the same sitting. Bring
          // it back a few cards later as a real quiz card, not another teach card. Since
          // it'll get a real chance to be answered correctly below, don't also count the
          // teach step itself toward "mastered" — that would double-count this one term.
          const reinsertAt = Math.min(3, pending.length);
          const requeued = { ...card, isNew: false, isDue: true, progress: getTermProgress(cardCourseId, card.term, deck) };
          pending.splice(reinsertAt, 0, requeued);
        } else {
          masteredCount++;
        }
        draw();
      };
      return;
    }

    if(recallMode === 'mc'){
      const promptLabel = reversed ? (deck === 'case' ? 'Holding' : 'Definition') : (deck === 'case' ? 'Case' : 'Term');
      const promptText = reversed ? card.definition : card.term;

      if(!card._mcChoices){
        // Built once per card and cached on it, so a re-render (which can happen for
        // other reasons) never reshuffles options out from under an in-progress pick.
        const correctValue = reversed ? card.term : card.definition;
        const seen = new Set([correctValue.trim().toLowerCase()]);
        const candidates = distractorPool.filter(c => c !== card);
        for(let i = candidates.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i+1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        const distractors = [];
        for(const c of candidates){
          const val = reversed ? c.term : c.definition;
          if(!val) continue;
          const key = val.trim().toLowerCase();
          if(seen.has(key)) continue;
          seen.add(key);
          distractors.push(val);
          if(distractors.length >= 3) break;
        }
        const options = [...distractors, correctValue];
        for(let i = options.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i+1));
          [options[i], options[j]] = [options[j], options[i]];
        }
        card._mcChoices = options;
        card._mcCorrectValue = correctValue;
      }
      const options = card._mcChoices;
      const correctValue = card._mcCorrectValue;

      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Multiple Choice${reversed ? ' (Reversed)' : ''}</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="mono" style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">${promptLabel}</div>
            <div class="display" style="font-size:19px;margin-bottom:16px;">${escapeHtml(promptText)}</div>
            ${options.length < 2 ? `<div class="help">Not enough other cards in this session to build real choices — add more to the batch or switch modes.</div>` : `
            <div id="mcOptions">
              ${options.map((opt, i) => `<button class="mc-option" data-idx="${i}" style="display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:14px;">${escapeHtml(opt)}</button>`).join('')}
            </div>
            `}
          </div>
          <div class="modal-foot">
            <button class="btn" id="mcContinueBtn" style="display:none;">Continue</button>
          </div>
        </div>
      `;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      const optionBtns = Array.from(document.querySelectorAll('.mc-option'));
      let answered = false;
      optionBtns.forEach(btn => {
        btn.onclick = () => {
          if(answered) return;
          answered = true;
          optionBtns.forEach(b => b.disabled = true);
          const picked = options[parseInt(btn.dataset.idx, 10)];
          const isCorrect = picked === correctValue;
          btn.style.borderColor = isCorrect ? 'var(--green-ok)' : 'var(--oxblood)';
          btn.style.background = isCorrect ? 'rgba(46,138,92,0.12)' : 'rgba(122,45,45,0.08)';
          if(!isCorrect){
            const correctBtn = optionBtns.find(b => options[parseInt(b.dataset.idx,10)] === correctValue);
            if(correctBtn){ correctBtn.style.borderColor = 'var(--green-ok)'; correctBtn.style.background = 'rgba(46,138,92,0.12)'; }
          }
          recordTermAnswer(cardCourseId, card.term, card.definition, isCorrect, deck);
          reviewAttempts++;
          if(isCorrect){ reviewCorrect++; masteredCount++; streak++; bestStreak = Math.max(bestStreak, streak); }
          else { streak = 0; }
          card._mcWasCorrect = isCorrect;
          document.getElementById('mcContinueBtn').style.display = '';
        };
      });
      document.getElementById('mcContinueBtn').onclick = () => {
        const wasCorrect = card._mcWasCorrect;
        pending.shift();
        if(!wasCorrect && allowRequeue){
          const reinsertAt = Math.min(3, pending.length);
          pending.splice(reinsertAt, 0, card);
        }
        advanceCard(card);
      };
      if(options.length < 2){
        document.getElementById('mcContinueBtn').style.display = '';
        document.getElementById('mcContinueBtn').onclick = () => { pending.shift(); advanceCard(card); };
      }
      return;
    }

    if(recallMode === 'verbatim' && !revealed){
      const promptLabel = reversed ? 'Definition' : (deck === 'case' ? 'Case' : 'Term');
      const promptText = reversed ? card.definition : card.term;
      const askFor = reversed ? (deck === 'case' ? 'the case name' : 'the term') : (deck === 'case' ? 'the holding' : 'the definition');
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Verbatim${reversed ? ' (Reversed)' : ''}</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="mono" style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">${promptLabel}</div>
            <div style="text-align:center;padding:10px 10px 6px;">
              <div class="display" style="font-size:${reversed ? '17px' : '24px'};margin-bottom:16px;">${escapeHtml(promptText)}</div>
            </div>
            <label>Type ${askFor} from memory, as close to word-for-word as you can</label>
            <textarea id="vbInput" rows="${reversed ? 2 : 5}" placeholder="Type your answer here..."></textarea>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" id="skipBtn">Skip session</button>
            <button class="btn" id="checkBtn">Check</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('skipBtn').onclick = close;
      document.getElementById('checkBtn').onclick = () => {
        const typed = document.getElementById('vbInput').value;
        const answerText = reversed ? card.term : card.definition;
        const diff = computeWordDiff(typed, answerText);
        card._diff = diff;
        card._reversed = reversed;
        revealed = true;
        draw();
      };
      return;
    }

    if(recallMode === 'verbatim' && revealed){
      const diff = card._diff;
      const wasReversed = card._reversed;
      const scoreColor = diff.score >= 90 ? 'var(--green-ok)' : (diff.score >= 60 ? 'var(--brass)' : 'var(--oxblood)');
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Verbatim${wasReversed ? ' (Reversed)' : ''}</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="display" style="font-size:20px;margin-bottom:4px;">${escapeHtml(wasReversed ? card.definition : card.term)}</div>
            <div class="mono" style="font-size:12px;color:${scoreColor};margin-bottom:14px;">Word match: ${diff.score}%</div>
            <label>Correct ${wasReversed ? (deck==='case'?'case name':'term') : (deck==='case'?'holding':'definition')} — words you missed or got wrong are underlined</label>
            <div class="summary-body" style="font-size:15.5px;text-align:left;border-top:1px solid var(--rule);padding-top:12px;">${diff.correctWords.map((w,idx) => diff.matched[idx] ? escapeHtml(w) : `<span style="color:var(--oxblood);text-decoration:underline;text-decoration-color:var(--oxblood);">${escapeHtml(w)}</span>`).join(' ')}</div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" id="missBtn">Didn't know it</button>
            <button class="btn" id="gotBtn">Got it</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('gotBtn').onclick = () => {
        recordTermAnswer(cardCourseId, card.term, card.definition, true, deck);
        reviewCorrect++; reviewAttempts++; masteredCount++;
        streak++; bestStreak = Math.max(bestStreak, streak);
        pending.shift();
        advanceCard(card);
      };
      document.getElementById('missBtn').onclick = () => {
        recordTermAnswer(cardCourseId, card.term, card.definition, false, deck);
        reviewAttempts++;
        streak = 0;
        pending.shift();
        if(allowRequeue){
          const reinsertAt = Math.min(3, pending.length);
          pending.splice(reinsertAt, 0, card);
        }
        advanceCard(card);
      };
      return;
    }

    if(recallMode === 'blank' && !revealed){
      const target = blankTarget === 'mix' ? (Math.random() < 0.5 ? 'definition' : 'term') : (blankTarget || 'definition');
      card._blankTarget = target;
      if(target === 'term'){
        overlay.innerHTML = `
          <div class="modal">
            <div class="modal-head">
              <h2>Teach Me — Fill in the Blanks</h2>
              <button class="modal-close" id="closeSess">&times;</button>
            </div>
            <div class="modal-body">
              <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
              <div class="mono" style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">${deck==='case'?'Holding':'Definition'}</div>
              <div class="summary-body" style="font-size:15.5px;margin-bottom:16px;">${escapeHtml(card.definition)}</div>
              <label>What ${deck==='case'?'case':'term'} is this?</label>
              <input type="text" id="blankTermInput" placeholder="Type your answer..." autocomplete="off" spellcheck="false" />
            </div>
            <div class="modal-foot">
              <button class="btn ghost" id="skipBtn">Skip session</button>
              <button class="btn" id="checkBlanksBtn">Check</button>
            </div>
          </div>`;
        const close = () => overlay.remove();
        document.getElementById('closeSess').onclick = close;
        overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
        document.getElementById('skipBtn').onclick = close;
        document.getElementById('checkBlanksBtn').onclick = () => {
          const clean = (s) => (s||'').toLowerCase().replace(/[.,;:!?()'"]/g,'').trim();
          const typed = document.getElementById('blankTermInput').value;
          const isCorrect = clean(typed) === clean(card.term);
          card._blankReview = [{ word: card.term, wasBlank: true, correct: isCorrect }];
          card._blankScore = isCorrect ? 100 : 0;
          revealed = true;
          draw();
        };
        return;
      }
      const words = (card.definition || '').trim().split(/\s+/).filter(Boolean);
      const blankSet = chooseBlankIndices(words, card.progress ? card.progress.box : 0);
      const blankedHtml = buildBlankedHtml(words, blankSet);
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Fill in the Blanks</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="display" style="font-size:20px;margin-bottom:16px;">${escapeHtml(card.term)}</div>
            <div style="font-size:15.5px;line-height:2.1;">${blankedHtml}</div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" id="skipBtn">Skip session</button>
            <button class="btn" id="checkBlanksBtn">Check</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('skipBtn').onclick = close;
      document.getElementById('checkBlanksBtn').onclick = () => {
        const clean = (s) => (s||'').toLowerCase().replace(/[.,;:!?()'"]/g,'').trim();
        const inputs = Array.from(overlay.querySelectorAll('.blank-input'));
        let correct = 0;
        const review = words.map((w, i) => {
          if(!blankSet.has(i)) return { word: w, wasBlank: false };
          const inputEl = inputs.find(inp => parseInt(inp.dataset.idx, 10) === i);
          const isCorrect = clean(inputEl ? inputEl.value : '') === clean(w);
          if(isCorrect) correct++;
          return { word: w, wasBlank: true, correct: isCorrect };
        });
        card._blankReview = review;
        card._blankScore = blankSet.size > 0 ? Math.round((correct/blankSet.size)*100) : 100;
        revealed = true;
        draw();
      };
      return;
    }

    if(recallMode === 'blank' && revealed){
      const scoreColor = card._blankScore >= 90 ? 'var(--green-ok)' : (card._blankScore >= 60 ? 'var(--brass)' : 'var(--oxblood)');
      const resultHtml = card._blankReview.map(r => r.wasBlank
        ? (r.correct ? escapeHtml(r.word) : `<span style="color:var(--oxblood);text-decoration:underline;">${escapeHtml(r.word)}</span>`)
        : escapeHtml(r.word)
      ).join(' ');
      const headerLabel = card._blankTarget === 'term' ? (deck==='case'?'Correct case':'Correct term') : 'Blanks you missed are underlined';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Fill in the Blanks</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="display" style="font-size:20px;margin-bottom:4px;">${escapeHtml(card.term)}</div>
            <div class="mono" style="font-size:12px;color:${scoreColor};margin-bottom:14px;">${card._blankTarget === 'term' ? (card._blankScore === 100 ? 'Correct' : 'Not quite') : 'Blanks correct: ' + card._blankScore + '%'}</div>
            <label>${headerLabel}</label>
            <div class="summary-body" style="font-size:15.5px;line-height:1.9;text-align:left;border-top:1px solid var(--rule);padding-top:12px;">${resultHtml}</div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" id="missBtn">Didn't know it</button>
            <button class="btn" id="gotBtn">Got it</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('gotBtn').onclick = () => {
        recordTermAnswer(cardCourseId, card.term, card.definition, true, deck);
        reviewCorrect++; reviewAttempts++; masteredCount++;
        streak++; bestStreak = Math.max(bestStreak, streak);
        pending.shift();
        advanceCard(card);
      };
      document.getElementById('missBtn').onclick = () => {
        recordTermAnswer(cardCourseId, card.term, card.definition, false, deck);
        reviewAttempts++;
        streak = 0;
        pending.shift();
        if(allowRequeue){
          const reinsertAt = Math.min(3, pending.length);
          pending.splice(reinsertAt, 0, card);
        }
        advanceCard(card);
      };
      return;
    }

    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>Teach Me</h2>
          <button class="modal-close" id="closeSess">&times;</button>
        </div>
        <div class="modal-body">
          <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
          ${(() => { const m = masteryInfo(card.progress ? card.progress.box : 0); return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <span class="mono" style="font-size:10px;color:${m.color};white-space:nowrap;">${escapeHtml(m.label)}</span>
            <div style="flex:1;height:5px;background:var(--rule);position:relative;">
              <div style="position:absolute;left:0;top:0;bottom:0;width:${m.percent}%;background:${m.color};"></div>
            </div>
          </div>`; })()}
          <div style="text-align:center;padding:20px 10px;">
            <div class="mono" style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">${reversed ? (deck==='case'?'Holding':'Definition') : (deck==='case'?'Case':'Term')}</div>
            <div class="display" style="font-size:${reversed ? '18px' : '24px'};margin-bottom:18px;">${escapeHtml(reversed ? card.definition : card.term)}</div>
            ${revealed ? `
              <div class="summary-body" style="font-size:16px;text-align:left;border-top:1px solid var(--rule);padding-top:14px;">${escapeHtml(reversed ? card.term : card.definition)}</div>
            ` : `<button class="btn ghost" id="revealBtn">Show ${reversed ? (deck==='case'?'case name':'term') : (deck==='case'?'holding':'definition')}</button>`}
          </div>
        </div>
        <div class="modal-foot">
          ${revealed ? `
            <button class="btn ghost" id="missBtn">Didn't know it</button>
            <button class="btn" id="gotBtn">Got it</button>
          ` : `<button class="btn ghost" id="skipBtn">Skip session</button>`}
        </div>
      </div>`;
    const close = () => overlay.remove();
    document.getElementById('closeSess').onclick = close;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
    const revealBtn = document.getElementById('revealBtn');
    if(revealBtn) revealBtn.onclick = () => { revealed = true; draw(); };
    const skipBtn = document.getElementById('skipBtn');
    if(skipBtn) skipBtn.onclick = close;
    const gotBtn = document.getElementById('gotBtn');
    const missBtn = document.getElementById('missBtn');
    if(gotBtn) gotBtn.onclick = () => {
      recordTermAnswer(cardCourseId, card.term, card.definition, true, deck);
      reviewCorrect++; reviewAttempts++; masteredCount++;
      streak++; bestStreak = Math.max(bestStreak, streak);
      pending.shift();
      advanceCard(card);
    };
    if(missBtn) missBtn.onclick = () => {
      recordTermAnswer(cardCourseId, card.term, card.definition, false, deck);
      reviewAttempts++;
      streak = 0;
      pending.shift();
      if(allowRequeue){
        // Same term, same session, just a few cards later — no next-day wait.
        // pending never grows: we removed it above, this just changes its position.
        const reinsertAt = Math.min(3, pending.length);
        pending.splice(reinsertAt, 0, card);
      }
      advanceCard(card);
    };
  }
  draw();
}

/* ============ PRACTICE: ISSUE-SPOTTER HYPOTHETICALS ============ */
const ISSUE_SPOTTING_TECHNIQUES = [
  { id: 'but', name: 'Find the "But"', tip: 'Conjunctions like "but," "however," "although," "except," and "unless" usually mark the exact spot where a clean fact pattern gets a twist. Everything before sets up what looks like an easy case; everything after introduces the complication that IS the issue.', example: '"Cindy locked the door, but she quietly unlocked it five minutes later." — the "but" flags that the confinement was temporary, which is the whole ballgame for the awareness element of false imprisonment.' },
  { id: 'numbers', name: 'Suspicious Specificity', tip: 'Facts stated with unusual precision — exact times, distances, ages, dollar amounts — are almost never decorative. Ask what legal threshold or rule a number like that might be keyed to.', example: '"the invoice was 31 days overdue" — 30 days is a common contractual cutoff, so the extra day is probably the point being tested.' },
  { id: 'adverbs', name: 'Adverbs Are Doing Legal Work', tip: 'Words like "quietly," "secretly," "immediately," "reasonably," "knowingly" usually map directly onto an element of a claim — state of mind, causation, or timing. Don\'t skim past them.', example: '"quietly locks the door" signals the other party\'s lack of awareness — directly relevant to an awareness element.' },
  { id: 'mental-state', name: 'State-of-Mind Words Pick the Claim', tip: 'Intentionally / accidentally / negligently / recklessly / knowingly often determine which cause of action is even available in the first place.', example: 'A "negligent" act points toward negligence; the same act described as "intentional" opens the door to intentional torts instead.' },
  { id: 'parties', name: 'Every New Party Is a Potential Claim', tip: 'As soon as a third party enters a fact pattern — an employer, a bystander, a company — ask whether they create vicarious liability, a new duty, a new defense, or a separate claim entirely.', example: 'An employee\'s tortious act during work hours often raises a separate vicarious liability question against the employer.' },
  { id: 'elements', name: 'Test Every Element, Even the Obvious Ones', tip: 'Don\'t silently skip an element because it feels obviously satisfied. Rubrics give credit for stating it, and sometimes the "obvious" element is the one with a hidden twist.', example: 'Even when intent is clearly present, say so explicitly rather than jumping straight to the contested element.' },
  { id: 'convenient', name: 'A Convenient Resolution Is a Clue', tip: 'If a fact pattern conveniently resolves an obstacle — the door "happened" to be unlocked, the check "happened" to clear — that convenience is usually the point being tested, not a coincidence.', example: 'The door being unlocked before the plaintiff ever tried it is precisely what defeats the awareness element.' },
  { id: 'discuss-all', name: '"Discuss All" Means More Than One', tip: 'If the call of the question says "fully discuss" or "discuss all potential claims," that\'s the professor telling you there\'s more than one thing to find. Treat the first issue you spot as the floor, not the ceiling.', example: 'Finding one valid claim doesn\'t mean you\'re done — keep scanning the facts for others.' },
];

  { id: 'unit-topic-vs-issue', name: 'Unit 1: What Is an Issue?', tip: 'A topic is the general area of law ("false imprisonment"). An issue is the specific, disputed question the facts actually raise ("whether Martha was confined, given that she never knew about it"). Most missed points come from stopping at the topic instead of pushing to the actual question.' },

// Stage numbers: 0 = not started, 1 = learned why + saw a worked example,
// 2 = completed guided practice (signal given, just interpret it), 3 = mastered
// (completed a fully independent drill). Each stage unlocks the next — no skipping.
function setTechniqueStage(techniqueId, stage){
  state.issueSpottingProgress = state.issueSpottingProgress || {};
  state.issueSpottingProgress[techniqueId] = Math.max(state.issueSpottingProgress[techniqueId] || 0, stage);
  saveState(['issueSpottingProgress']);
}
function getTechniqueStage(techniqueId){
  return (state.issueSpottingProgress || {})[techniqueId] || 0;
}
const STAGE_LABELS = ['Not started', 'Learned — ready for guided practice', 'Guided practice done — ready to try it alone', 'Mastered'];

function renderIntegratedSetAnswerModal(set){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal wide">
      <div class="modal-head">
        <h2>Integrated Question Set</h2>
        <button class="modal-close" id="closeIQS">&times;</button>
      </div>
      <div class="modal-body">
        <div class="summary-body" style="font-size:15px;margin-bottom:16px;padding:12px 14px;background:var(--paper);border-left:2px solid var(--brass);">${escapeHtml(set.scenario)}</div>
        ${set.questions.map((q, i) => `
          <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;">${escapeHtml(q.skill)}</div>
          <label style="font-weight:600;font-size:14.5px;">${escapeHtml(q.prompt)}</label>
          <textarea id="iqsAnswer${i}" rows="4" placeholder="Write your answer here..." style="margin-bottom:14px;"></textarea>
        `).join('')}
        <div id="iqsError"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="skipIQS">Skip</button>
        <button class="btn" id="submitIQS">Get feedback</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closeIQS').onclick = close;
  document.getElementById('skipIQS').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  document.getElementById('submitIQS').onclick = async () => {
    const studentAnswers = {};
    set.questions.forEach((q, i) => { studentAnswers[q.id] = document.getElementById(`iqsAnswer${i}`).value.trim(); });
    const errEl = document.getElementById('iqsError');
    if(Object.values(studentAnswers).every(a => !a)){ errEl.innerHTML = `<div class="err-box">Write at least one answer first.</div>`; return; }
    const btn = document.getElementById('submitIQS');
    btn.disabled = true; btn.textContent = 'Grading...';
    const { update, cleanup } = showDeterminateBar(btn);
    try{
      const feedback = await gradeIntegratedQuestionSet(set.scenario, set.questions, set.modelAnswers, studentAnswers, state.settings.anthropicKey, update);
      cleanup();
      close();
      renderIntegratedSetFeedbackModal(set, feedback);
    }catch(e){
      cleanup();
      errEl.innerHTML = `<div class="err-box">${escapeHtml(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Get feedback';
    }
  };
}
