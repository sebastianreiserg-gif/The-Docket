<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Docket</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F2733" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE3;
    --paper-raised:#FAF7F0;
    --ink:#1F2733;
    --ink-soft:#5C6773;
    --rule:#CBBFA6;
    --oxblood:#7C2D2D;
    --oxblood-dark:#5E2121;
    --brass:#A98544;
    --green-ok:#3E5C3E;
    --shadow: 0 1px 2px rgba(31,39,51,0.08), 0 4px 14px rgba(31,39,51,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      linear-gradient(var(--paper), var(--paper));
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:0.035;
    background-image:radial-gradient(circle at 1px 1px, #1F2733 1px, transparent 0);
    background-size:22px 22px;
    z-index:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Libre Caslon Display', 'Source Serif 4', serif;}

  #app{position:relative;z-index:1;display:flex;min-height:100vh;}

  /* Sidebar — case-file tabs */
  .sidebar{
    width:230px;flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--rule);
    display:flex;flex-direction:column;
    padding:22px 0 16px;
  }
  .brand{
    padding:0 20px 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:10px;
  }
  .brand .display{font-size:22px;letter-spacing:0.3px;line-height:1.15;}
  .brand .mono{font-size:10px;color:var(--ink-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}

  .course-tab{
    position:relative;
    padding:13px 20px 13px 24px;
    cursor:pointer;
    border-bottom:1px solid rgba(203,191,166,0.5);
    transition:background 0.15s ease;
  }
  .course-tab:hover{background:rgba(122,45,45,0.05);}
  .course-tab.active{background:var(--paper);}
  .course-tab.active::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--oxblood);
  }
  .course-tab .name{font-size:15px;font-weight:600;display:block;}
  .course-tab .count{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  .add-course{
    padding:11px 20px 11px 24px;
    font-size:13px;color:var(--ink-soft);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .add-course:hover{color:var(--oxblood);}

  .sidebar-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--rule);}
  .settings-btn{
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink-soft);cursor:pointer;padding:8px 0;
  }
  .settings-btn:hover{color:var(--ink);}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    padding:24px 32px 16px;
    border-bottom:1px solid var(--rule);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;row-gap:14px;
  }
  .topbar h1{margin:0;font-size:28px;font-weight:400;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:4px;text-transform:uppercase;letter-spacing:1px;}

  .ref-strip{
    padding:16px 32px 18px;
    border-bottom:1px solid var(--rule);
    background:var(--paper-raised);
    display:flex;flex-direction:column;gap:10px;
  }
  .ref-strip-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--ink-soft);white-space:nowrap;
  }
  .ref-group-label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--brass);margin:2px 0 -2px;
  }
  .ref-tabs{
    display:flex;width:100%;
    border:1px solid var(--rule);
    background:var(--paper);
    box-shadow:var(--shadow);
  }
  .ref-tab{
    flex:1;
    min-width:0;
    display:flex;align-items:center;justify-content:center;gap:9px;
    padding:14px 12px;
    border:none;border-right:1px solid var(--rule);
    background:transparent;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.3px;
    color:var(--ink-soft);
    white-space:normal;overflow-wrap:break-word;text-align:center;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .ref-tab:last-child{ border-right:none; }
  .ref-tab:hover{background:rgba(122,45,45,0.06);color:var(--oxblood);}
  .ref-tab-icon{color:var(--brass);font-size:14px;transition:color 0.15s ease;}
  .ref-tab:hover .ref-tab-icon{color:var(--oxblood);}

  .searchwrap{position:relative;flex:1 1 160px;min-width:140px;max-width:260px;}
  .searchwrap input{
    width:100%;padding:9px 12px 9px 30px;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    color:var(--ink);
  }
  .searchwrap input:focus{outline:2px solid var(--oxblood);outline-offset:-1px;}
  .searchwrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:13px;}

  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    padding:10px 16px;border:1px solid var(--oxblood);
    background:var(--oxblood);color:var(--paper-raised);
    cursor:pointer;letter-spacing:0.3px;
  }
  .btn:hover{background:var(--oxblood-dark);}
  .btn.ghost{background:transparent;color:var(--oxblood);}
  .btn.ghost:hover{background:rgba(122,45,45,0.08);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .content{flex:1;overflow-y:auto;padding:24px 32px 60px;}

  .empty{
    margin-top:60px;text-align:center;color:var(--ink-soft);
  }
  .empty .display{font-size:20px;color:var(--ink);margin-bottom:6px;}

  .docket-list{display:flex;flex-direction:column;gap:10px;}
  .entry{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-left:3px solid var(--brass);
    padding:14px 18px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;
    box-shadow:var(--shadow);
  }
  .entry:hover{border-left-color:var(--oxblood);}
  .entry .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.5px;}
  .entry .title{font-size:16px;margin:2px 0 4px;}
  .entry .meta{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .entry .status{font-size:10.5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.8px;padding:3px 8px;border:1px solid var(--rule);white-space:nowrap;}
  .status.ready{color:var(--green-ok);border-color:var(--green-ok);}
  .status.working{color:var(--brass);border-color:var(--brass);}
  .status.error{color:var(--oxblood);border-color:var(--oxblood);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(31,39,51,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal.wide{max-width:760px;}
  .modal.legal-pad-modal{max-width:800px;}

  /* Legal pad — Case Briefs notebook */
  .legal-pad{
    background-color:#FBF3AE;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 32px, rgba(90,110,170,0.45) 32px, rgba(90,110,170,0.45) 33px, transparent 33px, transparent 44px);
    background-position: 0 3px;
    position:relative;
    padding:20px 24px 28px 60px;
    border:1px solid #DECF6E;
    box-shadow: inset 0 0 24px rgba(0,0,0,0.05);
  }
  .legal-pad::before{
    content:"";
    position:absolute; top:0; bottom:0; left:42px;
    width:2px; background:rgba(190,60,60,0.55);
  }
  .legal-pad-section{ margin-bottom:44px; }
  /* Topic title and case name are both serif-family and both need a downward nudge
     to land where they should — sharing one rule keeps them consistent with each other. */
  input.legal-pad-section-title, input.legal-pad-case-name{
    height:44px !important;
    box-sizing:border-box !important;
    line-height:26px !important;
    padding-top:18px !important;
    padding-bottom:0 !important;
    margin:0 !important;
  }
  .legal-pad-field-label{
    height:44px !important;
    box-sizing:border-box !important;
    line-height:26px !important;
    padding-top:18px !important;
    padding-bottom:0 !important;
    margin:0 !important;
  }
  input.legal-pad-section-title{
    font-family:'Libre Caslon Display', serif !important;
    font-size:30px !important;
    color:#7C2D2D !important;
    text-decoration:underline;
    text-decoration-color:rgba(124,45,45,0.4);
    background:transparent !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    width:100%;
  }
  .legal-pad-block{
    margin:0 0 44px;
    padding-bottom:0;
  }
  .legal-pad-section-body > .legal-pad-block:last-of-type{
    margin-bottom:0;
  }
  input.legal-pad-case-name{
    font-family:'Source Serif 4', serif !important;
    font-weight:700;
    font-style:italic;
    font-size:26px !important;
    color:#1F2733 !important;
    background:transparent !important;
    border:none !important;
    border-bottom:1px solid rgba(31,39,51,0.25) !important;
    border-radius:0 !important;
    box-shadow:none !important;
    width:100%;
  }
  .legal-pad-field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:18px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#8A6D1E;
  }
  textarea.legal-pad-field{
    font-family:'Source Serif 4', serif !important;
    font-size:26px !important;
    line-height:44px !important;
    min-height:44px;
    color:#1F2733 !important;
    background:transparent !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    width:100%;
    resize:none;
    overflow:hidden;
    field-sizing:content;
    padding:0 !important;
    margin:0;
  }
  input.legal-pad-field:focus, input.legal-pad-case-name:focus, input.legal-pad-section-title:focus, textarea.legal-pad-field:focus{
    outline:none; background:rgba(255,255,255,0.28) !important;
  }
  .legal-pad-block[data-locked="1"] input, .legal-pad-block[data-locked="1"] textarea, .legal-pad-section[data-locked="1"] input.legal-pad-section-title{
    pointer-events:none;
  }
  .firac-tag{
    display:inline;
    padding:1px 4px;
    border-radius:2px;
    font-weight:600;
    white-space:normal;
  }
  .firac-tag-a{ background:rgba(58,102,142,0.14); color:#2C4F6E; }
  .firac-tag-b{ background:rgba(62,92,62,0.14); color:#2C5F2D; }
  .firac-tag-c{ background:rgba(178,132,45,0.16); color:#8A6D1E; }
  .firac-tag-d{ background:rgba(122,73,151,0.14); color:#6B3F8E; }
  .firac-tag-e{ background:rgba(178,58,58,0.14); color:#B23A3A; }
  .tree-trail{ border-left:3px solid var(--rule); margin:0 0 6px 6px; padding:2px 0 2px 14px; }
  .tree-step{ margin-bottom:10px; font-size:14px; line-height:1.55; }
  .tree-step .q{ color:var(--ink-soft); }
  .tree-step .a{ font-weight:700; color:var(--oxblood); }
  .tree-step .why{ font-style:italic; color:var(--ink-soft); font-size:13.5px; }
  .tree-opt{ display:block; width:100%; text-align:left; font:inherit; cursor:pointer; background:var(--paper); border:1px solid var(--rule); border-left:3px solid var(--oxblood); padding:10px 14px; margin-bottom:8px; color:var(--ink); }
  .tree-opt b{ display:block; font-size:15px; margin-bottom:3px; }
  .tree-opt span{ display:block; font-size:13.5px; line-height:1.5; color:var(--ink-soft); font-style:italic; }
  .tree-full{ font-size:13.5px; line-height:1.55; }
  .tree-full ul{ list-style:none; margin:4px 0 4px 6px; padding-left:14px; border-left:2px solid var(--rule); }
  .tree-full li{ margin-bottom:6px; }
  .cmp-head{ display:none; }
  .cmp-row{ display:grid; grid-template-columns:1fr; gap:6px; padding:10px 0; border-bottom:1px solid var(--rule); }
  .cmp-label{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .cmp-cell{ padding:8px 12px; font-size:14px; line-height:1.55; white-space:pre-line; background:var(--paper); border-left:3px solid var(--rule); text-align:left; }
  .cmp-cell.a{ border-left-color:#2C4F6E; }
  .cmp-cell.b{ border-left-color:#2C5F2D; }
  .cmp-who{ display:block; font-weight:700; font-size:11px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:3px; }
  .cmp-cell.a .cmp-who{ color:#2C4F6E; } .cmp-cell.b .cmp-who{ color:#2C5F2D; }
  .cmp-flag{ display:block; margin-top:5px; font-size:12.5px; font-style:italic; color:var(--ink-soft); white-space:normal; }
  button.pbCell{ font:inherit; cursor:pointer; color:var(--ink-soft); border-top:0; border-right:0; border-bottom:0; filter:blur(0); }
  @media(min-width:760px){
    .cmp-head{ display:grid; grid-template-columns:150px 1fr 1fr; gap:6px; padding:8px 0; border-bottom:2px solid var(--oxblood); font-weight:700; }
    .cmp-row{ grid-template-columns:150px 1fr 1fr; }
    .cmp-who{ display:none; }
  }
  .doc-table-wrap{ margin:14px 0; overflow-x:auto; }
  .doc-table{ border-collapse:collapse; width:100%; font-size:14px; }
  .doc-table th, .doc-table td{ border:1px solid var(--rule); padding:8px 12px; text-align:left; vertical-align:top; }
  .doc-table th{ background:var(--paper-raised); color:var(--oxblood); font-weight:700; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
  .doc-table tr:nth-child(even) td{ background:rgba(203,191,166,0.12); }

  .legal-pad-datechip{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:17px;
    color:#5C4A0E; background:rgba(138,109,30,0.12);
    border:1px solid rgba(138,109,30,0.35);
    padding:4px 10px; margin:3px 6px 3px 0;
  }
  .legal-pad-datechip button{
    background:none; border:none; color:#7C2D2D; cursor:pointer; font-size:18px; padding:0; line-height:1;
  }
  .legal-pad-adddate-btn{
    font-family:'IBM Plex Mono', monospace !important;
    font-size:16px !important;
    background:rgba(255,255,255,0.5) !important;
    border:1px solid rgba(138,109,30,0.35) !important;
    color:#5C4A0E !important;
    padding:4px 12px !important;
    cursor:pointer;
    height:32px;
    box-sizing:border-box;
  }
  input[type=date].legal-pad-adddate-hidden{
    position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; border:none; padding:0;
  }
  .modal-head{
    padding:20px 24px;border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h2{margin:0;font-size:20px;font-weight:400;}
  .modal-close{cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
  .modal-close:hover{color:var(--oxblood);}
  .modal-body{padding:22px 24px;}

  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);margin:16px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=password], select, textarea{
    width:100%;padding:10px 12px;
    background:var(--paper);border:1px solid var(--rule);
    font-family:'Source Serif 4',serif;font-size:14.5px;color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--oxblood);outline-offset:-1px;}
  .filepick{
    border:1.5px dashed var(--rule);padding:22px;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);
    cursor:pointer;
  }
  .filepick:hover{border-color:var(--oxblood);color:var(--ink);}
  .filepick.has-file{border-style:solid;color:var(--ink);}

  .mode-row{display:flex;gap:10px;margin-top:6px;}
  .mode-opt{
    flex:1;padding:10px 12px;border:1px solid var(--rule);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;
  }
  .mode-opt.sel{border-color:var(--oxblood);background:rgba(122,45,45,0.06);color:var(--oxblood);}

  .progress{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);
  }
  .progress-text{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .dot{width:6px;height:6px;background:var(--brass);border-radius:50%;animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
  .progress-bar-track{width:100%;height:6px;background:var(--rule);position:relative;overflow:hidden;max-width:320px;}
  .progress-bar-fill{height:100%;background:var(--brass);transition:width 0.2s ease;}
  .progress-bar-fill.indeterminate{position:absolute;width:35%;left:-35%;animation:progress-slide 1.3s ease-in-out infinite;}
  @keyframes progress-slide{0%{left:-35%;}100%{left:100%;}}
  .inline-progress-bar{margin-top:8px;max-width:220px;}

  .modal-foot{padding:16px 24px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;}

  /* Detail view */
  .detail-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--brass);border-bottom:1px solid var(--rule);padding-bottom:6px;margin:22px 0 12px;}
  .section-label:first-of-type{margin-top:0;}
  .summary-body{font-size:15.5px;line-height:1.7;white-space:pre-wrap;}
  .transcript-body{font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--ink-soft);max-height:340px;overflow-y:auto;background:var(--paper);padding:14px;border:1px solid var(--rule);}

  .help{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .err-box{background:rgba(122,45,45,0.08);border:1px solid var(--oxblood);color:var(--oxblood-dark);padding:10px 12px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-top:12px;}

  @media (max-width:720px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px 0;}
    .brand{display:none;}
    .sidebar-foot{margin-top:0;border-top:none;border-left:1px solid var(--rule);padding:0 16px;}
    .course-tab{white-space:nowrap;border-bottom:none;}
    .topbar{flex-direction:column;align-items:stretch;}
    .ref-strip{gap:10px;padding:14px 16px;}
    .ref-tabs{flex-direction:column;width:100%;}
    .ref-tab{border-right:none;border-bottom:1px solid var(--rule);justify-content:flex-start;padding:13px 14px;}
    .ref-tabs .ref-tab:last-child{border-bottom:none;}
    .searchwrap input{width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ STATE ============ */
const DEFAULT_COURSES = [
  { id: 'torts', name: 'Torts' },
  { id: 'prof-id', name: 'Professional Identity' },
  { id: 'lrw', name: 'Legal Research & Writing' },
];

function mergeTermArrays(oldArr, newArr){
  // Regenerating shouldn't lose terms just because this run's extraction judgment call
  // landed slightly differently — merge by term name instead of overwriting outright.
  const map = {};
  (oldArr||[]).forEach(t => { if(t && t.term) map[t.term.trim().toLowerCase()] = t; });
  (newArr||[]).forEach(t => { if(t && t.term) map[t.term.trim().toLowerCase()] = t; }); // fresher data wins on overlap
  return Object.values(map);
}
function mergeCaseArrays(oldArr, newArr){
  const map = {};
  (oldArr||[]).forEach(c => { if(c && c.name) map[c.name.trim().toLowerCase()] = c; });
  (newArr||[]).forEach(c => { if(c && c.name) map[c.name.trim().toLowerCase()] = c; });
  return Object.values(map);
}
function mergeProfessorTips(oldArr, newArr){
  // Dedupe by exact text (trimmed, case-insensitive) rather than by a key, since tips
  // don't have a natural name the way a case or term does.
  const seen = new Set();
  const result = [];
  [...(oldArr||[]), ...(newArr||[])].forEach(tip => {
    if(typeof tip !== 'string' || !tip.trim()) return;
    const key = tip.trim().toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    result.push(tip.trim());
  });
  return result;
}

function normalizeLectures(lectures){
  return (lectures||[]).map(l => {
    if(!Array.isArray(l.caseLaw)) l.caseLaw = [];
    l.caseLaw = l.caseLaw.map(c => ({ ...c, citation: c && c.citation ? c.citation : null }));

    if(!Array.isArray(l.keyTerms)) l.keyTerms = [];
    // The Black's Law (1910) formal-definition feature was removed entirely — strip any
    // leftover fields from older data so nothing dead lingers, no button required.
    l.keyTerms = l.keyTerms.map(t => {
      const { formalDefinition, formalDefinitionSource, ...rest } = t || {};
      return rest;
    });
    if(typeof l.keyPoints !== 'string') l.keyPoints = l.keyPoints ? String(l.keyPoints) : '';
    if(typeof l.policyNotes !== 'string') l.policyNotes = l.policyNotes ? String(l.policyNotes) : '';
    if(!Array.isArray(l.professorTips)) l.professorTips = [];
    if(l.tipsScannedAt === undefined) l.tipsScannedAt = null;

    return l;
  });
}

function buildBackupObject(){
  return {
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    courses: state.courses,
    lectures: state.lectures,
    termProgress: state.termProgress,
    caseBriefs: state.caseBriefs,
    courseDocs: state.courseDocs,
    customTerms: state.customTerms,
    deletedTerms: state.deletedTerms,
    deletedLectureIds: state.deletedLectureIds,
    caseBriefNotebooks: state.caseBriefNotebooks,
    issueSpottingProgress: state.issueSpottingProgress,
    outlineFlashcards: state.outlineFlashcards,
    barSubjectLinks: state.barSubjectLinks,
    barReviews: state.barReviews,
  };
}
function downloadBackupFile(filename){
  // The anchor must actually be in the document before .click() is called — a detached
  // element can silently fail to trigger a download on mobile browsers and installed
  // PWA ("standalone") contexts specifically, with no error at all. This is the
  // standard, reliable pattern: attach, click, then clean up.
  const blob = new Blob([JSON.stringify(buildBackupObject(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function showBackupToast(success){
  // Auto-backup was designed to fail silently so it can never disrupt the actual
  // generation flow — but "silent" also meant "invisible even when it worked," which
  // made a real delivery bug (see downloadBackupFile) impossible to notice. This gives
  // a brief, non-blocking confirmation either way.
  const toast = document.createElement('div');
  toast.textContent = success ? 'Backup saved to Downloads' : 'Auto-backup failed — see console';
  toast.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;background:${success?'#2E4A3D':'#7A2D2D'};color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.3);`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
function triggerAutoBackup(){
  // Fires right after a lecture's transcript and documents finish generating — this is
  // the actual safety net now: whatever a manual backup would have captured, this
  // captures automatically, without relying on remembering to do it. Wrapped so a
  // failure here (e.g. the browser blocking the download) never disrupts the
  // generation flow that triggered it — this is a nice-to-have side effect, not
  // something that should be able to break the main operation.
  try{
    downloadBackupFile('Docket Backup.json');
    showBackupToast(true);
  }catch(e){
    console.error('Auto-backup failed', e);
    showBackupToast(false);
  }
}

function loadState(){
  let courses, lectures, settings, deletedLectureIds, termProgress, caseBriefs, courseDocs, customTerms, deletedTerms, caseBriefNotebooks, issueSpottingProgress, outlineFlashcards, barSubjectLinks, barReviews;
  try { courses = JSON.parse(localStorage.getItem('docket:courses')) || DEFAULT_COURSES; } catch(e){ courses = DEFAULT_COURSES; }
  courses = courses.map(c => ({ ...c, archived: !!c.archived }));
  try { lectures = JSON.parse(localStorage.getItem('docket:lectures')) || []; } catch(e){ lectures = []; }
  try { settings = JSON.parse(localStorage.getItem('docket:settings')) || {}; } catch(e){ settings = {}; }
  try { deletedLectureIds = JSON.parse(localStorage.getItem('docket:deleted')) || []; } catch(e){ deletedLectureIds = []; }
  try { termProgress = JSON.parse(localStorage.getItem('docket:termProgress')) || {}; } catch(e){ termProgress = {}; }
  try { caseBriefs = JSON.parse(localStorage.getItem('docket:caseBriefs')) || {}; } catch(e){ caseBriefs = {}; }
  try { courseDocs = JSON.parse(localStorage.getItem('docket:courseDocs')) || {}; } catch(e){ courseDocs = {}; }
  try { customTerms = JSON.parse(localStorage.getItem('docket:customTerms')) || {}; } catch(e){ customTerms = {}; }
  try { deletedTerms = JSON.parse(localStorage.getItem('docket:deletedTerms')) || {}; } catch(e){ deletedTerms = {}; }
  if(Array.isArray(deletedTerms)){
    // Migrate the old plain-array shape (no timestamps) to the new one — anything in
    // the old list is treated as deleted with no known timestamp, so a fresh explicit
    // un-delete will always correctly outrank it.
    const migrated = {};
    deletedTerms.forEach(key => { migrated[key] = { deleted: true, updatedAt: 0 }; });
    deletedTerms = migrated;
  }
  try { caseBriefNotebooks = JSON.parse(localStorage.getItem('docket:caseBriefNotebooks')) || {}; } catch(e){ caseBriefNotebooks = {}; }
  try { issueSpottingProgress = JSON.parse(localStorage.getItem('docket:issueSpottingProgress')) || {}; } catch(e){ issueSpottingProgress = {}; }
  try { outlineFlashcards = JSON.parse(localStorage.getItem('docket:outlineFlashcards')) || {}; } catch(e){ outlineFlashcards = {}; }
  try { barSubjectLinks = JSON.parse(localStorage.getItem('docket:barSubjectLinks')) || {}; } catch(e){ barSubjectLinks = {}; }
  try { barReviews = JSON.parse(localStorage.getItem('docket:barReviews')) || {}; } catch(e){ barReviews = {}; }
  settings.mode = settings.mode || 'local';
  settings.deepgramKey = settings.deepgramKey || '';
  settings.anthropicKey = settings.anthropicKey || '';
  settings.githubToken = settings.githubToken || '';
  settings.gistId = settings.gistId || '';
  settings.lastSync = settings.lastSync || 0;
  settings.termReviewMode = settings.termReviewMode || 'auto';
  settings.briefTemplateFields = (Array.isArray(settings.briefTemplateFields) && settings.briefTemplateFields.length) ? settings.briefTemplateFields : ['Facts','Issue','Rule','Analysis','Conclusion'];
  lectures = normalizeLectures(lectures);
  // Re-normalizes every existing term's capitalization on load, so a change to the
  // capitalization convention applies retroactively to already-saved terms, not just
  // ones added going forward. Cheap and idempotent — safe to run on every load.
  lectures.forEach(l => {
    if(Array.isArray(l.keyTerms)){
      l.keyTerms.forEach(kt => { if(kt && kt.term) kt.term = capitalizeTerm(kt.term); });
    }
  });
  Object.values(customTerms || {}).forEach(entry => {
    if(entry && entry.term) entry.term = capitalizeTerm(entry.term);
  });
  return { courses, lectures, settings, deletedLectureIds, termProgress, caseBriefs, courseDocs, customTerms, deletedTerms, caseBriefNotebooks, issueSpottingProgress, outlineFlashcards, barSubjectLinks, barReviews };
}
// dirtyKeys lets a caller specify which localStorage keys actually need rewriting —
// e.g. adding a dictionary word only touches customTerms, not the whole lecture
// library. Re-serializing every lecture's transcript on every small edit is what was
// causing the slowdown/freeze as a course's data grew. Omit it to save everything,
// same as before, for any call site that hasn't been given a narrower hint.
const STATE_WRITERS = {
  courses: () => localStorage.setItem('docket:courses', JSON.stringify(state.courses)),
  lectures: () => localStorage.setItem('docket:lectures', JSON.stringify(state.lectures)),
  settings: () => localStorage.setItem('docket:settings', JSON.stringify(state.settings)),
  deletedLectureIds: () => localStorage.setItem('docket:deleted', JSON.stringify(state.deletedLectureIds||[])),
  termProgress: () => localStorage.setItem('docket:termProgress', JSON.stringify(state.termProgress||{})),
  caseBriefs: () => localStorage.setItem('docket:caseBriefs', JSON.stringify(state.caseBriefs||{})),
  caseBriefNotebooks: () => localStorage.setItem('docket:caseBriefNotebooks', JSON.stringify(state.caseBriefNotebooks||{})),
  deletedTerms: () => localStorage.setItem('docket:deletedTerms', JSON.stringify(state.deletedTerms||{})),
  outlineFlashcards: () => localStorage.setItem('docket:outlineFlashcards', JSON.stringify(state.outlineFlashcards||{})),
  customTerms: () => localStorage.setItem('docket:customTerms', JSON.stringify(state.customTerms||{})),
  issueSpottingProgress: () => localStorage.setItem('docket:issueSpottingProgress', JSON.stringify(state.issueSpottingProgress||{})),
  courseDocs: () => localStorage.setItem('docket:courseDocs', JSON.stringify(state.courseDocs||{})),
  barSubjectLinks: () => localStorage.setItem('docket:barSubjectLinks', JSON.stringify(state.barSubjectLinks||{})),
  barReviews: () => localStorage.setItem('docket:barReviews', JSON.stringify(state.barReviews||{})),
};
function saveState(dirtyKeys){
  const keys = dirtyKeys || Object.keys(STATE_WRITERS);
  keys.forEach(k => { if(STATE_WRITERS[k]) STATE_WRITERS[k](); });
}

function docketNumber(lecture){
  const course = state.courses.find(c=>c.id===lecture.courseId);
  const prefix = (course ? course.name : 'GEN').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3);
  const siblings = state.lectures.filter(l=>l.courseId===lecture.courseId).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const idx = siblings.findIndex(l=>l.id===lecture.id) + 1;
  return `${prefix}-${String(idx).padStart(3,'0')}`;
}

function renderEntry(l, q){
  const statusClass = l.status === 'ready' ? 'ready' : (l.status === 'error' ? 'error' : 'working');
  const statusText = l.status === 'ready' ? 'Transcribed' : (l.status === 'error' ? 'Failed' : 'Processing');
  return `
  <div class="entry" data-lecture="${l.id}">
    <div>
      <div class="num">${docketNumber(l)}${q ? ' &middot; ' + escapeHtml(state.courses.find(c=>c.id===l.courseId)?.name || '') : ''}</div>
      <div class="title">${escapeHtml(l.title || 'Untitled recording')}</div>
      <div class="meta">${l.date || ''}${l.durationLabel ? ' &middot; ' + l.durationLabel : ''}</div>
    </div>
    <div class="status ${statusClass}">${statusText}</div>
  </div>`;
}

function setProgress(el, msg, percent){
  const bar = (typeof percent === 'number')
    ? `<div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.max(0,Math.min(100,percent))}%;"></div></div>`
    : `<div class="progress-bar-track"><div class="progress-bar-fill indeterminate"></div></div>`;
  el.innerHTML = `<div class="progress"><div class="progress-text"><span class="dot"></span>${escapeHtml(msg)}</div>${bar}</div>`;
}
function showDeterminateBar(btn){
  // Unlike showInlineBar's elapsed-time-only display, this shows a real percentage and
  // ETA — but "real" here means estimated from actual streamed characters against a
  // typical-output-size guess for this kind of request, not a guaranteed-accurate
  // measure. It's capped just under 100% until the stream genuinely finishes, so it
  // never claims to be done before it actually is, even if the real output runs longer
  // than the estimate.
  const bar = document.createElement('div');
  bar.className = 'progress-bar-track inline-progress-bar';
  bar.innerHTML = '<div class="progress-bar-fill" style="width:0%;"></div>';
  const fill = bar.querySelector('.progress-bar-fill');
  const textEl = document.createElement('div');
  textEl.className = 'mono';
  textEl.style.cssText = 'font-size:10px;color:var(--ink-soft);margin-top:4px;';
  textEl.textContent = 'Working... 0%';
  btn.insertAdjacentElement('afterend', bar);
  bar.insertAdjacentElement('afterend', textEl);
  const update = (pct, etaSec) => {
    fill.style.width = Math.max(0,Math.min(100,pct)) + '%';
    const etaText = (etaSec != null && pct < 100) ? ` — about ${formatEta(etaSec)} remaining` : '';
    textEl.textContent = `Working... ${Math.round(pct)}%${etaText}`;
  };
  return { update, cleanup: () => { bar.remove(); textEl.remove(); } };
}

async function fetchClaudeStreamWithProgress(body, apiKey, estimatedOutputChars, onProgress){
  const startTime = Date.now();
  let estimate = estimatedOutputChars;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ ...body, stream: true })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n\n');
    buffer = parts.pop();
    for(const part of parts){
      const line = part.split('\n').find(l => l.startsWith('data: '));
      if(!line) continue;
      const dataStr = line.slice(6);
      if(dataStr === '[DONE]') continue;
      let evt;
      try{ evt = JSON.parse(dataStr); }catch(e){ continue; }
      if(evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta'){
        fullText += evt.delta.text;
        if(onProgress){
          // The initial estimate is just a guess at typical output length for this kind
          // of request, and real output regularly runs longer than that guess — without
          // this, hitting the 96% cap while genuine text is still streaming in left the
          // bar pinned there for however long the rest of the generation actually took.
          // Growing the estimate once actual output catches up to it keeps the bar
          // honestly creeping forward instead of stalling.
          if(fullText.length > estimate * 0.9) estimate = estimate * 1.5;
          const elapsedSec = (Date.now()-startTime)/1000;
          const pct = Math.min(96, (fullText.length / estimate) * 100);
          let etaSec = null;
          if(fullText.length > 40 && elapsedSec > 0.4){
            const rate = fullText.length / elapsedSec;
            etaSec = Math.max(0, (estimate - fullText.length) / rate);
          }
          onProgress(pct, etaSec);
        }
      }
    }
  }
  if(onProgress) onProgress(100, null);
  return fullText;
}

async function fetchClaudeStreamWithToolsProgress(body, apiKey, estimatedOutputChars, onProgress){
  // Unlike fetchClaudeStreamWithProgress, a tool-enabled call (web_search) can produce
  // more than one text content block — e.g. brief text before a search, then the real
  // final answer after it — and only the LAST one is the actual result to parse; the
  // non-streaming version of this call always took the last block for exactly this
  // reason. So text is tracked per content-block index here, and only the final
  // non-empty block is returned, while progress is still estimated from the running
  // total across all of them (web_search is a server-side tool, so it executes and the
  // stream continues automatically — no separate client-side round trip is needed).
  const startTime = Date.now();
  let estimate = estimatedOutputChars;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ ...body, stream: true })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  const textBlocks = [];
  let totalLen = 0;
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n\n');
    buffer = parts.pop();
    for(const part of parts){
      const line = part.split('\n').find(l => l.startsWith('data: '));
      if(!line) continue;
      const dataStr = line.slice(6);
      if(dataStr === '[DONE]') continue;
      let evt;
      try{ evt = JSON.parse(dataStr); }catch(e){ continue; }
      if(evt.type === 'content_block_start' && evt.content_block && evt.content_block.type === 'text'){
        textBlocks[evt.index] = '';
      } else if(evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta'){
        const idx = evt.index;
        if(textBlocks[idx] === undefined) textBlocks[idx] = '';
        textBlocks[idx] += evt.delta.text;
        totalLen += evt.delta.text.length;
        if(onProgress){
          if(totalLen > estimate * 0.9) estimate = estimate * 1.5;
          const elapsedSec = (Date.now()-startTime)/1000;
          const pct = Math.min(96, (totalLen / estimate) * 100);
          let etaSec = null;
          if(totalLen > 40 && elapsedSec > 0.4){
            const rate = totalLen / elapsedSec;
            etaSec = Math.max(0, (estimate - totalLen) / rate);
          }
          onProgress(pct, etaSec);
        }
      }
    }
  }
  if(onProgress) onProgress(100, null);
  const nonEmpty = textBlocks.filter(t => t !== undefined);
  return nonEmpty.length ? nonEmpty[nonEmpty.length - 1] : '';
}

function showInlineBar(btn){
  // A small animated bar dropped in right after a "Generating..." button, for the many
  // single-request AI generation actions that don't have a real percentage to report.
  // No fabricated "time remaining" here — a single request with no progress signal has
  // no way to know how much work is left, so this shows honest elapsed time instead.
  const bar = document.createElement('div');
  bar.className = 'progress-bar-track inline-progress-bar';
  bar.innerHTML = '<div class="progress-bar-fill indeterminate"></div>';
  const timeEl = document.createElement('div');
  timeEl.className = 'mono';
  timeEl.style.cssText = 'font-size:10px;color:var(--ink-soft);margin-top:4px;';
  const start = Date.now();
  timeEl.textContent = 'Working...';
  const interval = setInterval(() => {
    timeEl.textContent = `Working... ${Math.round((Date.now()-start)/1000)}s`;
  }, 1000);
  btn.insertAdjacentElement('afterend', bar);
  bar.insertAdjacentElement('afterend', timeEl);
  return () => { clearInterval(interval); bar.remove(); timeEl.remove(); };
}

/* ============ SPACED REPETITION (Leitner system) ============ */
// Standard 5-box Leitner scheduling — correct recall promotes a term to a longer interval,
// a miss drops it back to box 1. Spacing + active recall is the best-evidenced method for
// durable term/definition memorization.
const LEITNER_INTERVALS = [1, 2, 4, 9, 21]; // days, indexed by box-1

function todayStr(){
  // Local date components, not toISOString() — that converts to UTC first, which for
  // anyone west of Greenwich using the app in the evening quietly returns tomorrow's
  // date instead of today's.
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function termKey(courseId, term, deck){
  const d = deck || 'term';
  // 'term' deck keeps the original key shape so existing vocabulary progress isn't disturbed.
  return d === 'term' ? (courseId + '::' + term.trim().toLowerCase()) : (d + '::' + courseId + '::' + term.trim().toLowerCase());
}
function getTermProgress(courseId, term, deck){
  return (state.termProgress || {})[termKey(courseId, term, deck)] || null;
}
function recordTermAnswer(courseId, term, definition, gotIt, deck){
  const key = termKey(courseId, term, deck);
  const existing = state.termProgress[key];
  const today = todayStr();
  // A box only advances once per calendar day — otherwise repeated correct answers
  // within one drilling session (Free Practice, requeue-on-miss) could rocket a term
  // straight to "Mastered" without it ever actually being tested across real days,
  // which is the whole point of spaced repetition. A miss still resets immediately;
  // only upward progress is capped.
  const advancedToday = existing && existing.lastAdvanceDate === today;
  let box;
  if(!gotIt){
    box = 1;
  } else if(advancedToday){
    box = existing.box;
  } else {
    box = Math.min((existing?.box||0) + 1, 5);
  }
  state.termProgress[key] = {
    courseId, term, definition,
    box,
    nextReview: addDays(today, LEITNER_INTERVALS[box-1]),
    lastReviewed: Date.now(),
    lastAdvanceDate: (gotIt && !advancedToday) ? today : (existing?.lastAdvanceDate || null),
    reviewCount: (existing?.reviewCount||0) + 1,
    updatedAt: Date.now(),
  };
  saveState(['termProgress']);
}
function recordTermTaught(courseId, term, definition, deck){
  // First-ever exposure to a term: teach it, don't quiz it yet. Lands in box 1,
  // due back tomorrow for its first real recall test.
  const key = termKey(courseId, term, deck);
  state.termProgress[key] = {
    courseId, term, definition,
    box: 1,
    nextReview: addDays(todayStr(), LEITNER_INTERVALS[0]),
    lastReviewed: Date.now(),
    lastAdvanceDate: todayStr(),
    reviewCount: 0,
    updatedAt: Date.now(),
  };
  saveState(['termProgress']);
}
function buildCaseCardPool(courseId){
  // Case-holdings flashcard pool: reuses the Case Law index, preferring a full brief's
  // issue/holding when one has been generated, otherwise falling back to the class description.
  return buildCaseLawIndex(courseId).map(c => {
    const brief = getCaseBrief(courseId, c.name);
    const answer = brief ? `Issue: ${brief.issue}\n\nHolding: ${brief.holding}` : `Holding (from class): ${c.description}`;
    return { term: c.name, definition: answer, sources: c.sources };
  });
}
function buildStudyQueue(courseId, prioritizeNew, deck, sourceFilter){
  const d = deck || 'term';
  const pool = courseId === '__master__' ? buildMasterDictionaryPool() : (d === 'case' ? buildCaseCardPool(courseId) : d === 'outline' ? buildOutlineFlashcardPool(courseId, sourceFilter) : buildDictionary(courseId));
  const today = todayStr();
  const withStatus = pool.map(item => {
    const progress = getTermProgress(item.courseId || courseId, item.term, d);
    const isNew = !progress;
    const isDue = !isNew && progress.nextReview <= today;
    return { ...item, progress, isNew, isDue };
  });
  const due = withStatus.filter(item => item.isDue);
  const fresh = withStatus.filter(item => item.isNew);
  due.sort((a,b) => (a.progress.nextReview).localeCompare(b.progress.nextReview));
  return prioritizeNew ? [...fresh, ...due] : [...due, ...fresh];
}
const MASTERY_LEVELS = [
  { label: 'New', percent: 4,  color: 'var(--oxblood)' },      // box 0 (never studied)
  { label: 'Learning', percent: 20, color: 'var(--oxblood)' }, // box 1
  { label: 'Familiar', percent: 40, color: 'var(--brass)' },   // box 2
  { label: 'Practiced', percent: 60, color: 'var(--brass)' },  // box 3
  { label: 'Confident', percent: 80, color: 'var(--brass)' },  // box 4
  { label: 'Mastered', percent: 100, color: 'var(--green-ok)' }, // box 5
];
function chooseBlankIndices(words, box){
  // Light support early on, nearly full recall once a term is mastered — the blanking
  // ratio scales with the same Leitner box used for scheduling.
  const proportions = [0.15, 0.15, 0.35, 0.55, 0.75, 0.95];
  const pct = proportions[Math.max(0, Math.min(5, box||0))];
  const nBlanks = Math.max(1, Math.round(words.length * pct));
  const eligible = words.map((w,i)=>i).filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= 3);
  const pool = (eligible.length >= nBlanks ? eligible : words.map((w,i)=>i)).slice();
  for(let i = pool.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return new Set(pool.slice(0, Math.min(nBlanks, pool.length)));
}
function buildBlankedHtml(words, blankSet){
  return words.map((w, i) => {
    if(!blankSet.has(i)) return escapeHtml(w);
    const widthCh = Math.max(3, w.replace(/[^a-zA-Z0-9]/g,'').length + 2);
    return `<input type="text" class="blank-input" data-idx="${i}" style="width:${widthCh}ch;border:none;border-bottom:2px solid var(--brass);background:transparent;font-family:'Source Serif 4',serif;font-size:15.5px;text-align:center;padding:0 2px;" autocomplete="off" spellcheck="false" />`;
  }).join(' ');
}

function computeWordDiff(userText, correctText){
  // Word-level LCS diff — shows exactly which words of the correct definition were
  // reproduced (in order) and which were missed or misworded, for verbatim practice.
  const clean = (w) => w.toLowerCase().replace(/[.,;:!?()'"]/g, '');
  const u = (userText||'').trim().split(/\s+/).filter(Boolean);
  const c = (correctText||'').trim().split(/\s+/).filter(Boolean);
  const m = u.length, n = c.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = clean(u[i-1]) === clean(c[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const matched = new Array(n).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(clean(u[i-1]) === clean(c[j-1])){ matched[j-1] = true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  const score = n>0 ? Math.round((matched.filter(Boolean).length/n)*100) : 100;
  return { correctWords: c, matched, score };
}

function masteryInfo(box){
  return MASTERY_LEVELS[Math.max(0, Math.min(5, box||0))];
}
function formatDictDate(value){
  if(!value) return null;
  // Lecture dates are stored as plain YYYY-MM-DD strings; custom-term timestamps are
  // millisecond numbers — this displays either sensibly.
  if(typeof value === 'number') return new Date(value).toLocaleDateString();
  return value;
}
function dictCreatedAtMs(value){
  // Normalizes both shapes createdAt can take (a YYYY-MM-DD lecture date, or a
  // millisecond timestamp for a custom term) into one comparable number for sorting.
  if(!value) return 0;
  if(typeof value === 'number') return value;
  const d = new Date(value + 'T00:00:00');
  return isNaN(d.getTime()) ? 0 : d.getTime();
}
function termStatusLabel(courseId, term, deck){
  const p = getTermProgress(courseId, term, deck);
  const m = masteryInfo(p ? p.box : 0);
  if(!p) return { ...m, sub: 'Not studied yet' };
  const today = todayStr();
  if(p.box >= 5) return { ...m, sub: `Next review ${p.nextReview}` };
  if(p.nextReview <= today) return { ...m, sub: 'Due for review' };
  return { ...m, sub: `Next review ${p.nextReview}` };
}

function capitalizeTerm(s){
  if(!s) return s;
  const trimmed = s.trim();
  // Every word gets its first letter capitalized and the rest lowercased — a full
  // Title Case normalization, not just the term's first word. This intentionally
  // overrides the earlier, narrower "single-word terms only" convention.
  return trimmed.split(' ').map(word =>
    word.length ? word.charAt(0).toUpperCase() + word.slice(1).toLowerCase() : word
  ).join(' ');
}

function buildDictionary(courseId){
  const map = {};
  const lectures = state.lectures
    .filter(l => l.courseId === courseId)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  lectures.forEach(l => {
    (l.keyTerms||[]).forEach(t => {
      if(!t.term || !t.term.trim()) return;
      const key = t.term.trim().toLowerCase();
      const existing = map[key];
      const sources = existing ? existing.sources : [];
      // Later lectures win on content — if a term comes up again, the newer explanation
      // usually reflects a more complete or refined understanding. Fields the newer
      // mention left blank fall back to whatever was captured before, so a thin second
      // mention doesn't erase a richer earlier one.
      map[key] = {
        term: capitalizeTerm(t.term.trim()),
        definition: t.definition || existing?.definition || '',
        context: t.context || existing?.context || null,
        usagePattern: t.usagePattern || existing?.usagePattern || null,
        sources,
        createdAt: existing ? existing.createdAt : (l.date || null),
        updatedAt: l.date || existing?.updatedAt || null,
      };
      map[key].sources.push({ lectureId: l.id, title: l.title, date: l.date });
    });
  });

  // Manual additions/edits always win — they're your professor's exact wording, and
  // regenerating a lecture should never silently overwrite something you fixed by hand.
  const customPrefix = courseId + '::';
  Object.entries(state.customTerms || {}).forEach(([storeKey, custom]) => {
    if(!storeKey.startsWith(customPrefix)) return;
    const key = storeKey.slice(customPrefix.length);
    if(map[key]){
      // Preserve whichever label is actually accurate — a term you added fresh should
      // keep saying so even if a later lecture happens to also mention that same name.
      // createdAt always stays as the original lecture-detection date — editing a term
      // doesn't change when you first encountered it — but updatedAt reflects the more
      // precise timestamp of the actual edit, which is more meaningful than a lecture's
      // plain class-date field.
      map[key] = {
        ...map[key],
        term: custom.term || map[key].term,
        definition: custom.definition,
        usagePattern: custom.usagePattern || map[key].usagePattern,
        context: custom.context || map[key].context,
        edited: !custom.manual,
        manual: !!custom.manual,
        updatedAt: custom.updatedAt || map[key].updatedAt,
      };
    } else {
      const sources = [{ lectureId: null, title: 'Added manually', date: null }];
      if(custom.foundInLecture){
        sources.push({ lectureId: custom.foundInLecture.lectureId, title: custom.foundInLecture.title, date: custom.foundInLecture.date });
      }
      map[key] = {
        term: custom.term, definition: custom.definition,
        context: custom.context || null, usagePattern: custom.usagePattern || null,
        sources,
        manual: true,
        createdAt: custom.createdAt || custom.updatedAt || null,
        updatedAt: custom.updatedAt || null,
      };
    }
  });

  // Deletions apply last, regardless of whether the term came from a lecture or was added by hand.
  Object.keys(map).forEach(key => {
    const record = (state.deletedTerms || {})[courseId + '::' + key];
    if(record && record.deleted) delete map[key];
  });

  return Object.values(map).sort((a,b) => a.term.localeCompare(b.term));
}

function customTermKey(courseId, term){
  return courseId + '::' + term.trim().toLowerCase();
}
function saveCustomTerm(courseId, term, definition, isManualAddition, extra){
  const key = customTermKey(courseId, term);
  // Saving a term is an explicit signal to un-delete it, in case this exact word was
  // previously removed (individually, or via a bulk clear) — otherwise the leftover
  // deletion tombstone would silently hide it again right after this save.
  const hadTombstone = !!(state.deletedTerms || {})[key]?.deleted;
  if(hadTombstone){
    state.deletedTerms = state.deletedTerms || {};
    state.deletedTerms[key] = { deleted: false, updatedAt: Date.now() };
  }
  const prev = state.customTerms[key];
  state.customTerms[key] = {
    term: term.trim(),
    definition: definition.trim(),
    manual: !!isManualAddition,
    usagePattern: (extra && extra.usagePattern !== undefined) ? (extra.usagePattern || null) : (prev?.usagePattern || null),
    context: (extra && extra.context !== undefined) ? (extra.context || null) : (prev?.context || null),
    foundInLecture: (extra && extra.foundInLecture !== undefined) ? extra.foundInLecture : (prev?.foundInLecture || null),
    createdAt: prev?.createdAt || Date.now(),
    updatedAt: Date.now(),
  };
  saveState(hadTombstone ? ['customTerms','deletedTerms'] : ['customTerms']);
}
function clearTermTombstone(courseId, term){
  // Used wherever the person explicitly chooses to (re-)add a term — approving it from
  // the "review new terms" checklist counts as that choice, the same as typing it into
  // "+ Add term" directly, even if this exact word was deleted at some point before.
  const key = customTermKey(courseId, term);
  if((state.deletedTerms || {})[key]?.deleted){
    state.deletedTerms[key] = { deleted: false, updatedAt: Date.now() };
  }
}
function deleteTermEverywhere(courseId, term){
  const key = customTermKey(courseId, term);
  state.deletedTerms = state.deletedTerms || {};
  state.deletedTerms[key] = { deleted: true, updatedAt: Date.now() };
  delete state.customTerms[key];
  delete state.termProgress[key]; // 'term' deck keys share this exact format
  saveState(['customTerms','termProgress','deletedTerms']);
}
function clearAutoDetectedTerms(courseId){
  const dict = buildDictionary(courseId);
  let count = 0;
  dict.forEach(d => {
    if(!d.manual && !d.edited){ deleteTermEverywhere(courseId, d.term); count++; }
  });
  return count;
}
function clearAllCustomTerms(courseId){
  const prefix = courseId + '::';
  let count = 0;
  Object.keys(state.customTerms || {}).forEach(key => {
    if(key.startsWith(prefix)){ delete state.customTerms[key]; count++; }
  });
  saveState(['customTerms']);
  return count;
}

function findTermContextInTranscripts(courseId, term){
  // Local, offline search across transcripts already sitting in memory — no API call.
  const cleanTerm = term.trim();
  if(!cleanTerm) return null;
  let re;
  try{
    re = new RegExp('\\b' + cleanTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  }catch(e){ return null; }
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && l.transcript)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  for(const l of lectures){
    if(!re.test(l.transcript)) continue;
    let sentences;
    try{
      sentences = l.transcript.split(/(?<=[.!?])\s+/);
    }catch(e){
      sentences = l.transcript.split('. ');
    }
    const match = sentences.find(s => re.test(s));
    if(match && match.trim()){
      return { context: match.trim(), lectureId: l.id, lectureTitle: l.title, lectureDate: l.date };
    }
  }
  return null;
}

async function generateUsagePattern(term, definition, apiKey){
  const prompt = `Give one short sentence (20 words or fewer) describing how the legal term "${term}" — defined as: "${definition}" — is typically used grammatically or in legal writing (common phrasing, collocations, or part of speech). Return ONLY that sentence. No quotes, no preamble, no extra commentary.`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 64000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join(' ').trim();
}

async function searchTranscriptsWithAI(courseId, term, definition, apiKey){
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && l.transcript)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if(lectures.length === 0) return { found: false };

  let combined = '';
  const included = [];
  for(const l of lectures){
    const block = `[LECTURE ${included.length+1}: "${l.title||'Untitled'}" (${l.date||'no date'})]\n${l.transcript}\n\n`;
    if(combined.length + block.length > 150000) break; // generous but bounded — a full semester of dense courses may not all fit in one pass
    combined += block;
    included.push(l);
  }

  const prompt = `A student is adding "${term}" (defined as: "${definition}") to their course dictionary. Below are transcripts from their actual class lectures, each tagged with a [LECTURE N: ...] marker. Even if the exact word "${term}" never appears, determine whether this concept was genuinely discussed under different phrasing, a synonym, or closely related wording — not just a loosely related topic.

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "found": true or false,
  "lectureIndex": the N from the matching [LECTURE N: ...] marker, or null if not found,
  "context": "the EXACT verbatim sentence(s), copied word-for-word from that transcript, where the concept is discussed — never a paraphrase or summary. Or null if not found."
}
Only set found:true if you're genuinely confident the concept itself is discussed, not just an adjacent or loosely related idea.

TRANSCRIPTS:
${combined}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 64000,
      temperature: 0.1,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  const parsed = JSON.parse(extractJSON(raw));
  if(!parsed.found || !parsed.lectureIndex) return { found: false };
  const lecture = included[parsed.lectureIndex - 1];
  if(!lecture || !parsed.context) return { found: false };
  return { found: true, context: parsed.context, lecture: { lectureId: lecture.id, title: lecture.title, date: lecture.date } };
}

function buildMasterDictionaryPool(){
  const pool = [];
  state.courses.filter(c => !c.archived).forEach(course => {
    buildDictionary(course.id).forEach(d => {
      pool.push({ ...d, courseId: course.id, courseName: course.name });
    });
  });
  return pool.sort((a,b) => a.term.localeCompare(b.term));
}

  {

    template: 'Does [A: doctrine] apply/justify/excuse [B: the specific act] when [C: the specific consequence/circumstance]?',
    checks: [
      { l: 'A', q: 'Is this a label, not a question or remedy?' },
      { l: 'B', q: 'Is this an action, not an outcome?' },
      { l: 'C', q: 'Is this a debatable circumstance, not the injury itself?' },

    example: 'Does [A: false imprisonment] apply to [B: Cindy\'s locking of the bathroom door] when [C: Martha never became aware the door was locked until after it had already been reopened]?',
  },

    template: '[A: doctrine] requires (1) [B: element], (2) [B: element], (3) [B: element]... [C: any qualifier/limitation/split that changes how the doctrine applies].',
    checks: [
      { l: 'A', q: 'Is this a bare doctrine name with zero case facts attached?' },
      { l: 'B', q: 'Is each element atomic (one legal requirement per number), not two elements fused into one clause?' },
      { l: 'C', q: 'Is there a limitation, exception, or jurisdictional split you need to flag now, before Analysis, so you don\'t discover it mid-argument?' },
    ],
    example: '[A: False imprisonment] requires (1) [B: an intentional act of restraint], (2) [B: confinement to a bounded area with no reasonable means of escape known to the plaintiff], (3) [B: the plaintiff\'s awareness of the confinement, or resulting harm]. [C: Under the majority/Restatement view, awareness must exist during the confinement — learning of it only afterward does not satisfy this element].',
  },

    template: '[A: the specific fact] [B: satisfies/fails] [C: the named element], because [D: the reasoning connecting them].',
    checks: [

      { l: 'B', q: 'Did you commit to a direction (satisfies or fails), rather than just describing the fact and hoping the connection is obvious?' },
      { l: 'C', q: 'Did you name the exact element from your Rule list, not the doctrine as a whole?' },
      { l: 'D', q: 'Does "because" introduce actual reasoning, not just a repeat of the fact?' },
    ],
    example: '[A: Martha did not know the door was locked at any point during the five minutes it was engaged], which [B: fails] [C: the awareness element], because [D: the Restatement requires the plaintiff be aware of the confinement while it is occurring, not learn of it afterward — and Martha only learned of the lock after Cindy had already undone it].',
  },
  {
    part: 'Conclusion',
    template: '[A: party] [B: does/does not satisfy the doctrine], because [C: the single controlling element].',
    checks: [
      { l: 'A', q: 'Named party, not "the defendant" vaguely?' },
      { l: 'B', q: 'A clear yes/no or partial verdict, no hedging language like "it could be argued"?' },
      { l: 'C', q: 'One element only — the one that actually decided it, not a summary of all of them?' },
    ],
    example: '[A: Martha] [B: does not satisfy the false imprisonment claim], because [C: she lacked contemporaneous awareness of the confinement].',
  },
];

// The paragraph-by-paragraph formula for writing the full essay body, continuing the
// exact same fact pattern used in FIRAC_GUIDE above so the two guides read as one
// continuous piece — from issue statement all the way to a finished essay.
// Templates here use plain placeholder names ([Plaintiff], [Tort]...) rather than
// lettered tags like FIRAC_GUIDE's do, so coloring them means wrapping each whole
// sentence in its color at render time — segments, not a find-and-replace regex —
// which keeps the original formula wording completely untouched.
function renderTaggedTemplate(segments){
  // Two layers: the outer color still marks which move/sentence this is (matching the
  // A-E legend in the explanation above), while each individual bracketed placeholder
  // within that sentence is bolded and underlined — a second, finer level of structure
  // without needing an entirely separate color palette that would just compete with
  // the first one for attention.
  return segments.map(seg => {
    const highlighted = escapeHtml(seg.text).replace(/\[([^\]]+)\]/g, '<b style="text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px;">[$1]</b>');
    return seg.letter ? `<span class="firac-tag firac-tag-${seg.letter.toLowerCase()}">${highlighted}</span>` : highlighted;
  }).join('');
}

    explanation: 'Transferred intent isn\'t a fifth element or a separate claim — it\'s a way of satisfying the intent element when the defendant meant to act against one person or tort but a different person or tort resulted. Fold it directly into the same five-move paragraph from Part 2, right where <span class="firac-tag firac-tag-d">D</span> connects the facts to the definition.',
    example: '[A: The first element is intent]. [B: Intent means the defendant acted with the purpose of causing a harmful or offensive contact, or with knowledge that such contact was substantially certain to result]. [C: Here, Cindy intended to splash paint on Ben, but the paint instead struck Ana when Ana stepped between them]. [D: Because intent transfers both between torts and between victims, Cindy\'s intent to commit a harmful contact against Ben satisfies the intent element for her contact with Ana]. [E: This element is met].',
  },
];

function highlightFiracTags(text){
  return escapeHtml(text).replace(/\[([A-E]):\s*([^\]]+)\]/g, (m, letter, content) =>
    `<span class="firac-tag firac-tag-${letter.toLowerCase()}">[${letter}: ${content}]</span>`
  );
}

  {
