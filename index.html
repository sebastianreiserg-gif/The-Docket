<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Docket</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F2733" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE3;
    --paper-raised:#FAF7F0;
    --ink:#1F2733;
    --ink-soft:#5C6773;
    --rule:#CBBFA6;
    --oxblood:#7C2D2D;
    --oxblood-dark:#5E2121;
    --brass:#A98544;
    --green-ok:#3E5C3E;
    --shadow: 0 1px 2px rgba(31,39,51,0.08), 0 4px 14px rgba(31,39,51,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      linear-gradient(var(--paper), var(--paper));
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:0.035;
    background-image:radial-gradient(circle at 1px 1px, #1F2733 1px, transparent 0);
    background-size:22px 22px;
    z-index:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Libre Caslon Display', 'Source Serif 4', serif;}

  #app{position:relative;z-index:1;display:flex;min-height:100vh;}

  /* Sidebar — case-file tabs */
  .sidebar{
    width:230px;flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--rule);
    display:flex;flex-direction:column;
    padding:22px 0 16px;
  }
  .brand{
    padding:0 20px 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:10px;
  }
  .brand .display{font-size:22px;letter-spacing:0.3px;line-height:1.15;}
  .brand .mono{font-size:10px;color:var(--ink-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}

  .course-tab{
    position:relative;
    padding:13px 20px 13px 24px;
    cursor:pointer;
    border-bottom:1px solid rgba(203,191,166,0.5);
    transition:background 0.15s ease;
  }
  .course-tab:hover{background:rgba(122,45,45,0.05);}
  .course-tab.active{background:var(--paper);}
  .course-tab.active::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--oxblood);
  }
  .course-tab .name{font-size:15px;font-weight:600;display:block;}
  .course-tab .count{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  .add-course{
    padding:11px 20px 11px 24px;
    font-size:13px;color:var(--ink-soft);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .add-course:hover{color:var(--oxblood);}

  .sidebar-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--rule);}
  .settings-btn{
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink-soft);cursor:pointer;padding:8px 0;
  }
  .settings-btn:hover{color:var(--ink);}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    padding:24px 32px 16px;
    border-bottom:1px solid var(--rule);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;row-gap:14px;
  }
  .topbar h1{margin:0;font-size:28px;font-weight:400;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:4px;text-transform:uppercase;letter-spacing:1px;}

  .ref-strip{
    padding:12px 32px;
    border-bottom:1px solid var(--rule);
    background:var(--paper-raised);
    display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;row-gap:10px;
  }
  .ref-strip-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--ink-soft);white-space:nowrap;
  }
  .ref-tabs{display:flex;border:1px solid var(--rule);background:var(--paper);flex-wrap:wrap;}
  .ref-tab{
    display:flex;align-items:center;gap:7px;
    padding:8px 16px;border:none;border-right:1px solid var(--rule);
    background:transparent;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.3px;
    color:var(--ink-soft);
  }
  .ref-tab:last-child{border-right:none;}
  .ref-tab:hover{background:rgba(122,45,45,0.06);color:var(--oxblood);}
  .ref-tab-icon{color:var(--brass);font-size:13px;}
  .ref-tab:hover .ref-tab-icon{color:var(--oxblood);}

  .searchwrap{position:relative;flex:1 1 160px;min-width:140px;max-width:260px;}
  .searchwrap input{
    width:100%;padding:9px 12px 9px 30px;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    color:var(--ink);
  }
  .searchwrap input:focus{outline:2px solid var(--oxblood);outline-offset:-1px;}
  .searchwrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:13px;}

  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    padding:10px 16px;border:1px solid var(--oxblood);
    background:var(--oxblood);color:var(--paper-raised);
    cursor:pointer;letter-spacing:0.3px;
  }
  .btn:hover{background:var(--oxblood-dark);}
  .btn.ghost{background:transparent;color:var(--oxblood);}
  .btn.ghost:hover{background:rgba(122,45,45,0.08);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .content{flex:1;overflow-y:auto;padding:24px 32px 60px;}

  .empty{
    margin-top:60px;text-align:center;color:var(--ink-soft);
  }
  .empty .display{font-size:20px;color:var(--ink);margin-bottom:6px;}

  .docket-list{display:flex;flex-direction:column;gap:10px;}
  .entry{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-left:3px solid var(--brass);
    padding:14px 18px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;
    box-shadow:var(--shadow);
  }
  .entry:hover{border-left-color:var(--oxblood);}
  .entry .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.5px;}
  .entry .title{font-size:16px;margin:2px 0 4px;}
  .entry .meta{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .entry .status{font-size:10.5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.8px;padding:3px 8px;border:1px solid var(--rule);white-space:nowrap;}
  .status.ready{color:var(--green-ok);border-color:var(--green-ok);}
  .status.working{color:var(--brass);border-color:var(--brass);}
  .status.error{color:var(--oxblood);border-color:var(--oxblood);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(31,39,51,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal.wide{max-width:760px;}
  .modal-head{
    padding:20px 24px;border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h2{margin:0;font-size:20px;font-weight:400;}
  .modal-close{cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
  .modal-close:hover{color:var(--oxblood);}
  .modal-body{padding:22px 24px;}

  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);margin:16px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=password], select, textarea{
    width:100%;padding:10px 12px;
    background:var(--paper);border:1px solid var(--rule);
    font-family:'Source Serif 4',serif;font-size:14.5px;color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--oxblood);outline-offset:-1px;}
  .filepick{
    border:1.5px dashed var(--rule);padding:22px;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);
    cursor:pointer;
  }
  .filepick:hover{border-color:var(--oxblood);color:var(--ink);}
  .filepick.has-file{border-style:solid;color:var(--ink);}

  .mode-row{display:flex;gap:10px;margin-top:6px;}
  .mode-opt{
    flex:1;padding:10px 12px;border:1px solid var(--rule);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;
  }
  .mode-opt.sel{border-color:var(--oxblood);background:rgba(122,45,45,0.06);color:var(--oxblood);}

  .progress{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .dot{width:6px;height:6px;background:var(--brass);border-radius:50%;animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}

  .modal-foot{padding:16px 24px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;}

  /* Detail view */
  .detail-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--brass);border-bottom:1px solid var(--rule);padding-bottom:6px;margin:22px 0 12px;}
  .section-label:first-of-type{margin-top:0;}
  .summary-body{font-size:15.5px;line-height:1.7;white-space:pre-wrap;}
  .transcript-body{font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--ink-soft);max-height:340px;overflow-y:auto;background:var(--paper);padding:14px;border:1px solid var(--rule);}

  .help{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .err-box{background:rgba(122,45,45,0.08);border:1px solid var(--oxblood);color:var(--oxblood-dark);padding:10px 12px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-top:12px;}

  @media (max-width:720px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px 0;}
    .brand{display:none;}
    .sidebar-foot{margin-top:0;border-top:none;border-left:1px solid var(--rule);padding:0 16px;}
    .course-tab{white-space:nowrap;border-bottom:none;}
    .topbar{flex-direction:column;align-items:stretch;}
    .ref-strip{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 16px;}
    .ref-tabs{width:100%;}
    .ref-tab{flex:1;justify-content:center;}
    .searchwrap input{width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ STATE ============ */
const DEFAULT_COURSES = [
  { id: 'torts', name: 'Torts' },
  { id: 'prof-id', name: 'Professional Identity' },
  { id: 'lrw', name: 'Legal Research & Writing' },
];

function mergeTermArrays(oldArr, newArr){
  // Regenerating shouldn't lose terms just because this run's extraction judgment call
  // landed slightly differently — merge by term name instead of overwriting outright.
  const map = {};
  (oldArr||[]).forEach(t => { if(t && t.term) map[t.term.trim().toLowerCase()] = t; });
  (newArr||[]).forEach(t => { if(t && t.term) map[t.term.trim().toLowerCase()] = t; }); // fresher data wins on overlap
  return Object.values(map);
}
function mergeCaseArrays(oldArr, newArr){
  const map = {};
  (oldArr||[]).forEach(c => { if(c && c.name) map[c.name.trim().toLowerCase()] = c; });
  (newArr||[]).forEach(c => { if(c && c.name) map[c.name.trim().toLowerCase()] = c; });
  return Object.values(map);
}

function normalizeLectures(lectures){
  return (lectures||[]).map(l => {
    // Migrate old string-based todos (pre-checklist format) into structured items.
    if(typeof l.todos === 'string'){
      const lines = l.todos.split('\n').map(s => s.replace(/^[-•*\s]+/, '').trim()).filter(Boolean);
      const useful = lines.filter(s => !/^no action items/i.test(s));
      l.todos = useful.map((text, i) => ({ id: 't_migrated_' + l.id + '_' + i, text, dueDate: null, done: false }));
    }
    if(!Array.isArray(l.todos)) l.todos = [];
    l.todos = l.todos.map((t, i) => ({
      id: t.id || ('t_migrated_' + l.id + '_' + i),
      text: t.text || '',
      dueDate: t.dueDate || null,
      done: !!t.done
    }));

    if(!Array.isArray(l.caseLaw)) l.caseLaw = [];
    l.caseLaw = l.caseLaw.map(c => ({ ...c, citation: c && c.citation ? c.citation : null }));

    if(!Array.isArray(l.keyTerms)) l.keyTerms = [];
    if(typeof l.keyPoints !== 'string') l.keyPoints = l.keyPoints ? String(l.keyPoints) : '';
    if(typeof l.policyNotes !== 'string') l.policyNotes = l.policyNotes ? String(l.policyNotes) : '';

    return l;
  });
}

function loadState(){
  let courses, lectures, settings, deletedLectureIds, termProgress, caseBriefs, courseDocs, customTerms;
  try { courses = JSON.parse(localStorage.getItem('docket:courses')) || DEFAULT_COURSES; } catch(e){ courses = DEFAULT_COURSES; }
  try { lectures = JSON.parse(localStorage.getItem('docket:lectures')) || []; } catch(e){ lectures = []; }
  try { settings = JSON.parse(localStorage.getItem('docket:settings')) || {}; } catch(e){ settings = {}; }
  try { deletedLectureIds = JSON.parse(localStorage.getItem('docket:deleted')) || []; } catch(e){ deletedLectureIds = []; }
  try { termProgress = JSON.parse(localStorage.getItem('docket:termProgress')) || {}; } catch(e){ termProgress = {}; }
  try { caseBriefs = JSON.parse(localStorage.getItem('docket:caseBriefs')) || {}; } catch(e){ caseBriefs = {}; }
  try { courseDocs = JSON.parse(localStorage.getItem('docket:courseDocs')) || {}; } catch(e){ courseDocs = {}; }
  try { customTerms = JSON.parse(localStorage.getItem('docket:customTerms')) || {}; } catch(e){ customTerms = {}; }
  settings.mode = settings.mode || 'local';
  settings.deepgramKey = settings.deepgramKey || '';
  settings.anthropicKey = settings.anthropicKey || '';
  settings.githubToken = settings.githubToken || '';
  settings.gistId = settings.gistId || '';
  settings.lastSync = settings.lastSync || 0;
  lectures = normalizeLectures(lectures);
  return { courses, lectures, settings, deletedLectureIds, termProgress, caseBriefs, courseDocs, customTerms };
}
function saveState(){
  localStorage.setItem('docket:courses', JSON.stringify(state.courses));
  localStorage.setItem('docket:lectures', JSON.stringify(state.lectures));
  localStorage.setItem('docket:settings', JSON.stringify(state.settings));
  localStorage.setItem('docket:deleted', JSON.stringify(state.deletedLectureIds||[]));
  localStorage.setItem('docket:termProgress', JSON.stringify(state.termProgress||{}));
  localStorage.setItem('docket:caseBriefs', JSON.stringify(state.caseBriefs||{}));
  localStorage.setItem('docket:customTerms', JSON.stringify(state.customTerms||{}));
  localStorage.setItem('docket:courseDocs', JSON.stringify(state.courseDocs||{}));
}

let state = loadState();
let ui = {
  activeCourse: state.courses[0]?.id || null,
  search: '',
  showUpload: false,
  showSettings: false,
  openLecture: null, // lecture id
};

let localTranscriberPromise = null; // cache the loaded pipeline

/* ============ RENDER ============ */
function render(){
  document.querySelectorAll('.overlay').forEach(el => el.remove());
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderSidebar()}
    ${renderMain()}
  `;
  wireEvents();
  if(ui.showUpload) renderUploadModal();
  if(ui.showSettings) renderSettingsModal();
  if(ui.openLecture) renderDetailModal();
}

function renderSidebar(){
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="display">The Docket</div>
      <div class="mono">Lecture Record &amp; Brief</div>
    </div>
    ${state.courses.map(c => {
      const count = state.lectures.filter(l => l.courseId === c.id).length;
      return `<div class="course-tab ${ui.activeCourse===c.id?'active':''}" data-course="${c.id}">
        <span class="name">${escapeHtml(c.name)}</span>
        <span class="count">${count} ${count===1?'entry':'entries'}</span>
      </div>`;
    }).join('')}
    <div class="add-course" id="addCourseBtn">+ add course</div>
    <div class="sidebar-foot">
      <div class="settings-btn" id="openSettings">&#9881; Settings</div>
    </div>
  </div>`;
}

function renderMain(){
  const course = state.courses.find(c => c.id === ui.activeCourse);
  const q = ui.search.trim().toLowerCase();
  let lectures = state.lectures.filter(l => l.courseId === ui.activeCourse);
  if(q){
    lectures = state.lectures.filter(l =>
      (l.title||'').toLowerCase().includes(q) ||
      (l.transcript||'').toLowerCase().includes(q) ||
      (l.summary||'').toLowerCase().includes(q)
    );
  }
  lectures = lectures.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));

  return `
  <div class="main">
    <div class="topbar">
      <div>
        <h1>${q ? 'Search results' : escapeHtml(course ? course.name : 'All courses')}</h1>
        <div class="sub">${q ? escapeHtml(ui.search) : (state.settings.mode==='local' ? 'Local transcription mode' : 'Cloud transcription mode')}</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <div class="searchwrap">
          <span class="icon">&#9906;</span>
          <input type="text" id="searchInput" placeholder="Search all transcripts..." value="${escapeAttr(ui.search)}" />
        </div>
        ${state.settings.githubToken ? `<button class="btn ghost" id="quickSyncBtn" title="${state.settings.lastSync ? 'Last synced ' + new Date(state.settings.lastSync).toLocaleString() : 'Not synced yet'}">&#8635; Sync</button>` : ''}
        <button class="btn" id="newLectureBtn">+ New Recording</button>
      </div>
    </div>
    ${ui.activeCourse && !q ? `
    <div class="ref-strip">
      <span class="ref-strip-label">Course reference</span>
      <div class="ref-tabs">
        <button class="ref-tab" id="openDictionary"><span class="ref-tab-icon">&sect;</span>Dictionary</button>
        <button class="ref-tab" id="openCaseLaw"><span class="ref-tab-icon">&#9878;</span>Case Law</button>
        <button class="ref-tab" id="openTodos"><span class="ref-tab-icon">&#9745;</span>To-Dos</button>
      </div>
      <div class="ref-tabs">
        <button class="ref-tab" id="openPolicyNotes"><span class="ref-tab-icon">&#9737;</span>Policy Notes</button>
        <button class="ref-tab" id="openPractice"><span class="ref-tab-icon">&#9998;</span>Practice</button>
        <button class="ref-tab" id="openWritingFeedback"><span class="ref-tab-icon">&#9997;</span>Writing Feedback</button>
      </div>
      <div class="ref-tabs">
        <button class="ref-tab" id="openOutline"><span class="ref-tab-icon">&#9776;</span>Outline</button>
        <button class="ref-tab" id="openRuleBank"><span class="ref-tab-icon">&#9873;</span>Rule Bank</button>
      </div>
    </div>
    ` : ''}
    <div class="content">
      ${lectures.length === 0 ? `
        <div class="empty">
          <div class="display">${q ? 'Nothing found' : 'No entries yet'}</div>
          <div>${q ? 'Try a different search term.' : 'Upload a class recording to begin the docket for this course.'}</div>
        </div>
      ` : `
        <div class="docket-list">
          ${lectures.map(l => renderEntry(l, q)).join('')}
        </div>
      `}
    </div>
  </div>`;
}

function docketNumber(lecture){
  const course = state.courses.find(c=>c.id===lecture.courseId);
  const prefix = (course ? course.name : 'GEN').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3);
  const siblings = state.lectures.filter(l=>l.courseId===lecture.courseId).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const idx = siblings.findIndex(l=>l.id===lecture.id) + 1;
  return `${prefix}-${String(idx).padStart(3,'0')}`;
}

function renderEntry(l, q){
  const statusClass = l.status === 'ready' ? 'ready' : (l.status === 'error' ? 'error' : 'working');
  const statusText = l.status === 'ready' ? 'Transcribed' : (l.status === 'error' ? 'Failed' : 'Processing');
  return `
  <div class="entry" data-lecture="${l.id}">
    <div>
      <div class="num">${docketNumber(l)}${q ? ' &middot; ' + escapeHtml(state.courses.find(c=>c.id===l.courseId)?.name || '') : ''}</div>
      <div class="title">${escapeHtml(l.title || 'Untitled recording')}</div>
      <div class="meta">${l.date || ''}${l.durationLabel ? ' &middot; ' + l.durationLabel : ''}</div>
    </div>
    <div class="status ${statusClass}">${statusText}</div>
  </div>`;
}

/* ============ MODALS ============ */
function renderUploadModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'uploadOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>New Recording</h2>
        <button class="modal-close" id="closeUpload">&times;</button>
      </div>
      <div class="modal-body">
        <label>Course</label>
        <select id="fCourse">
          ${state.courses.map(c=>`<option value="${c.id}" ${c.id===ui.activeCourse?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>

        <label>Title</label>
        <input type="text" id="fTitle" placeholder="e.g. Duty of Care &mdash; Palsgraf" />

        <label>Date</label>
        <input type="date" id="fDate" value="${new Date().toISOString().slice(0,10)}" />

        <label>Video or audio file</label>
        <div class="filepick" id="filePick">Click to choose a file, or drag one here — video or audio (MP4, MOV, MP3, M4A, WAV, AAC, etc.)</div>
        <input type="file" id="fFile" accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mp3,.m4a,.wav,.aac,.ogg,.flac" style="display:none" />

        <label>Transcription mode</label>
        <div class="mode-row">
          <div class="mode-opt ${state.settings.mode==='local'?'sel':''}" data-mode="local">Local (free, in-browser)</div>
          <div class="mode-opt ${state.settings.mode==='cloud'?'sel':''}" data-mode="cloud">Cloud (Deepgram key)</div>
        </div>
        <div class="help" id="modeHelp"></div>

        <div id="uploadProgress"></div>
        <div id="uploadError"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="cancelUpload">Cancel</button>
        <button class="btn" id="startTranscribe">Transcribe</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('closeUpload').onclick = () => { ui.showUpload = false; overlay.remove(); };
  document.getElementById('cancelUpload').onclick = () => { ui.showUpload = false; overlay.remove(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ ui.showUpload=false; overlay.remove(); }});

  const filePick = document.getElementById('filePick');
  const fFile = document.getElementById('fFile');
  filePick.onclick = () => fFile.click();
  fFile.onchange = () => {
    if(fFile.files[0]){
      filePick.textContent = fFile.files[0].name;
      filePick.classList.add('has-file');
    }
  };
  filePick.addEventListener('dragover', (e) => { e.preventDefault(); filePick.style.borderColor = 'var(--oxblood)'; });
  filePick.addEventListener('dragleave', () => { filePick.style.borderColor = ''; });
  filePick.addEventListener('drop', (e) => {
    e.preventDefault();
    filePick.style.borderColor = '';
    const dropped = e.dataTransfer.files[0];
    if(dropped){
      const dt = new DataTransfer();
      dt.items.add(dropped);
      fFile.files = dt.files;
      filePick.textContent = dropped.name;
      filePick.classList.add('has-file');
    }
  });

  let chosenMode = state.settings.mode;
  updateModeHelp();
  overlay.querySelectorAll('.mode-opt').forEach(el=>{
    el.onclick = () => {
      chosenMode = el.dataset.mode;
      overlay.querySelectorAll('.mode-opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      updateModeHelp();
    };
  });
  function updateModeHelp(){
    const helpEl = document.getElementById('modeHelp');
    if(chosenMode==='local'){
      helpEl.textContent = 'Runs entirely in your browser. First use downloads a ~150MB speech model. Slower, but free and fully private. Needs a WebGPU-capable browser (recent Chrome or Edge) for reasonable speed.';
    } else {
      helpEl.textContent = state.settings.deepgramKey
        ? 'Sends audio to Deepgram using your saved API key. Faster and more accurate.'
        : 'No Deepgram key saved yet — add one in Settings first.';
    }
  }

  document.getElementById('startTranscribe').onclick = async () => {
    const courseId = document.getElementById('fCourse').value;
    const title = document.getElementById('fTitle').value.trim() || 'Untitled recording';
    const date = document.getElementById('fDate').value;
    const file = fFile.files[0];
    const errEl = document.getElementById('uploadError');
    const progEl = document.getElementById('uploadProgress');
    errEl.innerHTML = '';

    if(!file){ errEl.innerHTML = `<div class="err-box">Choose a file first.</div>`; return; }
    if(chosenMode==='cloud' && !state.settings.deepgramKey){ errEl.innerHTML = `<div class="err-box">Add a Deepgram API key in Settings, or switch to Local mode.</div>`; return; }

    document.getElementById('startTranscribe').disabled = true;
    document.getElementById('cancelUpload').disabled = true;

    const lecture = {
      id: 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      courseId, title, date,
      status: 'working',
      transcript: '', keyPoints: '', caseLaw: [], todos: [], keyTerms: [], policyNotes: '',
      durationLabel: '',
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    state.lectures.push(lecture);
    saveState();

    try{
      setProgress(progEl, 'Decoding audio track...');
      const { float32, sampleRate, durationSec } = await decodeAndResample(file);
      lecture.durationLabel = formatDuration(durationSec);

      let transcript;
      if(chosenMode==='local'){
        setProgress(progEl, 'Loading local speech model (first run may take a minute)...');
        transcript = await localTranscribe(float32, sampleRate, (msg)=>setProgress(progEl, msg));
      } else {
        setProgress(progEl, 'Uploading to Deepgram...');
        const wavBlob = encodeWAV(float32, sampleRate);
        transcript = await cloudTranscribe(wavBlob, state.settings.deepgramKey);
      }

      lecture.transcript = transcript;
      lecture.status = 'ready';
      lecture.updatedAt = Date.now();
      saveState();

      if(state.settings.anthropicKey && transcript && transcript.trim()){
        setProgress(progEl, 'Generating notes, case law citations, and to-dos...');
        try{
          const courseName = state.courses.find(c=>c.id===courseId)?.name || '';
          const docs = await generateDocs(transcript, state.settings.anthropicKey, courseName, date);
          lecture.keyPoints = docs.keyPoints;
          lecture.caseLaw = mergeCaseArrays(lecture.caseLaw, docs.caseLaw);
          lecture.todos = docs.todos;
          lecture.keyTerms = mergeTermArrays(lecture.keyTerms, docs.keyTerms);
          lecture.policyNotes = docs.policyNotes;
          lecture.updatedAt = Date.now();
          saveState();
        }catch(e){
          console.error(e);
          // doc generation failure shouldn't block the transcript being saved
        }
      }

      if(state.settings.githubToken){
        setProgress(progEl, 'Syncing to your other devices...');
        try{ await syncNow(); }catch(e){ console.error('Sync failed', e); }
      }

      ui.showUpload = false;
      overlay.remove();
      ui.activeCourse = courseId;
      ui.openLecture = lecture.id;
      render();
    }catch(e){
      console.error(e);
      lecture.status = 'error';
      lecture.updatedAt = Date.now();
      saveState();
      errEl.innerHTML = `<div class="err-box">${escapeHtml(e.message || 'Something went wrong during transcription.')}</div>`;
      document.getElementById('startTranscribe').disabled = false;
      document.getElementById('cancelUpload').disabled = false;
      progEl.innerHTML = '';
    }
  };
}

function setProgress(el, msg){
  el.innerHTML = `<div class="progress"><span class="dot"></span>${escapeHtml(msg)}</div>`;
}

    close();
    render();

    const btn = document.getElementById('syncNowBtn');

    const errEl = document.getElementById('syncError');

    state.settings.githubToken = document.getElementById('sGithubToken').value.trim();
    state.settings.gistId = document.getElementById('sGistId').value.trim();

      errEl.innerHTML = `<div class="err-box">${escapeHtml(e.message)}</div>`;

    btn.disabled = false;

  document.getElementById('downloadBackupBtn').onclick = () => {

      exportedAt: new Date().toISOString(),
      courses: state.courses,
      lectures: state.lectures,
      termProgress: state.termProgress,
      caseBriefs: state.caseBriefs,
      courseDocs: state.courseDocs,
      deletedLectureIds: state.deletedLectureIds,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `docket-backup-${todayStr()}.json`;
    a.click();
  };
  const restoreInput = document.getElementById('restoreFileInput');
  document.getElementById('restoreBackupBtn').onclick = () => restoreInput.click();
  restoreInput.onchange = () => {
    const file = restoreInput.files[0];
    if(!file) return;
    const errEl = document.getElementById('restoreError');
    errEl.innerHTML = '';
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        if(!confirm('This will REPLACE all courses, lectures, and progress currently in this browser with the contents of this backup file. This cannot be undone. Continue?')) return;
        state.courses = data.courses || DEFAULT_COURSES;
        state.lectures = normalizeLectures(data.lectures || []);
        state.termProgress = data.termProgress || {};
        state.caseBriefs = data.caseBriefs || {};
        state.courseDocs = data.courseDocs || {};
        state.deletedLectureIds = data.deletedLectureIds || [];
        saveState();
        if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
        alert('Backup restored.');
        close();
        render();
      }catch(e){
        errEl.innerHTML = `<div class="err-box">Could not read that file: ${escapeHtml(e.message)}</div>`;
      }
    };
    reader.readAsText(file);
  };
}

  if(clearTermsBtn){
    clearTermsBtn.onclick = async () => {
      if(!confirm(`Clear all ${lecture.keyTerms.length} key term(s) from this lecture and generate a fresh set? This can't be undone.`)) return;
      clearTermsBtn.disabled = true;
      clearTermsBtn.textContent = 'Regenerating...';
      try{
        lecture.keyTerms = [];
        const docs = await generateDocs(lecture.transcript, state.settings.anthropicKey, course?course.name:'', lecture.date);
        lecture.keyPoints = docs.keyPoints;

        lecture.todos = docs.todos;
        lecture.keyTerms = docs.keyTerms; // fresh set, nothing to merge against
        lecture.policyNotes = docs.policyNotes;
        lecture.updatedAt = Date.now();
        saveState();
        render();
        if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      }catch(e){
        alert('Could not regenerate: ' + e.message);
        clearTermsBtn.disabled = false;
        clearTermsBtn.textContent = 'Clear terms & regenerate';
      }
    };
  }
}

/* ============ SPACED REPETITION (Leitner system) ============ */
// Standard 5-box Leitner scheduling — correct recall promotes a term to a longer interval,
// a miss drops it back to box 1. Spacing + active recall is the best-evidenced method for
// durable term/definition memorization.
const LEITNER_INTERVALS = [1, 2, 4, 9, 21]; // days, indexed by box-1

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function termKey(courseId, term, deck){
  const d = deck || 'term';
  // 'term' deck keeps the original key shape so existing vocabulary progress isn't disturbed.
  return d === 'term' ? (courseId + '::' + term.trim().toLowerCase()) : (d + '::' + courseId + '::' + term.trim().toLowerCase());
}
function getTermProgress(courseId, term, deck){
  return (state.termProgress || {})[termKey(courseId, term, deck)] || null;
}
function recordTermAnswer(courseId, term, definition, gotIt, deck){
  const key = termKey(courseId, term, deck);
  const existing = state.termProgress[key];
  const box = gotIt ? Math.min((existing?.box||0) + 1, 5) : 1;
  state.termProgress[key] = {
    courseId, term, definition,
    box,
    nextReview: addDays(todayStr(), LEITNER_INTERVALS[box-1]),
    lastReviewed: Date.now(),
    reviewCount: (existing?.reviewCount||0) + 1,
    updatedAt: Date.now(),
  };
  saveState();
}
function recordTermTaught(courseId, term, definition, deck){
  // First-ever exposure to a term: teach it, don't quiz it yet. Lands in box 1,
  // due back tomorrow for its first real recall test.
  const key = termKey(courseId, term, deck);
  state.termProgress[key] = {
    courseId, term, definition,
    box: 1,
    nextReview: addDays(todayStr(), LEITNER_INTERVALS[0]),
    lastReviewed: Date.now(),
    reviewCount: 0,
    updatedAt: Date.now(),
  };
  saveState();
}
function buildCaseCardPool(courseId){
  // Case-holdings flashcard pool: reuses the Case Law index, preferring a full brief's
  // issue/holding when one has been generated, otherwise falling back to the class description.
  return buildCaseLawIndex(courseId).map(c => {
    const brief = getCaseBrief(courseId, c.name);
    const answer = brief ? `Issue: ${brief.issue}\n\nHolding: ${brief.holding}` : `Holding (from class): ${c.description}`;
    return { term: c.name, definition: answer, sources: c.sources };
  });
}
function buildStudyQueue(courseId, prioritizeNew, deck){
  const d = deck || 'term';
  const pool = d === 'case' ? buildCaseCardPool(courseId) : buildDictionary(courseId);
  const today = todayStr();
  const withStatus = pool.map(item => {
    const progress = getTermProgress(courseId, item.term, d);
    const isNew = !progress;
    const isDue = !isNew && progress.nextReview <= today;
    return { ...item, progress, isNew, isDue };
  });
  const due = withStatus.filter(item => item.isDue);
  const fresh = withStatus.filter(item => item.isNew);
  due.sort((a,b) => (a.progress.nextReview).localeCompare(b.progress.nextReview));
  return prioritizeNew ? [...fresh, ...due] : [...due, ...fresh];
}
const MASTERY_LEVELS = [
  { label: 'New', percent: 4,  color: 'var(--oxblood)' },      // box 0 (never studied)
  { label: 'Learning', percent: 20, color: 'var(--oxblood)' }, // box 1
  { label: 'Familiar', percent: 40, color: 'var(--brass)' },   // box 2
  { label: 'Practiced', percent: 60, color: 'var(--brass)' },  // box 3
  { label: 'Confident', percent: 80, color: 'var(--brass)' },  // box 4
  { label: 'Mastered', percent: 100, color: 'var(--green-ok)' }, // box 5
];
function computeWordDiff(userText, correctText){
  // Word-level LCS diff — shows exactly which words of the correct definition were
  // reproduced (in order) and which were missed or misworded, for verbatim practice.
  const clean = (w) => w.toLowerCase().replace(/[.,;:!?()'"]/g, '');
  const u = (userText||'').trim().split(/\s+/).filter(Boolean);
  const c = (correctText||'').trim().split(/\s+/).filter(Boolean);
  const m = u.length, n = c.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = clean(u[i-1]) === clean(c[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const matched = new Array(n).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(clean(u[i-1]) === clean(c[j-1])){ matched[j-1] = true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  const score = n>0 ? Math.round((matched.filter(Boolean).length/n)*100) : 100;
  return { correctWords: c, matched, score };
}

function masteryInfo(box){
  return MASTERY_LEVELS[Math.max(0, Math.min(5, box||0))];
}
function termStatusLabel(courseId, term){
  const p = getTermProgress(courseId, term);
  const m = masteryInfo(p ? p.box : 0);
  if(!p) return { ...m, sub: 'Not studied yet' };
  const today = todayStr();
  if(p.box >= 5) return { ...m, sub: `Next review ${p.nextReview}` };
  if(p.nextReview <= today) return { ...m, sub: 'Due for review' };
  return { ...m, sub: `Next review ${p.nextReview}` };
}

function buildDictionary(courseId){
  const map = {};
  const lectures = state.lectures
    .filter(l => l.courseId === courseId)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  lectures.forEach(l => {
    (l.keyTerms||[]).forEach(t => {
      if(!t.term || !t.term.trim()) return;
      const key = t.term.trim().toLowerCase();
      const existing = map[key];
      const sources = existing ? existing.sources : [];
      // Later lectures win on content — if a term comes up again, the newer explanation
      // usually reflects a more complete or refined understanding. Fields the newer
      // mention left blank fall back to whatever was captured before, so a thin second
      // mention doesn't erase a richer earlier one.
      map[key] = {
        term: t.term.trim(),
        definition: t.definition || existing?.definition || '',
        formalDefinition: t.formalDefinition || existing?.formalDefinition || null,
        formalDefinitionSource: t.formalDefinition ? (t.formalDefinitionSource || null) : (existing?.formalDefinitionSource || null),
        context: t.context || existing?.context || null,
        usagePattern: t.usagePattern || existing?.usagePattern || null,
        sources,
      };
      map[key].sources.push({ lectureId: l.id, title: l.title, date: l.date });
    });
  });

  // Manual additions/edits always win — they're your professor's exact wording, and
  // regenerating a lecture should never silently overwrite something you fixed by hand.
  const customPrefix = courseId + '::';
  Object.entries(state.customTerms || {}).forEach(([storeKey, custom]) => {
    if(!storeKey.startsWith(customPrefix)) return;
    const key = storeKey.slice(customPrefix.length);
    if(map[key]){
      // Preserve whichever label is actually accurate — a term you added fresh should
      // keep saying so even if a later lecture happens to also mention that same name.
      map[key] = { ...map[key], definition: custom.definition, edited: !custom.manual, manual: !!custom.manual };
    } else {
      map[key] = {
        term: custom.term, definition: custom.definition,
        formalDefinition: null, formalDefinitionSource: null, context: null, usagePattern: null,
        sources: [{ lectureId: null, title: 'Added manually', date: null }],
        manual: true,
      };
    }
  });

  return Object.values(map).sort((a,b) => a.term.localeCompare(b.term));
}

function customTermKey(courseId, term){
  return courseId + '::' + term.trim().toLowerCase();
}
function saveCustomTerm(courseId, term, definition, isManualAddition){
  state.customTerms[customTermKey(courseId, term)] = { term: term.trim(), definition: definition.trim(), manual: !!isManualAddition, updatedAt: Date.now() };
  saveState();
}

/* ============ CASE LAW INDEX (course-wide) ============ */
function buildCaseLawIndex(courseId){
  const map = {};
  const lectures = state.lectures
    .filter(l => l.courseId === courseId)
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  lectures.forEach(l => {
    (l.caseLaw||[]).forEach(c => {
      if(!c.name || !c.name.trim()) return;
      const key = c.name.trim().toLowerCase();
      const existing = map[key];
      const sources = existing ? existing.sources : [];
      // Same principle as the Dictionary: a case revisited in a later lecture often gets
      // fuller treatment, so the newer description/quote wins, falling back to what's
      // already there if the newer mention is thinner.
      map[key] = {
        name: c.name.trim(),
        description: c.description || existing?.description || '',
        citation: c.citation || existing?.citation || null,
        quote: c.quote || existing?.quote || '',
        sources,
      };
      map[key].sources.push({ lectureId: l.id, title: l.title, date: l.date });
    });
  });
  return Object.values(map).sort((a,b) => a.name.localeCompare(b.name));
}

        ? `You type the ${noun === 'case' ? 'holding' : 'definition'} from memory and see exactly which words matched — built for a professor who wants it word-for-word.`
        : 'You judge for yourself whether you knew it. Faster, good for general understanding.';
    };
  });
  const close = () => overlay.remove();
  document.getElementById('closeSetup').onclick = close;
  document.getElementById('cancelSetup').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  document.getElementById('startStudy').onclick = () => {
    if(order === 'choose'){
      close();
      renderTermPickerModal(allTerms, d, verbatim);
      return;
    }
    close();
    let ordered, remainingAfter, allowRequeue;
    if(order === 'practice'){
      // Free practice: every item in the course, shuffled, ignoring due dates entirely.
      ordered = allTerms.map(item => ({ ...item, progress: getTermProgress(ui.activeCourse, item.term, d), isNew: !getTermProgress(ui.activeCourse, item.term, d), isDue: true }));
      for(let i = ordered.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
      }
      allowRequeue = true;
    } else {
      ordered = buildStudyQueue(ui.activeCourse, order==='new', d);
      allowRequeue = true;
    }
    const batch = size==='all' ? ordered : ordered.slice(0, size);
    remainingAfter = size==='all' ? 0 : Math.max(0, ordered.length - (typeof size==='number'?size:ordered.length));
    renderStudySessionModal(batch, remainingAfter, allowRequeue, d, verbatim);
  };
}

function renderStudySessionModal(initialBatch, remainingAfter, allowRequeue, deck, verbatim){
  const courseId = ui.activeCourse;
  const pending = initialBatch.slice(); // true queue — shrinks on mastery, never grows
  const totalUnique = pending.length;
  let masteredCount = 0;
  let revealed = false;
  let learnedCount = 0;
  let reviewCorrect = 0;
  let reviewAttempts = 0;
  let streak = 0;
  let bestStreak = 0;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);

  function draw(){
    if(pending.length === 0){
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Session complete</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="display" style="font-size:19px;margin-bottom:6px;">${masteredCount} / ${totalUnique} terms mastered</div>
            ${learnedCount ? `<div class="help">${learnedCount} of those were brand new.</div>` : ''}
            ${bestStreak >= 3 ? `<div class="help" style="color:var(--brass);margin-top:4px;">&#9733; Best streak this session: ${bestStreak} in a row</div>` : ''}
            <div class="help" style="margin-top:10px;">${remainingAfter > 0 ? `${remainingAfter} more term${remainingAfter===1?'':'s'} waiting outside this batch &mdash; start another session anytime.` : `That's everything in the queue for now.`}</div>
          </div>
          <div class="modal-foot">
            ${remainingAfter > 0 ? `<button class="btn ghost" id="anotherSess">Study more now</button>` : ''}
            <button class="btn" id="doneSess">Done</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      document.getElementById('doneSess').onclick = close;
      const anotherBtn = document.getElementById('anotherSess');
      if(anotherBtn) anotherBtn.onclick = () => { close(); renderStudySetupModal(); };
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      if(state.settings.githubToken){ syncNow().catch(e=>console.error(e)); }
      return;
    }
    const card = pending[0];
    const streakBadge = streak >= 2 ? `<span class="mono" style="font-size:11px;color:var(--brass);margin-left:8px;">&#9679; streak ${streak}</span>` : '';

    if(card.isNew){
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="mono" style="font-size:10px;color:var(--oxblood);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px;">New term &mdash; learning</div>
            <div style="text-align:center;padding:16px 10px 6px;">
              <div class="display" style="font-size:24px;margin-bottom:16px;">${escapeHtml(card.term)}</div>
              <div class="summary-body" style="font-size:16px;text-align:left;border-top:1px solid var(--rule);padding-top:14px;">${escapeHtml(card.definition)}</div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn" id="learnedBtn">Got it — next</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('learnedBtn').onclick = () => {
        recordTermTaught(courseId, card.term, card.definition, deck);
        learnedCount++; masteredCount++;
        pending.shift();
        draw();
      };
      return;
    }

    if(verbatim && !revealed){
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Verbatim</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div style="text-align:center;padding:10px 10px 6px;">
              <div class="display" style="font-size:24px;margin-bottom:16px;">${escapeHtml(card.term)}</div>
            </div>
            <label>Type it from memory, as close to word-for-word as you can</label>
            <textarea id="vbInput" rows="5" placeholder="Type the definition here..."></textarea>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" id="skipBtn">Skip session</button>
            <button class="btn" id="checkBtn">Check</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('skipBtn').onclick = close;
      document.getElementById('checkBtn').onclick = () => {
        const typed = document.getElementById('vbInput').value;
        const diff = computeWordDiff(typed, card.definition);
        card._diff = diff;
        revealed = true;
        draw();
      };
      return;
    }

    if(verbatim && revealed){
      const diff = card._diff;
      const scoreColor = diff.score >= 90 ? 'var(--green-ok)' : (diff.score >= 60 ? 'var(--brass)' : 'var(--oxblood)');
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <h2>Teach Me — Verbatim</h2>
            <button class="modal-close" id="closeSess">&times;</button>
          </div>
          <div class="modal-body">
            <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
            <div class="display" style="font-size:20px;margin-bottom:4px;">${escapeHtml(card.term)}</div>
            <div class="mono" style="font-size:12px;color:${scoreColor};margin-bottom:14px;">Word match: ${diff.score}%</div>
            <label>Correct definition — words you missed or got wrong are underlined</label>
            <div class="summary-body" style="font-size:15.5px;text-align:left;border-top:1px solid var(--rule);padding-top:12px;">${diff.correctWords.map((w,idx) => diff.matched[idx] ? escapeHtml(w) : `<span style="color:var(--oxblood);text-decoration:underline;text-decoration-color:var(--oxblood);">${escapeHtml(w)}</span>`).join(' ')}</div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" id="missBtn">Didn't know it</button>
            <button class="btn" id="gotBtn">Got it</button>
          </div>
        </div>`;
      const close = () => overlay.remove();
      document.getElementById('closeSess').onclick = close;
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
      document.getElementById('gotBtn').onclick = () => {
        recordTermAnswer(courseId, card.term, card.definition, true, deck);
        reviewCorrect++; reviewAttempts++; masteredCount++;
        streak++; bestStreak = Math.max(bestStreak, streak);
        pending.shift();
        revealed = false; draw();
      };
      document.getElementById('missBtn').onclick = () => {
        recordTermAnswer(courseId, card.term, card.definition, false, deck);
        reviewAttempts++;
        streak = 0;
        pending.shift();
        if(allowRequeue){
          const reinsertAt = Math.min(3, pending.length);
          pending.splice(reinsertAt, 0, card);
        }
        revealed = false; draw();
      };
      return;
    }

    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>Teach Me</h2>
          <button class="modal-close" id="closeSess">&times;</button>
        </div>
        <div class="modal-body">
          <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${masteredCount} / ${totalUnique} mastered this session${streakBadge}</div>
          ${(() => { const m = masteryInfo(card.progress ? card.progress.box : 0); return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <span class="mono" style="font-size:10px;color:${m.color};white-space:nowrap;">${escapeHtml(m.label)}</span>
            <div style="flex:1;height:5px;background:var(--rule);position:relative;">
              <div style="position:absolute;left:0;top:0;bottom:0;width:${m.percent}%;background:${m.color};"></div>
            </div>
          </div>`; })()}
          <div style="text-align:center;padding:20px 10px;">
            <div class="display" style="font-size:24px;margin-bottom:18px;">${escapeHtml(card.term)}</div>
            ${revealed ? `
              <div class="summary-body" style="font-size:16px;text-align:left;border-top:1px solid var(--rule);padding-top:14px;">${escapeHtml(card.definition)}</div>
            ` : `<button class="btn ghost" id="revealBtn">Show definition</button>`}
          </div>
        </div>
        <div class="modal-foot">
          ${revealed ? `
            <button class="btn ghost" id="missBtn">Didn't know it</button>
            <button class="btn" id="gotBtn">Got it</button>
          ` : `<button class="btn ghost" id="skipBtn">Skip session</button>`}
        </div>
      </div>`;
    const close = () => overlay.remove();
    document.getElementById('closeSess').onclick = close;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
    const revealBtn = document.getElementById('revealBtn');
    if(revealBtn) revealBtn.onclick = () => { revealed = true; draw(); };
    const skipBtn = document.getElementById('skipBtn');
    if(skipBtn) skipBtn.onclick = close;
    const gotBtn = document.getElementById('gotBtn');
    const missBtn = document.getElementById('missBtn');
    if(gotBtn) gotBtn.onclick = () => {
      recordTermAnswer(courseId, card.term, card.definition, true, deck);
      reviewCorrect++; reviewAttempts++; masteredCount++;
      streak++; bestStreak = Math.max(bestStreak, streak);
      pending.shift();
      revealed = false; draw();
    };
    if(missBtn) missBtn.onclick = () => {
      recordTermAnswer(courseId, card.term, card.definition, false, deck);
      reviewAttempts++;
      streak = 0;
      pending.shift();
      if(allowRequeue){
        // Same term, same session, just a few cards later — no next-day wait.
        // pending never grows: we removed it above, this just changes its position.
        const reinsertAt = Math.min(3, pending.length);
        pending.splice(reinsertAt, 0, card);
      }
      revealed = false; draw();
    };
  }
  draw();
}

function caseBriefKey(courseId, name){
  return courseId + '::' + name.trim().toLowerCase();
}
function getCaseBrief(courseId, name){

}
function saveCaseBrief(courseId, name, brief){
  state.caseBriefs[caseBriefKey(courseId, name)] = { ...brief, updatedAt: Date.now() };
  saveState();
}

function buildCourseContextForPractice(courseId){
  const keyPointsText = state.lectures
    .filter(l => l.courseId === courseId && l.keyPoints)
    .map(l => `From "${l.title}":\n${l.keyPoints}`)
    .join('\n\n')
    .slice(0, 6000); // keep prompt size sane for courses with many lectures
  const caseLaw = buildCaseLawIndex(courseId)
    .map(c => `${c.name}${c.citation ? ' ('+c.citation+')' : ''}: ${c.description}`)
    .join('\n')
    .slice(0, 3000);
  return { keyPointsText, caseLaw };
}

async function generateHypothetical(courseName, context, apiKey, multiIssue){
  const prompt = multiIssue ? `You are a law professor's teaching assistant helping a first-year law student practice full exam-style issue-spotting for "${courseName}". Using the rules and cases below (drawn from their actual class material), write ONE longer, more complex fact pattern that intentionally raises 2-4 DISTINCT issues spanning multiple rules or cases from class — the kind of multi-issue question that would appear on an actual final exam, not a single clean textbook hypothetical. Do not reveal the issues or the answer.

RULES AND KEY POINTS FROM CLASS:
${context.keyPointsText || '(none available yet)'}

CASE LAW DISCUSSED:
${context.caseLaw || '(none available yet)'}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "hypothetical": "the fact pattern, 8-14 sentences, realistic and specific, deliberately weaving in facts relevant to multiple distinct issues, ending with a call to action like 'Discuss all claims that may arise.'",
  "targetRule": "a short internal note (not shown to the student until after they answer) listing each distinct issue/rule/case this hypothetical is testing, one per line"
}` : `You are a law professor's teaching assistant helping a first-year law student practice issue-spotting for "${courseName}". Using the rules and cases below (drawn from their actual class material), write ONE realistic fact-pattern hypothetical that requires applying one or more of these rules — the kind of question that would appear on an exam or in a practice problem. Do not reveal the issue or the answer.

RULES AND KEY POINTS FROM CLASS:
${context.keyPointsText || '(none available yet)'}

CASE LAW DISCUSSED:
${context.caseLaw || '(none available yet)'}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "hypothetical": "the fact pattern, 4-8 sentences, realistic and specific, ending with a call to action like 'Discuss.' or 'What claims, if any, might arise?'",
  "targetRule": "a short internal note (not shown to the student until after they answer) naming which rule(s) or case(s) this hypothetical is testing"
}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: multiIssue ? 1400 : 800,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  return JSON.parse(extractJSON(raw));
}

/* ============ WRITING FEEDBACK ============ */
async function generateWritingFeedback(draft, apiKey){
  const prompt = `A first-year law student wants feedback on a piece of legal writing (a memo, brief, or analysis draft) before turning it in. Focus entirely on structure and precision — the things that make writing read as competent legal analysis rather than a first-year draft. Do not comment on tone, vocabulary, or "sounding smart" — those aren't what's being evaluated.

DRAFT:
${draft}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "structure": "does it follow a clear IRAC/CREAC-style structure? Point to specific places where structure is strong or missing.",
  "precision": "are legal terms used correctly and precisely? Any imprecise or incorrect usage, named specifically?",
  "ruleApplication": "does the analysis actually apply the rule to the specific facts, or does it stay abstract/conclusory? Point to a specific passage.",
  "gaps": "any counterarguments, elements, or steps in the analysis that seem to be missing",
  "strongestPart": "the single strongest part of the draft, and why",
  "topPriorityFix": "if they only fix one thing before submitting, what should it be"
}
Be honest and direct. This is meant to actually improve the grade, not to make them feel good.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');
  return JSON.parse(extractJSON(raw));
}

/* ============ COURSE OUTLINE & RULE BANK ============ */
function buildCourseSynthesisContext(courseId){
  const lectures = state.lectures
    .filter(l => l.courseId === courseId && (l.keyPoints || l.policyNotes))
    .slice()
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  let combinedText = lectures.map(l =>
    `## ${l.title || 'Untitled'} (${l.date || 'no date'})\n${l.keyPoints ? 'Key Points:\n' + l.keyPoints : ''}${l.policyNotes && !/^no policy discussion/i.test(l.policyNotes.trim()) ? '\n\nPolicy/Rationale:\n' + l.policyNotes : ''}`
  ).join('\n\n');
  let truncated = false;
  if(combinedText.length > 22000){ combinedText = combinedText.slice(0, 22000); truncated = true; }
  const caseLawText = buildCaseLawIndex(courseId)
    .map(c => `${c.name}${c.citation ? ' ('+c.citation+')' : ''}: ${c.description}`)
    .join('\n')
    .slice(0, 4000);
  return { combinedText, caseLawText, lectureCount: lectures.length, truncated };
}

async function generateCourseOutline(courseName, context, apiKey){
  const prompt = `You are helping a law student build a comprehensive course outline for "${courseName}" — the primary study document they'll use going into finals. Using the class notes and case law below (given by lecture date), synthesize ONE outline organized BY LEGAL TOPIC OR DOCTRINE, not by date. Merge overlapping or repeated points across lectures into one clear statement of the rule, note where a rule was refined or added to in a later class, and place the relevant case law directly under the topic it supports rather than in a separate list. Where policy/rationale notes exist, work the "why" in under the relevant rule rather than as an afterthought — that's often what separates a strong exam answer from a rote one.

CLASS NOTES BY LECTURE:
${context.combinedText || '(no key points recorded yet)'}

CASE LAW DISCUSSED:
${context.caseLawText || '(none recorded yet)'}

Return the outline as clean, well-structured Markdown (use # / ## headers and - sub-bullets). Return ONLY the outline text itself — no preamble, no commentary, no closing remarks.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 8000,
      temperature: 0.3,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n').trim();
}

async function generateRuleBank(courseName, context, apiKey){
  const prompt = `You are helping a law student build a condensed rule-statement bank for "${courseName}" — the kind of one-page black-letter cheat sheet used for exam prep. Using the class notes below, extract every distinct legal rule or doctrine discussed. For each one, give: the rule name as a header, then its elements as a terse numbered list — no case names, no policy discussion, no explanation, just the elements as precisely and concisely as possible. Group related rules under a shared topic header where it makes sense.

CLASS NOTES:
${context.combinedText || '(no key points recorded yet)'}

Return as clean Markdown text only (# / ## headers, numbered lists for elements). This should be short enough to actually use as a one-page reference during an exam, not a restatement of the full outline. Return ONLY the rule bank itself — no preamble, no commentary.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',

    },

      model: 'claude-sonnet-4-6',
      max_tokens: 4000,
      temperature: 0.2,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok){

}

/* ============ TO-DO BOARD (course-wide) ============ */
function buildTodoBoard(courseId){
  const items = [];
  state.lectures
    .filter(l => l.courseId === courseId)
    .forEach(l => {
      (l.todos||[]).forEach(t => {
        items.push({ ...t, lectureId: l.id, lectureTitle: l.title, lectureDate: l.date });
      });
    });
  items.sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if(a.dueDate) return -1;
    if(b.dueDate) return 1;
    return (a.lectureDate||'').localeCompare(b.lectureDate||'');
  });
  return items;
}

/* ============ AUDIO PROCESSING ============ */
async function decodeAndResample(file){
  const arrayBuffer = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const tempCtx = new AC();
  let decoded;
  try{
    decoded = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
  } finally {
    tempCtx.close();
  }
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = decoded;
  source.connect(offlineCtx.destination);
  source.start(0);
  const rendered = await offlineCtx.startRendering();
  return { float32: rendered.getChannelData(0), sampleRate: targetRate, durationSec: decoded.duration };
}

function encodeWAV(samples, sampleRate){
  const buffer = new ArrayBuffer(44 + samples.length*2);
  const view = new DataView(buffer);
  function writeString(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4, 36+samples.length*2, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40, samples.length*2, true);
  let offset=44;
  for(let i=0;i<samples.length;i++, offset+=2){
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([view], { type:'audio/wav' });
}

function formatDuration(sec){
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return `${m}m ${s}s`;
}

/* ============ TRANSCRIPTION BACKENDS ============ */
async function localTranscribe(float32, sampleRate, onProgress){
  if(!localTranscriberPromise){
    localTranscriberPromise = (async () => {
      const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      mod.env.allowLocalModels = false;
      let device = 'wasm';
      try{
        if(navigator.gpu){ device = 'webgpu'; }
      }catch(e){}
      let transcriber;
      try{
        transcriber = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { device });
      }catch(e){
        transcriber = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { device: 'wasm' });
      }
      return transcriber;
    })();
  }
  onProgress && onProgress('Loading model into memory...');
  const transcriber = await localTranscriberPromise;
  onProgress && onProgress('Transcribing audio locally — this can take a while for long recordings...');
  const output = await transcriber(float32, {
    chunk_length_s: 30,
    stride_length_s: 5,
    sampling_rate: sampleRate,
  });
  return (output && output.text) ? output.text.trim() : '';
}

async function cloudTranscribe(wavBlob, apiKey){
  const res = await fetch('https://api.deepgram.com/v1/listen?model=nova-3&smart_format=true&punctuate=true', {
    method: 'POST',
    headers: {
      'Authorization': `Token ${apiKey}`,
      'Content-Type': 'audio/wav'
    },
    body: wavBlob
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Deepgram error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  return data?.results?.channels?.[0]?.alternatives?.[0]?.transcript || '';
}

async function generateDocs(transcript, apiKey, courseName, lectureDateStr){
  const dateNote = lectureDateStr ? `This class session took place on ${lectureDateStr}. Use that as the reference date for resolving any relative dates the professor mentions (e.g. "read this for next Tuesday", "due Friday").` : `No class date was provided, so if a relative date is mentioned, set dueDate to null rather than guessing.`;

  const prompt = `You are helping a first-year law student review a recorded class session for their course "${courseName}". ${dateNote}

Read the transcript below and return ONLY a JSON object (no markdown fences, no preamble, no commentary) with exactly this shape:

{
  "keyPoints": "a bullet-point list of the main points, rules, and holdings discussed, each bullet on its own line starting with a dash",
  "caseLaw": [
    { "name": "Case Name v. Other Party", "description": "2-3 sentence plain-language description of what the case is about and the rule it stands for", "quote": "the verbatim sentence(s) the professor actually said about this case, copied exactly from the transcript, word for word", "citation": "the accurate Bluebook-style legal citation for this case, found via web search — e.g. 'Palsgraf v. Long Island R.R. Co., 248 N.Y. 339, 162 N.E. 99 (1928)'. If you cannot verify a reliable citation, set this to null." }
  ],
  "keyTerms": [
    { "term": "the legal term or word of art (e.g. 'battery', 'negligence per se', 'proximate cause')", "definition": "a clear, concise definition of the term as the professor used or explained it, in plain language, 1-2 sentences", "formalDefinition": "use web_search with a query like 'site:thelawdictionary.org <term>' to find this term's entry in Black's Law Dictionary, 2nd edition (1910) — this specific edition is in the public domain, so if you find it there and are confident the result is genuinely from that 2nd-edition source, you may quote its definition text verbatim. Do NOT quote from any other edition of Black's Law (3rd through 12th are all still copyrighted), from Westlaw, Wex, or any other current legal dictionary or source — those must never be quoted verbatim. If the term isn't found in the 2nd-edition results, or many legal terms coined after 1910 simply won't be, write an original formally-worded definition in your own words instead, in the same black-letter/elements-based register. If the term isn't a formal legal term of art at all, set this to null.", "formalDefinitionSource": "set to exactly 'Black's Law Dictionary, 2nd ed. (1910) — public domain' if formalDefinition is a verbatim quote from that specific edition found via web search, or 'Original definition (not found in the public-domain 2nd edition)' if you had to write it yourself, or null if formalDefinition is null", "context": "the verbatim sentence(s) from the transcript where the professor actually used this term, copied exactly, word for word. If the term wasn't used in a clear standalone sentence, set to null.", "usagePattern": "a short note on how this term is typically used grammatically or in legal writing — e.g. common phrasing, collocations, or the part of speech — to help the student use it correctly in their own writing, 1 sentence" }
  ],
  "todos": [
    { "text": "a single action item, assigned reading, or to-do mentioned", "dueDate": "an ISO date YYYY-MM-DD if a specific or relative deadline was mentioned and can be resolved using the reference date above, otherwise null" }
  ],
  "policyNotes": "a bullet-point list capturing the WHY behind the rules discussed — the policy justification, the competing interests being balanced, or the tension the rule resolves — as the professor explained or implied it, not just a restatement of the rule itself. Each bullet on its own line starting with a dash. This is what separates a rote answer from a strong one in class discussion, so focus on reasoning and tension, not restating black-letter law. If the professor didn't get into policy/rationale in this session, use 'No policy discussion identified in this session.'"
}

Rules:
- If no case law was discussed, "caseLaw" must be an empty array [].
- For each case in "caseLaw", use the web_search tool to find its real, accurate legal citation.
- For each term's "formalDefinition", search specifically for its entry in Black's Law Dictionary's public-domain 2nd edition (1910) at thelawdictionary.org. Only quote verbatim if you're confident the result is genuinely that 2nd-edition text — never quote any modern/copyrighted dictionary or source. When the term isn't in that 1910 edition (common for anything coined more recently), write your own original definition instead and say so via "formalDefinitionSource".
- Only use web search for these two purposes (case citations, formal definition lookup) — do not search for anything else, and do not search for things already answerable from the transcript.
- For "keyTerms": include any legal terminology, doctrines, elements of a claim/defense, or terms of art the professor defined, explained, or used substantively — not casual vocabulary. If none, use an empty array [].
- For "todos": if nothing was mentioned, use an empty array [].
- The "quote" field must be an exact, word-for-word excerpt from the transcript text below, not a paraphrase.
- Keep keyPoints tight and practical, meant for exam review, not a full recap.
- After any web searches, your FINAL message must be raw JSON only, matching the shape above exactly, with no other text before or after it.

TRANSCRIPT:
${transcript}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 8000,
      temperature: 0.2,
      messages: [{ role: 'user', content: prompt }],
      tools: [{ type: 'web_search_20250305', name: 'web_search' }]
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude API error (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text || '');
  const raw = textBlocks.length ? textBlocks[textBlocks.length - 1] : '';
  let parsed;
  try{
    parsed = JSON.parse(extractJSON(raw));
  }catch(e){
    throw new Error('Could not parse notes response. Try again.');
  }

  return {
    keyPoints: parsed.keyPoints || '',
