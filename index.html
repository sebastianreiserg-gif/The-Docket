      const termNames = buildDictionary(courseId).map(t => t.term);
      const fresh = await generateContrastCards(course ? course.name : '', context.combinedText, termNames, existing, state.settings.anthropicKey, update);
      cleanup();
      if(!fresh.length){
        errEl.innerHTML = `<div class="help">${existing.length ? 'No new look-alike pairs turned up beyond the ones you already have — more lectures might change that.' : 'No genuinely confusable pairs turned up in your notes yet — more lectures might change that.'}</div>`;
      } else {
        saveContrastCards(courseId, existing.concat(fresh));
        if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      }
      refresh();
    }catch(e){
      cleanup();
      errEl.innerHTML = `<div class="err-box">Could not build pairs: ${escapeHtml(e.message)}</div>`;
      btn.disabled = false; btn.textContent = originalLabel;
    }
  }

  function startSession(pool){
    if(!pool.length) return;
    const ids = pool.map(c => c.id);
    for(let i = ids.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const queue = ids.slice();
    const retried = new Set();   // pairs already requeued once after a miss this session
    let firstTryRight = 0, firstTryTotal = 0;
    listEl.style.display = 'none';
    controlsEl.style.display = 'none';
    errEl.innerHTML = '';

    const endSession = async () => {
      studyEl.innerHTML = `
        <div class="summary-body" style="padding:14px;background:var(--paper);">
          <b>Session done.</b> ${firstTryRight} of ${firstTryTotal} right on the first try.
          ${firstTryRight < firstTryTotal ? ' The ones you missed are back in Box 1 and will come around again soon.' : ''}
        </div>
        <button class="btn" id="ccBackBtn" style="margin-top:12px;">Back to pairs</button>
      `;
      document.getElementById('ccBackBtn').onclick = () => {
        studyEl.innerHTML = '';
        listEl.style.display = '';
        controlsEl.style.display = 'flex';
        refresh();
      };
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
    };

    const showQuiz = (card) => {
      const isRetry = retried.has(card.id) && card._missedOnce;
      const scenario = card.scenarios[(card.reviewCount || 0) % card.scenarios.length];
      const flip = Math.random() < 0.5;
      const first = flip ? 'b' : 'a', second = flip ? 'a' : 'b';
      const chip = (side) => `<button class="btn ghost ccChoice" data-side="${side}" style="flex:1 1 200px;min-width:0;white-space:normal;">${escapeHtml(card[side].name)}</button>`;
      studyEl.innerHTML = `
        <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">${escapeHtml(card.a.name)} vs. ${escapeHtml(card.b.name)} &middot; ${queue.length} more after this</div>
        <div style="font-size:15px;line-height:1.7;padding:12px 14px;background:var(--paper);border-left:2px solid var(--brass);margin-bottom:12px;">${escapeHtml(scenario.text)}</div>
        <div style="font-size:13.5px;margin-bottom:8px;">Which one do these facts point to? Decide before you tap.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">${chip(first)}${chip(second)}</div>
        <div id="ccFeedback" style="margin-top:14px;"></div>
      `;
      studyEl.querySelectorAll('.ccChoice').forEach(btn => {
        btn.onclick = () => {
          const picked = btn.dataset.side;
          const right = picked === scenario.answer;
          studyEl.querySelectorAll('.ccChoice').forEach(b => {
            b.disabled = true;
            if(b.dataset.side === scenario.answer){ b.style.borderColor = '#3a7d44'; b.style.borderWidth = '2px'; }
            else if(b.dataset.side === picked){ b.style.borderColor = 'var(--oxblood)'; b.style.borderWidth = '2px'; }
          });
          if(!isRetry){
            firstTryTotal++;
            if(right) firstTryRight++;
            recordContrastAnswer(courseId, card.id, right);
          }
          if(!right && !retried.has(card.id)){
            retried.add(card.id);
            card._missedOnce = true;
            queue.push(card.id);
          }
          document.getElementById('ccFeedback').innerHTML = `
            <div style="font-size:14.5px;line-height:1.6;padding:10px 12px;border-left:3px solid ${right ? '#3a7d44' : 'var(--oxblood)'};background:var(--paper);margin-bottom:10px;">
              <b>${right ? 'Right.' : 'Not quite — this one is ' + escapeHtml(card[scenario.answer].name) + '.'}</b> ${escapeHtml(scenario.why)}
            </div>
            <div style="margin-bottom:12px;">${contrastSideBySideHtml(card)}</div>
            <button class="btn" id="ccNextBtn">${queue.length ? 'Next' : 'Finish'}</button>
          `;
          document.getElementById('ccNextBtn').onclick = next;
        };
      });
    };

    const showTeach = (card) => {
      studyEl.innerHTML = `
        <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">New pair &middot; read it, then you'll be tested on it</div>
        <div style="font-family:'Libre Caslon Display',serif;font-size:18px;color:var(--oxblood);margin-bottom:10px;">${escapeHtml(card.a.name)} vs. ${escapeHtml(card.b.name)}</div>
        ${contrastSideBySideHtml(card)}
        <button class="btn" id="ccQuizBtn" style="margin-top:12px;">Quiz me on this</button>
      `;
      document.getElementById('ccQuizBtn').onclick = () => showQuiz(card);
    };

    function next(){
      if(!queue.length){ endSession(); return; }
      const id = queue.shift();
      const card = getContrastCards(courseId).find(c => c.id === id);
      if(!card){ next(); return; }
      const sessionCard = { ...card, _missedOnce: retried.has(card.id) };
      if(!card.reviewCount && !retried.has(card.id)) showTeach(sessionCard);
      else showQuiz(sessionCard);
    }
    next();
  }

  refresh();
}

/* ============ MEMORY AIDS (mnemonics for the Outline, Rule Bank, and Dictionary) ============ */
// Three separate sources because they hold different kinds of content and need different devices:
//  - Outline: a "topic map" per unit (which topics exist, in order) plus per-topic element lists
//  - Rule Bank: the numbered elements of each rule (only rules with 3+ elements; fewer isn't worth a device)
//  - Dictionary: only terms a hook actually helps with (Latin, sound-alikes, non-obvious meanings)
// The model picks the style per item. Everything it returns is checked in code before it is saved:
// an acronym's letters must spell the mnemonic, an acrostic's word initials must match its keywords,
// and the decode shown to the student always uses the REAL element text from the source, never the model's paraphrase.
const MNEMONIC_TYPES = {
  acronym: { label: 'Acronym' },
  acrostic: { label: 'Acrostic' },
  rhyme: { label: 'Rhyme' },
  story: { label: 'Story' },
  sound_alike: { label: 'Sound-alike' },
};
const MNEMONIC_SOURCES = {
  outline: { label: 'Outline', empty: 'No outline yet. Generate your Outline first, then come back here.' },
  rulebank: { label: 'Rule Bank', empty: 'No Rule Bank yet. Generate your Rule Bank first, then come back here.' },
  dictionary: { label: 'Dictionary', empty: 'Your dictionary is empty. Terms appear here once your lectures are processed.' },
};
const MNEMONIC_MIN_ELEMENTS = 3;
const MNEMONIC_BATCH = 6;
const MNEMONIC_MAX_SELECT = 12;

function mnStripMd(s){
  return String(s || '').replace(/\*\*/g, '').replace(/(^|\s)[*_]+|[*_]+(\s|$)/g, '$1$2').replace(/`/g, '').replace(/\s+/g, ' ').trim();
}
function parseMdSections(md){
  const out = [];
  let cur = null;
  String(md || '').split('\n').forEach(line => {
    const m = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(m){ cur = { level: m[1].length, title: mnStripMd(m[2]), lines: [] }; out.push(cur); }
    else if(cur) cur.lines.push(line);
  });
  return out;
}
function numberedElements(lines){
  // Prefer the list right after an "**Elements**" label; otherwise take the first numbered run.
  let from = lines.findIndex(l => /^\s*\*\*\s*elements/i.test(l));
  if(from < 0) from = 0; else from += 1;
  const items = [];
  let started = false;
  for(let i = from; i < lines.length; i++){
    const line = lines[i];
    const m = line.match(/^\s*\d+[.)]\s+(.+)$/);
    if(m){ started = true; items.push(mnStripMd(m[1])); continue; }
    if(!started) continue;
    if(!line.trim()) continue;                       // blank line inside a list
    if(/^\s+\S/.test(line) && !/^\s*[-*]\s/.test(line)){ items[items.length - 1] += ' ' + mnStripMd(line); continue; }   // wrapped continuation
    if(/^\s+[-*]\s/.test(line)) continue;            // nested bullet under an element
    break;
  }
  return items.filter(Boolean);
}
function mnCleanTitle(t){
  return mnStripMd(t).replace(/^(?:part\s+)?(?:[IVXLC]+|\d+|[A-Z])[.):]\s+/i, '').replace(/^topic\s*\d+\s*[:.-]\s*/i, '').trim();
}
const MN_GENERIC = /^(elements?|rule|test|factors?|requirements?|standard|defenses?|remedies|nuances?|exceptions?|definition)$/i;
function mnSectionTopics(secs, prefix, uniqueKey){
  // Every heading at level 2 or deeper (##, ###, ####...) that directly holds a numbered list becomes an item.
  // A generic sub-heading like "Elements" is named after the nearest heading above it ("Battery: Elements").
  const topics = [], skipped = [];
  const stack = [];
  secs.forEach(s => {
    while(stack.length && stack[stack.length - 1].level >= s.level) stack.pop();
    const parent = stack.length ? stack[stack.length - 1] : null;
    stack.push(s);
    if(s.level < 2) return;
    const els = numberedElements(s.lines);
    let title = mnCleanTitle(s.title);
    if(MN_GENERIC.test(title) && parent && parent.level >= 2) title = mnCleanTitle(parent.title) + ': ' + title;
    if(els.length >= MNEMONIC_MIN_ELEMENTS) topics.push({ key: uniqueKey(prefix, title), kind: 'elements', title, elements: els });
    else if(els.length > 0) skipped.push({ title, count: els.length });
  });
  return { topics, skipped };
}
function mnemonicItemsFromOutline(md){
  const secs = parseMdSections(md);
  const maps = [];
  const seen = {};
  const uniqueKey = (prefix, title) => {
    const base = prefix + '::' + title.toLowerCase();
    seen[base] = (seen[base] || 0) + 1;
    return seen[base] === 1 ? base : base + '#' + seen[base];
  };
  // Topic maps: the level-2 headings under each level-1 heading (or all of them if there are no level-1 headings).
  const groups = [];
  if(secs.some(s => s.level === 1)){
    let g = null;
    secs.forEach(s => {
      if(s.level === 1){ g = { title: mnCleanTitle(s.title), kids: [] }; groups.push(g); }
      else if(s.level === 2 && g) g.kids.push(mnCleanTitle(s.title));
    });
  } else {
    groups.push({ title: 'Course topics', kids: secs.filter(s => s.level === 2).map(s => mnCleanTitle(s.title)) });
  }
  groups.forEach(g => {
    const kids = g.kids.filter(Boolean);
    if(kids.length < MNEMONIC_MIN_ELEMENTS) return;
    const chunks = [];
    for(let i = 0; i < kids.length; i += 7) chunks.push(kids.slice(i, i + 7));
    if(chunks.length > 1 && chunks[chunks.length - 1].length < MNEMONIC_MIN_ELEMENTS){
      const last = chunks.pop(); chunks[chunks.length - 1] = chunks[chunks.length - 1].concat(last);
    }
    chunks.forEach((c, i) => {
      const title = g.title + ' topic map' + (chunks.length > 1 ? ' (part ' + (i + 1) + ')' : '');
      maps.push({ key: uniqueKey('outline', title), kind: 'map', title, elements: c });
    });
  });
  const { topics, skipped } = mnSectionTopics(secs, 'outline', uniqueKey);
  return { groups: [{ label: 'Topic maps', hint: 'Which topics exist, and in what order', items: maps }, { label: 'Topics', hint: 'The numbered elements under each topic', items: topics }], skipped };
}
function mnemonicItemsFromRuleBank(md){
  const seen = {};
  const uniqueKey = (prefix, title) => {
    const base = prefix + '::' + title.toLowerCase();
    seen[base] = (seen[base] || 0) + 1;
    return seen[base] === 1 ? base : base + '#' + seen[base];
  };
  const { topics, skipped } = mnSectionTopics(parseMdSections(md), 'rulebank', uniqueKey);
  return { groups: [{ label: 'Rules', hint: 'The elements of each rule', items: topics }], skipped };
}
const MN_LATIN = /\b(res|ipsa|loquitur|per se|prima facie|ex parte|de facto|de jure|in re|inter alia|ultra vires|mens rea|actus reus|stare decisis|quid pro quo|sua sponte|respondeat superior|bona fide|pro se|en banc|certiorari|habeas corpus|nolo contendere|quantum meruit|caveat emptor|parens patriae|in loco parentis|sine qua non|ab initio|sui juris|animus|volenti|in personam|in rem|pro tanto|scienter|nunc pro tunc|ex post facto|in camera|amicus|voir dire|mandamus|obiter|dicta|ratio decidendi|lex loci|forum non conveniens|vicarious)\b/i;
function mnemonicItemsFromDictionary(courseId){
  const terms = (typeof buildDictionary === 'function') ? buildDictionary(courseId) : [];
  const contrast = new Set();
  if(typeof getContrastCards === 'function'){
    getContrastCards(courseId).forEach(c => { contrast.add(c.a.name.toLowerCase()); contrast.add(c.b.name.toLowerCase()); });
  }
  const all = terms.filter(t => t && t.term && t.definition).map(t => ({
    key: 'dictionary::' + t.term.toLowerCase(), kind: 'term', title: t.term, definition: String(t.definition).trim(),
    suggested: MN_LATIN.test(t.term) || contrast.has(t.term.toLowerCase()),
  }));
  return { groups: [
    { label: 'Suggested', hint: 'Latin terms and look-alikes, where a hook helps most', items: all.filter(i => i.suggested) },
    { label: 'Other terms', hint: 'Only worth it if the meaning will not stick on its own', items: all.filter(i => !i.suggested), collapsed: true },
  ], skipped: [] };
}
function mnemonicSourceItems(source, courseId){
  const doc = ((state.courseDocs || {})[courseId]) || {};
  if(source === 'outline') return doc.outline ? mnemonicItemsFromOutline(doc.outline) : null;
  if(source === 'rulebank') return doc.ruleBank ? mnemonicItemsFromRuleBank(doc.ruleBank) : null;
  const d = mnemonicItemsFromDictionary(courseId);
  return d.groups.some(g => g.items.length) ? d : null;
}

function getMnemonics(courseId){
  return (((state.courseDocs || {})[courseId] || {}).mnemonics) || [];
}
function saveMnemonics(courseId, list){
  state.courseDocs = state.courseDocs || {};
  state.courseDocs[courseId] = { ...(state.courseDocs[courseId] || {}), mnemonics: list, updatedAt: Date.now() };
  saveState(['courseDocs']);
}
function isMnemonicDue(m){ return !m.nextReview || m.nextReview <= todayStr(); }
function recordMnemonicAnswer(courseId, id, gotIt){
  const list = getMnemonics(courseId).map(m => ({ ...m }));
  const m = list.find(x => x.id === id);
  if(!m) return;
  const today = todayStr();
  const advancedToday = m.lastAdvanceDate === today;
  let box;
  if(!gotIt) box = 1;
  else if(advancedToday) box = m.box || 1;
  else box = Math.min((m.box || 0) + 1, 5);
  m.box = box;
  m.nextReview = addDays(today, LEITNER_INTERVALS[box - 1]);
  m.lastReviewed = Date.now();
  m.lastAdvanceDate = (gotIt && !advancedToday) ? today : (m.lastAdvanceDate || null);
  m.reviewCount = (m.reviewCount || 0) + 1;
  saveMnemonics(courseId, list);
}
function mnemonicIsStale(m, item){
  if(!item) return false;
  if(item.kind === 'term') return (m.definition || '') !== (item.definition || '');
  return JSON.stringify(m.elements || []) !== JSON.stringify(item.elements || []);
}

function buildMnemonicPrompt(courseName, items){
  const payload = items.map(i => i.kind === 'term'
    ? { key: i.key, kind: 'term', title: i.title, definition: i.definition }
    : { key: i.key, kind: i.kind, title: i.title, elements: i.elements });
  return `You are helping a law student in "${courseName}" memorize material for an exam. For each ITEM below, pick the SINGLE mnemonic style that fits that item best, then write the mnemonic. A mnemonic only helps if every part of it maps cleanly to a real part of the item, in order, so accuracy matters more than cleverness.

STYLES (choose per item; do not use one style for everything):
- "acronym": 3 to 6 elements in a fixed order whose keyword initials, in that order, spell a pronounceable word or short phrase. Use only when it comes out naturally. The "mnemonic" is JUST the acronym itself, nothing else.
- "acrostic": 4 to 8 elements in a fixed order. A short, vivid sentence where the Nth word starts with the same letter as the Nth keyword. Exactly one word per element, no filler words. Absurd or visual beats polite.
- "rhyme": 3 to 6 elements where rhythm helps (tests, factors, if-this-then-that rules). 2 to 4 short original lines that can be sung to any simple tune. Every cue word appears in the lines, in order. Never copy or adapt real song lyrics.
- "story": 7 or more elements, or elements that form a chain, a balance, or a sequence. A short vivid scene of 2 to 5 sentences where each element is a person, object, or action, appearing in order.
- "sound_alike" (only for kind "term"): a phonetic or visual hook tying how the word sounds, or what it looks like, to what it means.

HOW TO CHOOSE: look at the shape of the content. Short ordered list that spells something? acronym. Longer ordered list? acrostic. A test or factors where rhythm helps? rhyme. Long, or a chain of cause and effect? story. Latin or look-alike term? sound_alike. If an acronym or acrostic would feel forced, use rhyme or story instead.

KINDS:
- "elements": the elements of one rule, given in order.
- "map": the NAMES of topics in an outline, in order. The mnemonic only has to help the student remember WHICH topics exist and in what order.
- "term": a single vocabulary word with its definition. Only make a mnemonic if the word is Latin, sounds like another term, or its meaning is not guessable from its name. If the plain definition is already easy to remember, return {"key":"...","skip":true,"skipReason":"short reason"} for that item instead.

RULES FOR "steps" (kinds "elements" and "map"): exactly one step per element, in the same order. "keyword" is a single word taken from that element. "cue" is the word in your mnemonic that triggers that keyword: for an acronym it is the single letter, for an acrostic it is the word, for a rhyme or story it is the word exactly as it appears in your text. Do not reorder, merge, add, or drop elements.

Also give each item "why" (one sentence on why this style fits THIS item) and "picture" (one sentence describing an image the student can hold in mind). For terms, omit "steps" and add "anchor": the part of the meaning the hook carries.

ITEMS:
${JSON.stringify(payload, null, 1)}

Return ONLY a JSON object, no markdown fences, no commentary:
{ "items": [ { "key": "", "type": "acronym|acrostic|rhyme|story|sound_alike", "why": "", "mnemonic": "", "steps": [ { "cue": "", "keyword": "" } ], "picture": "" } ] }`;
}
function mnInitial(s){ const m = String(s || '').match(/[A-Za-z]/); return m ? m[0].toLowerCase() : ''; }
function validateMnemonic(raw, item){
  if(!raw || typeof raw !== 'object') return { ok: false, reason: 'empty response for this item' };
  if(raw.skip) return { ok: false, skipped: true, reason: String(raw.skipReason || 'not worth a mnemonic') };
  const mnemonic = String(raw.mnemonic || '').trim();
  const type = String(raw.type || '').trim();
  if(!MNEMONIC_TYPES[type]) return { ok: false, reason: 'unknown style' };
  if(!mnemonic) return { ok: false, reason: 'no mnemonic text' };
  if(item.kind === 'term'){
    if(type !== 'sound_alike') return { ok: false, reason: 'terms need a sound-alike hook' };
    const anchor = String(raw.anchor || '').trim();
    if(!anchor) return { ok: false, reason: 'hook does not say what it carries' };
    return { ok: true, value: { type, mnemonic, anchor, why: String(raw.why || '').trim(), picture: String(raw.picture || '').trim(), steps: [] } };
  }
  if(type === 'sound_alike') return { ok: false, reason: 'sound-alike is only for terms' };
  const steps = Array.isArray(raw.steps) ? raw.steps.map(s => ({ cue: String((s && s.cue) || '').trim(), keyword: String((s && s.keyword) || '').trim() })) : [];
  if(steps.length !== item.elements.length) return { ok: false, reason: 'steps do not match the ' + item.elements.length + ' elements' };
  if(steps.some(s => !s.cue || !s.keyword)) return { ok: false, reason: 'a step is missing its cue or keyword' };
  if(type === 'acronym' || type === 'acrostic'){
    if(steps.some(s => mnInitial(s.cue) !== mnInitial(s.keyword))) return { ok: false, reason: 'a cue does not start with its keyword\'s letter' };
    const initials = steps.map(s => mnInitial(s.cue)).join('');
    if(type === 'acronym'){
      const letters = mnemonic.replace(/[^A-Za-z]/g, '').toLowerCase();
      if(letters !== initials) return { ok: false, reason: 'the acronym letters do not match the keywords in order' };
    } else {
      const words = mnemonic.split(/\s+/).filter(w => /[A-Za-z]/.test(w));
      if(words.length !== steps.length || words.map(mnInitial).join('') !== initials) return { ok: false, reason: 'the sentence does not have one word per element in order' };
    }
  } else {
    const low = mnemonic.toLowerCase();
    let at = 0;
    for(const s of steps){
      const cue = s.cue.toLowerCase().replace(/[^a-z0-9' -]/g, '').trim();
      const idx = cue.length >= 2 ? low.indexOf(cue, at) : -1;
      if(idx < 0) return { ok: false, reason: 'a cue word is missing from the text, or out of order' };
      at = idx + cue.length;
    }
  }
  return { ok: true, value: { type, mnemonic, steps, why: String(raw.why || '').trim(), picture: String(raw.picture || '').trim(), anchor: '' } };
}
function normalizeMnemonics(rawItems, items, source){
  const made = [], dropped = [], skipped = [];
  const byKey = {};
  (Array.isArray(rawItems) ? rawItems : []).forEach(r => { if(r && r.key) byKey[r.key] = r; });
  items.forEach((item, i) => {
    const v = validateMnemonic(byKey[item.key], item);
    if(v.ok){
      made.push({
        id: 'mn_' + Date.now().toString(36) + '_' + i + Math.floor(Math.random() * 1000).toString(36),
        source, key: item.key, title: item.title, kind: item.kind,
        elements: item.kind === 'term' ? [] : item.elements.slice(),
        definition: item.kind === 'term' ? item.definition : '',
        ...v.value,
        box: 0, nextReview: null, lastReviewed: null, lastAdvanceDate: null, reviewCount: 0, createdAt: Date.now(),
      });
    } else if(v.skipped) skipped.push({ title: item.title, reason: v.reason });
    else dropped.push({ title: item.title, reason: v.reason });
  });
  return { made, dropped, skipped };
}
async function generateMnemonics(courseName, items, apiKey, onProgress){
  const prompt = buildMnemonicPrompt(courseName, items);
  const raw = await fetchClaudeStreamWithProgress({
    model: 'claude-sonnet-4-6',
    max_tokens: 64000,
    temperature: 0.8,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 900 * items.length + 600, onProgress);
  const parsed = JSON.parse(extractJSON(raw));
  return parsed.items;
}

function mnemonicBigHtml(m){
  if(m.type === 'acronym'){
    return `<div style="font-size:28px;font-weight:700;letter-spacing:6px;color:var(--oxblood);line-height:1.3;">${escapeHtml(m.mnemonic.toUpperCase())}</div>`;
  }
  if(m.type === 'acrostic'){
    const words = m.mnemonic.split(/\s+/).filter(Boolean).map(w => {
      const i = w.search(/[A-Za-z]/);
      if(i < 0) return escapeHtml(w);
      return escapeHtml(w.slice(0, i)) + `<b style="color:var(--oxblood);font-size:1.2em;">${escapeHtml(w.charAt(i))}</b>` + escapeHtml(w.slice(i + 1));
    });
    return `<div style="font-size:19px;line-height:1.6;">${words.join(' ')}</div>`;
  }
  return `<div style="font-size:16px;line-height:1.7;white-space:pre-line;">${escapeHtml(m.mnemonic)}</div>`;
}
function mnemonicDecodeHtml(m){
  if(m.kind === 'term'){
    return `<div style="font-size:14px;line-height:1.6;margin-top:8px;"><b>What the hook carries:</b> ${escapeHtml(m.anchor)}</div>
      <div style="font-size:14px;line-height:1.6;margin-top:4px;"><b>Meaning:</b> ${escapeHtml(m.definition)}</div>`;
  }
  // The element text shown here always comes from the stored source elements, never from the model.
  return `<div style="margin-top:10px;">${m.steps.map((s, i) => `
    <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:6px;font-size:14px;line-height:1.55;">
      <span class="firac-tag firac-tag-${'abcde'.charAt(i % 5)}" style="flex:0 0 auto;">${escapeHtml(s.cue)}</span>
      <div style="min-width:0;"><b>${escapeHtml(s.keyword)}</b> &mdash; ${escapeHtml(m.elements[i] || '')}</div>
    </div>`).join('')}</div>`;
}
function mnemonicCardHtml(m, opts){
  const t = MNEMONIC_TYPES[m.type] || { label: m.type };
  const hideHook = opts && opts.hideMnemonic;
  return `
    <div style="padding:12px 14px;background:var(--paper);border-left:3px solid var(--oxblood);">
      <div style="margin-bottom:8px;"><span class="firac-tag firac-tag-c">${escapeHtml(t.label)}</span>${m.why ? ` <span style="font-size:13px;color:var(--ink-soft);font-style:italic;">${escapeHtml(m.why)}</span>` : ''}</div>
      ${hideHook ? '' : mnemonicBigHtml(m)}
      ${m.picture && !hideHook ? `<div style="font-size:13.5px;line-height:1.6;color:var(--ink-soft);font-style:italic;margin-top:6px;"><b style="font-style:normal;">Picture it:</b> ${escapeHtml(m.picture)}</div>` : ''}
      ${mnemonicDecodeHtml(m)}
    </div>`;
}

  let selected = {};          // key -> true

    });
  }
  const boxLabel = (m) => !m.reviewCount ? 'New' : ('Box ' + (m.box || 1) + ' of 5');
  const dueLabel = (m) => !m.reviewCount ? 'not studied yet' : (isMnemonicDue(m) ? 'due now' : 'next ' + m.nextReview);

  function refresh(){
    renderTabs();
    helpEl.innerHTML = HELP[source];
    const data = mnemonicSourceItems(source, courseId);

    const byKey = {}; mine.forEach(m => { byKey[m.key] = m; });
    if(!data){
      controlsEl.innerHTML = '';
      listEl.innerHTML = `<div class="help">${escapeHtml(MNEMONIC_SOURCES[source].empty)}</div>`;
      return;
    }
    const flat = [];
    data.groups.forEach(g => g.items.forEach(i => flat.push(i)));
    const dueCount = mine.filter(isMnemonicDue).length;
    const needsMnemonic = (i) => (!byKey[i.key] || mnemonicIsStale(byKey[i.key], i)) && (i.kind !== 'term' || i.suggested);
    // Controls are drawn separately so ticking a box never re-draws (and closes) the lists below.
    function drawControls(){
      const nSel = flat.filter(i => selected[i.key]).length;
      const todo = flat.filter(needsMnemonic);
      const label = MNEMONIC_SOURCES[source].label;
      controlsEl.innerHTML = `
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;padding-bottom:10px;border-bottom:1px solid var(--rule);">
          <button class="btn" id="mnGenAll" ${todo.length ? '' : 'disabled'}>${mine.length ? 'Generate the rest' : 'Generate'} ${escapeHtml(label.toLowerCase())} mnemonics${todo.length ? ' (' + todo.length + ')' : ''}</button>
          ${mine.length ? `<button class="btn ghost" id="mnStudyDue" ${dueCount ? '' : 'disabled'}>Study due (${dueCount})</button><button class="btn ghost" id="mnStudyAll">Practice all (${mine.length})</button>` : ''}
          <span class="mono" style="font-size:10.5px;color:var(--ink-soft);">${todo.length ? (source === 'dictionary' ? 'Covers the suggested terms, and skips any where a mnemonic would not help.' : 'Covers every ' + (source === 'outline' ? 'topic map and topic' : 'rule') + ' below that does not have one yet.') : 'Everything here has a mnemonic.'}</span>
        </div>
        <details style="width:100%;margin-top:8px;"><summary style="cursor:pointer;font-size:13px;color:var(--oxblood);">Pick specific ones instead</summary>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
            <button class="btn ghost" id="mnGenBtn" ${nSel ? '' : 'disabled'}>Make for selected (${nSel})</button>
            <button class="btn ghost" id="mnSelNew">Select new</button>
            <button class="btn ghost" id="mnSelClear" ${nSel ? '' : 'disabled'}>Clear</button>
          </div>
        </details>
      `;
      const syncChecks = () => { listEl.querySelectorAll('.mnChk').forEach(c => { c.checked = !!selected[flat[parseInt(c.dataset.idx, 10)].key]; }); drawControls(); };
      const selNew = document.getElementById('mnSelNew');
      if(selNew) selNew.onclick = () => {
        selected = {};
        flat.filter(needsMnemonic).slice(0, MNEMONIC_MAX_SELECT).forEach(i => { selected[i.key] = true; });
        syncChecks();
      };
      const selClear = document.getElementById('mnSelClear');
      if(selClear) selClear.onclick = () => { selected = {}; syncChecks(); };
      const genBtn = document.getElementById('mnGenBtn');
      if(genBtn) genBtn.onclick = () => generate(genBtn, flat.filter(i => selected[i.key]));
      const genAll = document.getElementById('mnGenAll');
      if(genAll) genAll.onclick = () => {
        const batches = Math.ceil(todo.length / MNEMONIC_BATCH);
        if(todo.length > 18 && !confirm('This will make ' + todo.length + ' mnemonics in ' + batches + ' requests. Continue?')) return;
        generate(genAll, todo, { all: true });
      };
      const dueBtn = document.getElementById('mnStudyDue');
      if(dueBtn) dueBtn.onclick = () => startSession(getMnemonics(courseId).filter(m => m.source === source && isMnemonicDue(m)));
      const allBtn = document.getElementById('mnStudyAll');
      if(allBtn) allBtn.onclick = () => startSession(getMnemonics(courseId).filter(m => m.source === source));
    }
    const rowHtml = (item) => {
      const idx = flat.indexOf(item);
      const m = byKey[item.key];
      const stale = m && mnemonicIsStale(m, item);
      const meta = item.kind === 'term' ? '' : `<span class="mono" style="font-size:10.5px;color:var(--ink-soft);margin-left:6px;">${item.elements.length} parts</span>`;
      return `
        <div style="margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:8px;">
          <label style="display:flex;gap:8px;align-items:baseline;cursor:pointer;text-transform:none;letter-spacing:0;font-family:inherit;font-size:14.5px;line-height:1.5;color:var(--ink);">
            <input type="checkbox" class="mnChk" data-idx="${idx}" ${selected[item.key] ? 'checked' : ''} style="flex:0 0 auto;" />
            <span><b>${escapeHtml(item.title)}</b>${meta}${m ? ` <span class="mono" style="font-size:10.5px;color:var(--ink-soft);margin-left:6px;">${escapeHtml(MNEMONIC_TYPES[m.type] ? MNEMONIC_TYPES[m.type].label : m.type)} &middot; ${escapeHtml(boxLabel(m))} &middot; ${escapeHtml(dueLabel(m))}</span>` : ''}</span>
          </label>
          ${stale ? `<div style="font-size:12.5px;color:var(--oxblood);margin:4px 0 0 26px;">The source changed since this was made. Select it and remake it.</div>` : ''}
          ${m ? `<details style="margin:6px 0 0 26px;"><summary style="cursor:pointer;font-size:13px;color:var(--oxblood);">Show mnemonic</summary>
            <div style="margin-top:8px;">${mnemonicCardHtml(m)}</div>
            <div style="margin-top:8px;"><button class="btn ghost mnDel" data-id="${escapeHtml(m.id)}" style="font-size:12px;padding:6px 12px;">Delete</button></div>
          </details>` : ''}
        </div>`;
    };
    const parts = [];
    data.groups.forEach(g => {
      if(!g.items.length) return;
      const inner = g.items.map(rowHtml).join('');
      parts.push(g.collapsed
        ? `<details style="margin-top:12px;"><summary style="cursor:pointer;font-family:'Libre Caslon Display',serif;font-size:17px;color:var(--oxblood);">${escapeHtml(g.label)} (${g.items.length})</summary><div class="help" style="margin:6px 0 8px;">${escapeHtml(g.hint)}</div>${inner}</details>`
        : `<div class="section-label" style="margin-top:12px;">${escapeHtml(g.label)}</div><div class="help" style="margin:0 0 8px;">${escapeHtml(g.hint)}</div>${inner}`);
    });
    if(data.skipped && data.skipped.length){
      parts.push(`<details style="margin-top:14px;"><summary style="cursor:pointer;font-size:13px;color:var(--ink-soft);">${data.skipped.length} left out (fewer than ${MNEMONIC_MIN_ELEMENTS} elements, quicker to just read)</summary><div style="font-size:13px;line-height:1.7;margin-top:6px;">${data.skipped.map(s => escapeHtml(s.title)).join('; ')}</div></details>`);
    }
    if(!flat.length) parts.push(`<div class="help">Nothing here has three or more parts yet, so there is nothing a mnemonic would help with.</div>`);
    listEl.innerHTML = parts.join('');

    listEl.querySelectorAll('.mnChk').forEach(c => {
      c.onchange = () => { const it = flat[parseInt(c.dataset.idx, 10)]; if(c.checked) selected[it.key] = true; else delete selected[it.key]; drawControls(); };
    });
    drawControls();
    listEl.querySelectorAll('.mnDel').forEach(b => {
      b.onclick = async () => {
        if(!confirm('Delete this mnemonic?')) return;
        saveMnemonics(courseId, getMnemonics(courseId).filter(m => m.id !== b.dataset.id));
        refresh();
        if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      };
    });
  }

  async function generate(btn, items, opts){
    if(busy) return;
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    if(!(opts && opts.all) && items.length > MNEMONIC_MAX_SELECT){ errEl.innerHTML = `<div class="err-box">Pick up to ${MNEMONIC_MAX_SELECT} at a time.</div>`; return; }
    errEl.innerHTML = '';
    busy = true;
    const originalLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Making...';
    const { update, cleanup } = showDeterminateBar(btn);
    const made = [], dropped = [], skipped = [];
    let failure = null;
    try{
      for(let i = 0; i < items.length; i += MNEMONIC_BATCH){
        const batch = items.slice(i, i + MNEMONIC_BATCH);
        if(items.length > MNEMONIC_BATCH) btn.textContent = 'Making ' + (i + 1) + '-' + Math.min(i + MNEMONIC_BATCH, items.length) + ' of ' + items.length + '...';
        const raw = await generateMnemonics(course ? course.name : '', batch, state.settings.anthropicKey, update);
        const r = normalizeMnemonics(raw, batch, source);
        made.push(...r.made); dropped.push(...r.dropped); skipped.push(...r.skipped);
        // Save as each batch lands, so a failure part-way keeps everything already made.
        if(r.made.length){
          const keys = new Set(r.made.map(m => m.key));
          saveMnemonics(courseId, getMnemonics(courseId).filter(m => !(m.source === source && keys.has(m.key))).concat(r.made));
        }
      }
    }catch(e){ failure = e; }
    cleanup();
    busy = false;
    if(made.length){
      selected = {};
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
    }
    const notes = [];
    if(made.length) notes.push(`<div class="help">Made ${made.length} mnemonic${made.length === 1 ? '' : 's'}. Open one with "Show mnemonic".</div>`);
    if(skipped.length) notes.push(`<div class="help">Skipped ${skipped.length} where a mnemonic would not help: ${skipped.map(s => escapeHtml(s.title + ' (' + s.reason + ')')).join('; ')}.</div>`);
    if(dropped.length) notes.push(`<div class="err-box">${dropped.length} did not pass the accuracy check and were not saved: ${dropped.map(s => escapeHtml(s.title + ' (' + s.reason + ')')).join('; ')}. Select them and try again.</div>`);
    if(failure) notes.push(`<div class="err-box">Could not finish: ${escapeHtml(failure.message)}</div>`);
    errEl.innerHTML = notes.join('');
    refresh();
  }

  function startSession(pool){
    if(!pool.length) return;
    const ids = pool.map(m => m.id);
    for(let i = ids.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const queue = ids.slice();
    const retried = new Set();
    let right = 0, total = 0;
    listEl.style.display = 'none';
    controlsEl.style.display = 'none';
    errEl.innerHTML = '';

    const endSession = async () => {
      studyEl.innerHTML = `
        <div class="summary-body" style="padding:14px;background:var(--paper);"><b>Session done.</b> ${right} of ${total} fully recalled on the first try.${right < total ? ' The ones you missed are back in Box 1 and will come around again soon.' : ''}</div>
        <button class="btn" id="mnBackBtn" style="margin-top:12px;">Back to the list</button>`;
      document.getElementById('mnBackBtn').onclick = () => { studyEl.innerHTML = ''; listEl.style.display = ''; controlsEl.style.display = 'flex'; refresh(); };
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
    };
    const showTeach = (m) => {
      studyEl.innerHTML = `
        <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">New &middot; learn it, then you'll be tested</div>
        <div style="font-family:'Libre Caslon Display',serif;font-size:19px;color:var(--oxblood);margin-bottom:10px;">${escapeHtml(m.title)}</div>
        ${mnemonicCardHtml(m)}
        <button class="btn" id="mnTestBtn" style="margin-top:12px;">Test me on this</button>`;
      document.getElementById('mnTestBtn').onclick = () => showQuiz(m);
    };
    const showQuiz = (m) => {
      const isRetry = retried.has(m.id);
      const prompt = m.kind === 'term'
        ? 'What does this term mean? Recall your hook first, then say the meaning.'
        : 'Recall your mnemonic, then say what each part stands for (' + m.steps.length + ' parts).';
      studyEl.innerHTML = `
        <div class="mono" style="font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">${escapeHtml(MNEMONIC_SOURCES[m.source] ? MNEMONIC_SOURCES[m.source].label : '')} &middot; ${queue.length} more after this</div>
        <div style="font-family:'Libre Caslon Display',serif;font-size:19px;color:var(--oxblood);margin-bottom:6px;">${escapeHtml(m.title)}</div>
        <div style="font-size:14px;margin-bottom:8px;">${escapeHtml(prompt)}</div>
        <textarea id="mnRecallInput" rows="4" style="width:100%;" placeholder="Type what you remember (optional, it is not saved)"></textarea>
        <div style="margin-top:10px;"><button class="btn" id="mnRevealBtn">Show the answer</button></div>
        <div id="mnFeedback" style="margin-top:14px;"></div>`;
      document.getElementById('mnRevealBtn').onclick = () => {
        document.getElementById('mnRevealBtn').disabled = true;
        document.getElementById('mnFeedback').innerHTML = `
          ${mnemonicCardHtml(m)}
          <div style="font-size:13.5px;margin:12px 0 8px;">Be strict: a half-remembered part is a miss.</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" id="mnGotBtn">I had every part</button><button class="btn ghost" id="mnMissBtn">I missed some</button></div>`;
        const answer = (gotIt) => {
          if(!isRetry){ total++; if(gotIt) right++; recordMnemonicAnswer(courseId, m.id, gotIt); }
          if(!gotIt && !retried.has(m.id)){ retried.add(m.id); queue.push(m.id); }
          next();
        };
        document.getElementById('mnGotBtn').onclick = () => answer(true);
        document.getElementById('mnMissBtn').onclick = () => answer(false);
      };
    };
    function next(){
      if(!queue.length){ endSession(); return; }
      const id = queue.shift();
      const m = getMnemonics(courseId).find(x => x.id === id);
      if(!m){ next(); return; }
      if(!m.reviewCount && !retried.has(m.id)) showTeach(m); else showQuiz(m);
    }
    next();
  }

  refresh();
}

async function generateMBEQuestion(subjectName, combinedText, apiKey, onProgress){
  const prompt = `Write ONE realistic MBE-style multiple-choice question for "${subjectName}", using ONLY the class material below. Do not invent doctrine, elements, or exceptions beyond what's reflected in this material — if the coverage is thin, write a more basic question rather than reaching for outside bar-prep knowledge the student wasn't actually taught.

Match the real MBE format: a fact pattern (3-5 sentences), a clear call of the question, and four answer choices where one is correct and the other three are plausible distractors (not obviously wrong) — the kind that test a specific misunderstanding, not random wrong answers.

CLASS MATERIAL:
${combinedText || '(none available yet)'}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "scenario": "the fact pattern",
  "question": "the call of the question",
  "choices": { "A": "...", "B": "...", "C": "...", "D": "..." },
  "correctAnswer": "A",
  "explanation": "why the correct answer is right, and for each of the other three, specifically why it's wrong — this is the actual teaching moment, not just a verdict"
}`;

  const raw = await fetchClaudeStreamWithProgress({
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 64000,
    temperature: 0.4,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 900, onProgress);
  return JSON.parse(extractJSON(raw));
}

async function generateBarReview(subjectName, combinedText, apiKey, onProgress){
  const prompt = `You are helping a law student build a condensed bar-exam review for "${subjectName}", using ONLY the class material below from courses they've actually taken. Do not add doctrine, elements, or exceptions that aren't reflected in this material — if their coverage of a sub-topic was thin, the review should be thin there too, not padded with outside bar-prep knowledge. This is meant to consolidate what they've actually learned, not substitute for a complete commercial bar course.

Organize by sub-topic within ${subjectName}, and for each rule give: the rule name, its elements as a numbered list, and any qualifiers/exceptions/majority-minority splits the material covers. Keep it as condensed, high-yield black-letter law — this is a review document, not a teaching document.

TABLES: use a Markdown table wherever the material is genuinely a side-by-side comparison — majority vs. minority rule, elements/remedies/defenses compared across a few similar rules, statute of limitations periods across claims. Use standard Markdown table syntax:

| Rule | Element | Standard |
|------|---------|----------|
| Example | Example | Example |

Use sparingly — most rules with a flat list of elements don't need one. Keep any table small and place it directly under the rule it compares.

CLASS MATERIAL:
${combinedText || '(none available yet)'}

Return as clean Markdown (## sub-topic headers, numbered lists for elements, occasional tables for genuine comparisons). End with a short "Coverage note" section flagging, in one or two sentences, that this reflects only the material provided and is not a complete review of ${subjectName} for bar purposes. Return ONLY the review itself — no other preamble or commentary.`;

  return await fetchClaudeStreamWithProgress({
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 64000,
    temperature: 0.2,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 1800, onProgress);
}

  const prompt = `You are building a NextGen UBE-style Integrated Question Set for a law student studying "${courseName}", using their own class material below. NextGen shifted the bar toward testing applied lawyering skills within one connected scenario, not just doctrinal recall — so build ONE fact pattern with exactly three connected sub-questions testing different skills in sequence:

Base it on the rules and cases below.

RULES AND KEY POINTS FROM CLASS:
${context.keyPointsText || '(none available yet)'}

CASE LAW DISCUSSED:
${context.caseLaw || '(none available yet)'}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "scenario": "the fact pattern, 3-5 sentences",
  "questions": [
    { "id": "q1", "skill": "Issue-Spotting", "prompt": "..." },

async function gradeIntegratedQuestionSet(scenario, questions, modelAnswers, studentAnswers, apiKey, onProgress){
  const qaText = questions.map(q => `[${q.skill}] ${q.prompt}\nModel answer (reference only): ${modelAnswers[q.id]||''}\nStudent answer: ${studentAnswers[q.id]||'(left blank)'}`).join('\n\n');
  const prompt = `A law student completed a NextGen UBE-style Integrated Question Set. Grade each of their three answers against the skill it was testing (issue-spotting, rule application, or professional judgment), using the model answers only as your own reference, not as a rigid script.

SCENARIO: ${scenario}

${qaText}

Return ONLY a JSON object, no markdown fences, no commentary:
{
  "perQuestion": [
    { "id": "q1", "feedback": "specific feedback on this answer against the skill it was testing" },
    { "id": "q2", "feedback": "..." },
    { "id": "q3", "feedback": "..." }
  ],
  "overall": "1-2 sentences on the strongest and weakest part of the set as a whole"
}`;

  const raw = await fetchClaudeStreamWithProgress({
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 64000,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 1000, onProgress);
  return JSON.parse(extractJSON(raw));
}

async function generateProfessorTips(courseName, context, apiKey, onProgress){
  if(!context.tipsText || !context.tipsText.trim()){
    return "No professor tips have been flagged yet. This section only fills in when a lecture's transcript captures the professor speaking explicitly about exam craft, emphasis, or common mistakes — not substantive rules, which live in your Outline and Rule Bank instead.";
  }
  const prompt = `You are helping a law student build a "Tips from Professor" reference for "${courseName}" — a cumulative, deduplicated summary of everything this specific professor has said about how THEY want the exam approached, what THEY personally emphasize, and what THEY'VE warned students get wrong. This is distinct from the substantive rules themselves (those live in the Outline and Rule Bank) — this document is purely about professor-specific exam craft and expectations.

Below are tip-like remarks already flagged from each lecture, by date. Synthesize and deduplicate them — the same warning often gets repeated across sessions in slightly different words — and organize them into exactly these three sections, using bold labels:

**Exam Format &amp; Expectations** — anything the professor said about how the exam itself works, what they weigh most, or how they want answers structured.

**Common Mistakes to Avoid** — specific errors the professor has flagged students making, repeatedly or explicitly.

**Emphasis — Likely to Be Tested** — anything the professor signaled as especially important, a favorite topic, or something they said "always" or "definitely" comes up.

Within each section, use a dash list. If a section has nothing to put in it, omit that section entirely rather than including it empty. Do not invent or infer a tip that isn't clearly present below — if the flagged material is thin, a short result is correct and expected.

FLAGGED REMARKS BY LECTURE:
${context.tipsText}

Return as clean Markdown text only (bold section labels, dash lists). Return ONLY the tips document itself — no preamble, no commentary.`;

  return await fetchClaudeStreamWithProgress({
    model: 'claude-sonnet-4-6',
    max_tokens: 64000,
    temperature: 0.2,
    messages: [{ role: 'user', content: prompt }]
  }, apiKey, 1000, onProgress);
}

function clearSearchHighlights(container){
  container.querySelectorAll('mark.search-hit').forEach(mark => {
    const parent = mark.parentNode;
    if(!parent) return;
    parent.replaceChild(document.createTextNode(mark.textContent), mark);
    parent.normalize();
  });
}
function highlightSearchMatches(container, query){
  // Walks actual text nodes rather than regexing the raw HTML string — a naive string
  // replace could just as easily match inside a tag or attribute and corrupt the
  // rendered document. This only ever touches genuine visible text.
  clearSearchHighlights(container);
  if(!query || !query.trim()) return 0;
  const escaped = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(escaped, 'gi');
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while((node = walker.nextNode())) textNodes.push(node);
  let matchCount = 0;
  textNodes.forEach(textNode => {
    const text = textNode.nodeValue;
    regex.lastIndex = 0;
    if(!regex.test(text)) return;
    regex.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    let m;
    while((m = regex.exec(text))){
      frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.dataset.hitIndex = matchCount;
      mark.style.cssText = 'background:rgba(178,132,45,0.35);color:inherit;';
      mark.textContent = m[0];
      frag.appendChild(mark);
      matchCount++;
      lastIndex = m.index + m[0].length;
      if(m[0].length === 0) regex.lastIndex++;
    }
    frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    textNode.parentNode.replaceChild(frag, textNode);
  });
  return matchCount;
}
function wireDocumentSearch(opts){
  // Shared "find in document" wiring for any long generated document (Outline, Rule
  // Bank) — highlights every match, tracks which one is "current" with a stronger
  // highlight, and scrolls it into view. One implementation, reused everywhere a
  // document is long enough to need it, rather than rebuilding this per modal.
  const input = document.getElementById(opts.inputId);
  const countEl = document.getElementById(opts.countId);
  const prevBtn = document.getElementById(opts.prevId);
  const nextBtn = document.getElementById(opts.nextId);
  const container = document.getElementById(opts.containerId);
  if(!input || !container) return;
  let matches = [];
  let current = -1;
  function setActive(idx){
    container.querySelectorAll('mark.search-hit').forEach(m => { m.style.background = 'rgba(178,132,45,0.35)'; });
    if(idx < 0 || idx >= matches.length) return;
    current = idx;
    const el = container.querySelector(`mark.search-hit[data-hit-index="${idx}"]`);
    if(el){
      el.style.background = 'rgba(178,45,45,0.55)';
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    countEl.textContent = `${idx+1} of ${matches.length}`;
  }
  function runSearch(){
    const q = input.value;
    const count = highlightSearchMatches(container, q);
    matches = Array.from({ length: count }, (_, i) => i);
    current = -1;
    if(count > 0){
      countEl.textContent = `0 of ${count}`;
      prevBtn.disabled = false; nextBtn.disabled = false;
      setActive(0);
    } else {
      countEl.textContent = q.trim() ? 'No matches' : '';
      prevBtn.disabled = true; nextBtn.disabled = true;
    }
  }
  input.oninput = runSearch;
  input.onkeydown = (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); if(matches.length) setActive((current+1) % matches.length); }
  };
  nextBtn.onclick = () => { if(matches.length) setActive((current+1) % matches.length); };
  prevBtn.onclick = () => { if(matches.length) setActive((current-1+matches.length) % matches.length); };
}

function renderMarkdown(text){
  // Small purpose-built renderer for the outline/rule-bank output — headers, bold,
  // italics, lists, and tables, styled to match the app rather than showing raw
  // markdown symbols.
  if(!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inList = null;
  let paragraphBuffer = [];

  function inlineFormat(s){
    let out = escapeHtml(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
    out = out.replace(/(^|[^_])_(.+?)_(?!_)/g, '$1<em>$2</em>');
    return out;
  }
  function flushParagraph(){
    if(paragraphBuffer.length){
      html += `<p style="margin:0 0 12px;line-height:1.7;">${inlineFormat(paragraphBuffer.join(' '))}</p>`;
      paragraphBuffer = [];
    }
  }
  function closeList(){
    if(inList){ html += `</${inList === 'ol-alpha' ? 'ol' : inList}>`; inList = null; }
  }
  function parseTableRow(line){
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
  }

  let tableHeaders = null;
  let tableRows = [];
  function flushTable(){
    if(tableHeaders){
      html += '<div class="doc-table-wrap"><table class="doc-table"><thead><tr>' +
        tableHeaders.map(h => `<th>${inlineFormat(h.trim())}</th>`).join('') +
        '</tr></thead><tbody>' +
        tableRows.map(row => '<tr>' + row.map(c => `<td>${inlineFormat(c.trim())}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>';
    }
    tableHeaders = null;
    tableRows = [];
  }

  for(let i = 0; i < lines.length; i++){
    const rawLine = lines[i];
    const line = rawLine.trimEnd();

    if(tableHeaders){
      if(/^\|.*\|$/.test(line.trim())){
        tableRows.push(parseTableRow(line));
        continue;
      }
      flushTable();
      // fall through — this line isn't a table row, so let it be processed normally below
    }
    if(!tableHeaders && /^\|.*\|$/.test(line.trim()) && lines[i+1] && /^\|[\s:|-]+\|$/.test(lines[i+1].trim())){
      flushParagraph(); closeList();
      tableHeaders = parseTableRow(line);
      i++; // skip the separator row
      continue;
    }

    if(!line.trim()){ flushParagraph(); closeList(); continue; }

    const h1 = line.match(/^#\s+(.*)/);
    const h2 = line.match(/^##\s+(.*)/);
    const h3 = line.match(/^###\s+(.*)/);
    const h4 = line.match(/^#{4,6}\s+(.*)/);
    const boldLabel = line.match(/^\*\*(.+?)\*\*:?\s*$/);
    const bullet = line.match(/^[-*]\s+(.*)/);
    const numbered = line.match(/^\d+[.)]\s+(.*)/);
    const lettered = line.match(/^[a-z][.)]\s+(.*)/);

    if(h1){
      flushParagraph(); closeList();
      html += `<div style="font-family:'Libre Caslon Display',serif;font-size:22px;color:var(--oxblood);border-bottom:2px solid var(--oxblood);padding-bottom:6px;margin:28px 0 14px;">${inlineFormat(h1[1])}</div>`;
    } else if(h2){
      flushParagraph(); closeList();
      html += `<div style="font-family:'Libre Caslon Display',serif;font-size:18px;font-weight:700;color:var(--brass);border-bottom:1px solid rgba(178,132,45,0.35);padding-bottom:4px;margin:22px 0 10px;">${inlineFormat(h2[1])}</div>`;
    } else if(h3){
      flushParagraph(); closeList();
      html += `<div style="font-weight:700;font-style:italic;font-size:15.5px;color:var(--ink);margin:16px 0 8px;">${inlineFormat(h3[1])}</div>`;
    } else if(h4){
      flushParagraph(); closeList();
      html += `<div style="font-weight:700;font-size:14.5px;color:var(--ink-soft);margin:14px 0 6px;">${inlineFormat(h4[1])}</div>`;
    } else if(boldLabel){
      flushParagraph(); closeList();
      html += `<div class="mono" style="font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--brass);font-weight:700;margin:14px 0 6px;">${escapeHtml(boldLabel[1])}</div>`;
    } else if(bullet){
      flushParagraph();
      if(inList !== 'ul'){ closeList(); html += '<ul style="margin:0 0 10px;padding-left:22px;">'; inList = 'ul'; }
      html += `<li style="margin-bottom:5px;line-height:1.65;">${inlineFormat(bullet[1])}</li>`;
    } else if(numbered){
      flushParagraph();
      if(inList !== 'ol'){ closeList(); html += '<ol style="margin:0 0 10px;padding-left:22px;">'; inList = 'ol'; }
      html += `<li style="margin-bottom:5px;line-height:1.65;">${inlineFormat(numbered[1])}</li>`;
    } else if(lettered){
      flushParagraph();
      if(inList !== 'ol-alpha'){ closeList(); html += '<ol style="margin:2px 0 10px 12px;padding-left:22px;list-style-type:lower-alpha;">'; inList = 'ol-alpha'; }
      html += `<li style="margin-bottom:4px;line-height:1.6;font-size:0.96em;">${inlineFormat(lettered[1])}</li>`;
    } else {
      paragraphBuffer.push(line.trim());
    }
  }
  flushTable();
  flushParagraph();
  closeList();
  return html;
}

function renderOutlineModal(){
  const course = state.courses.find(c=>c.id===ui.activeCourse);

          <div class="searchwrap" style="flex:1;max-width:none;">
            <span class="icon">&#9906;</span>

          </div>
          <span class="mono" id="outlineSearchCount" style="font-size:11px;color:var(--ink-soft);white-space:nowrap;min-width:60px;text-align:right;"></span>
          <button class="btn ghost" id="outlineSearchPrev" style="padding:6px 10px;font-size:12px;" disabled>&#9650;</button>
          <button class="btn ghost" id="outlineSearchNext" style="padding:6px 10px;font-size:12px;" disabled>&#9660;</button>
        </div>
        ` : ''}
        ${doc.outline ? `<div id="outlineContent" style="font-size:14.5px;">${renderMarkdown(doc.outline)}</div>` : (hasContent ? `<div class="help">No outline generated yet. New lectures added after generating won't be reflected until you regenerate.</div>` : '')}
      </div>
      <div class="modal-foot">
        <button class="btn" id="closeOL2">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('closeOL').onclick = close;
  document.getElementById('closeOL2').onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  if(doc.outline){
    wireDocumentSearch({ inputId: 'outlineSearchInput', countId: 'outlineSearchCount', prevId: 'outlineSearchPrev', nextId: 'outlineSearchNext', containerId: 'outlineContent' });
  }
  const exportBtn = document.getElementById('exportOutlineBtn');
  if(exportBtn){
    exportBtn.onclick = () => {
      const blob = new Blob([doc.outline], {type:'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(course?course.name:'course').replace(/[^a-z0-9]+/gi,'-')}-outline.txt`;
      a.click();
    };
  }
  const flashcardBtn = document.getElementById('flashcardOutlineBtn');
  if(flashcardBtn){
    flashcardBtn.onclick = () => turnIntoFlashcards(flashcardBtn, ui.activeCourse, `${course?course.name:''} outline`, 'outline', doc.outline, close);
  }
  document.getElementById('genOutlineBtn').onclick = async () => {
    if(!state.settings.anthropicKey){ alert('Add an Anthropic API key in Settings first.'); return; }
    const btn = document.getElementById('genOutlineBtn');
    btn.disabled = true; btn.textContent = 'Generating...';
    const { update, cleanup } = showDeterminateBar(btn);
    try{
      const context = buildCourseSynthesisContext(ui.activeCourse);
      const outline = await generateCourseOutline(course?course.name:'', context, state.settings.anthropicKey, update);
      state.courseDocs[ui.activeCourse] = {
        ...(state.courseDocs[ui.activeCourse]||{}),
        outline, outlineGeneratedAt: Date.now(), outlineLectureCount: context.lectureCount,
        outlineExcludedLectures: context.excludedLectures,
        updatedAt: Date.now()
      };
      saveState(['courseDocs']);
      if(state.settings.githubToken){ try{ await syncNow(); }catch(e){ console.error(e); } }
      cleanup();
      close();
      renderOutlineModal();
    }catch(e){
      cleanup();
      alert('Could not generate outline: ' + e.message);
      btn.disabled = false; btn.textContent = doc.outline ? 'Regenerate outline' : 'Generate outline';
    }
  };
}
